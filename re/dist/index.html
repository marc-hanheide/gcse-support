fesh), tikkun olam (repairing the world) and charity (tzedakah). Examples include World Jewish Relief and Magen David Adom UK.","Many Christians also pray, campaign, give money and welcome refugees."]}],"views":[{"label":"Christian","text":"Christians say helping victims is a duty of love. Jesus said that helping the needy is like helping him. Christian Aid and Caritas help victims regardless of religion or side."},{"label":"Jewish","text":"Jews have a duty to save life and heal the world. They help victims through charities and by giving tzedakah."},{"label":"Non-religious","text":"Many non-religious people help victims through charities such as the Red Cross, motivated by compassion and human rights rather than belief in God."}],"terms":[{"term":"victims of war","def":"people harmed by war, such as those killed, injured or made homeless"},{"term":"refugee","def":"a person forced to leave their country because of war or persecution"},{"term":"Christian Aid","def":"a Christian charity helping people in need and war victims worldwide"},{"term":"Caritas","def":"a worldwide network of Catholic charities"},{"term":"tzedakah","def":"Jewish duty of charity and justice"}],"sources":[{"text":"'Whatever you did for one of the least of these brothers and sisters of mine, you did for me.'","ref":"Matthew 25:40","use":"Use from the Sheep and Goats to explain why Christians help victims of war."},{"text":"'Love your neighbour as yourself.'","ref":"Matthew 22:39","use":"Use as the basic reason Christians help anyone in need."},{"text":"'Defend the weak and the fatherless; uphold the cause of the poor and the oppressed.'","ref":"Psalm 82:3","use":"Use for Jewish and Christian duties to protect the vulnerable."},{"text":"'If your enemy is hungry, give him food to eat.'","ref":"Proverbs 25:21","use":"Use for helping victims on any side of a conflict."}],"tip":"Name one organisation and give a specific example of its work. Link its work to a Bible teaching for full marks."}],"flashcards":[{"topic":"td-01","q":"What is conflict?","a":"A serious disagreement between individuals, groups or nations. It can grow into war."},{"topic":"td-01","q":"What is peace, beyond 'no war'?","a":"Harmony, fairness and safety. In Judaism the word is shalom, which also means wholeness and well-being."},{"topic":"td-01","q":"Define justice.","a":"Bringing fairness back to a situation, putting wrongs right."},{"topic":"td-01","q":"Define forgiveness.","a":"Letting go of anger and blame towards someone who has wronged you."},{"topic":"td-01","q":"Define reconciliation.","a":"Making up and rebuilding a relationship after a conflict."},{"topic":"td-01","q":"Why do Christians and Jews value peace?","a":"Humans are made in God's image (Genesis 1:27), so life is sacred. Jesus taught love of enemies, and Jewish teaching values shalom."},{"topic":"td-01","q":"Which Bible quote links peacemakers to God?","a":"'Blessed are the peacemakers, for they will be called children of God' (Matthew 5:9)."},{"topic":"td-01","q":"What is the sanctity of life?","a":"The belief that life is holy because it is created by God."},{"topic":"td-02","q":"Define violence.","a":"Behaviour using physical force to hurt, kill or damage."},{"topic":"td-02","q":"Define terrorism.","a":"The use of violence and threats, usually against civilians, to spread fear and force political demands."},{"topic":"td-02","q":"Give two examples of non-violent protest.","a":"Marches, petitions, vigils, boycotts. Martin Luther King led non-violent protest against racism."},{"topic":"td-02","q":"Why do most Christians reject terrorism?","a":"It kills innocent people, breaks 'You shall not murder' and goes against Jesus' call to love enemies."},{"topic":"td-02","q":"What Jewish value limits violence?","a":"Pikuach nefesh, the duty to save life. Force is allowed only to defend life."},{"topic":"td-02","q":"Which verse shows Jesus rejecting violence at his arrest?","a":"'Put your sword back in its place, for all who draw the sword will die by the sword' (Matthew 26:52)."},{"topic":"td-02","q":"Give a non-religious view on violent protest.","a":"Some say it can be the lesser evil if peaceful protest is ignored. Many say it harms innocents and makes things worse."},{"topic":"td-02","q":"Name one terrorist attack in the UK that might be used as an example.","a":"The London bombings of 7 July 2005, or the Manchester Arena attack in 2017."},{"topic":"td-03","q":"Name three reasons for war in the AQA spec.","a":"Greed, self-defence and retaliation."},{"topic":"td-03","q":"What is greed as a cause of war?","a":"Fighting to gain land, resources or power. Most religious people see this as wrong."},{"topic":"td-03","q":"Why is self-defence the most accepted reason?","a":"It protects people from attack. Just war thinking and Jewish teaching on saving life both allow it."},{"topic":"td-03","q":"What is retaliation?","a":"Hitting back at someone for harming you. It is often condemned because it causes cycles of revenge."},{"topic":"td-03","q":"What is civil war?","a":"Armed conflict between groups inside one country."},{"topic":"td-03","q":"Which teaching of Jesus argues against retaliation?","a":"'Do not repay anyone evil for evil' (Romans 12:17) and turning the other cheek (Matthew 5:39)."},{"topic":"td-03","q":"What does international law say about self-defence?","a":"Article 51 of the UN Charter recognises a state's right to self-defence."},{"topic":"td-03","q":"Give a Jewish view on war for self-defence.","a":"It is a duty, because saving life (pikuach nefesh) is vital. War of choice needs strong justification."},{"topic":"td-04","q":"What are weapons of mass destruction?","a":"Weapons causing widespread, indiscriminate damage: nuclear, chemical and biological weapons."},{"topic":"td-04","q":"What is nuclear deterrence?","a":"Keeping nuclear weapons to put off attackers because of the threat of devastating retaliation."},{"topic":"td-04","q":"When were nuclear weapons used in war?","a":"August 1945, when the USA bombed Hiroshima and Nagasaki, Japan."},{"topic":"td-04","q":"Give two religious arguments against WMD.","a":"They kill civilians and break the sanctity of life, and they cannot meet just war rules of proportionality and discrimination."},{"topic":"td-04","q":"Give an argument for keeping nuclear weapons.","a":"Deterrence: it may prevent attacks and has helped avoid world war since 1945."},{"topic":"td-04","q":"What did Pope Francis say about nuclear weapons in 2017?","a":"That using nuclear weapons, and even possessing them, should be firmly condemned."},{"topic":"td-04","q":"Which Christian group is strongly opposed to nuclear weapons?","a":"The Quakers, because of their Peace Testimony."},{"topic":"td-04","q":"Give a non-religious argument against nuclear weapons.","a":"They cost billions each year, risk accidents and could kill huge numbers of innocents."},{"topic":"td-05","q":"Who first set out Christian ideas on just war, and who developed the criteria?","a":"St Augustine started the ideas. St Thomas Aquinas developed them in the 13th century."},{"topic":"td-05","q":"List the just war criteria.","a":"Just cause, legitimate authority, right intention, last resort, reasonable chance of success, proportionality, discrimination."},{"topic":"td-05","q":"What does proportionality mean?","a":"Using only as much force as needed, with no excessive harm."},{"topic":"td-05","q":"What does legitimate authority mean?","a":"The war must be declared by a proper government or ruler."},{"topic":"td-05","q":"What does discrimination mean in just war?","a":"Civilians must not be deliberately attacked."},{"topic":"td-05","q":"What does last resort mean?","a":"All peaceful ways, such as talks and sanctions, must be tried first."},{"topic":"td-05","q":"What are milchemet mitzvah and milchemet reshut?","a":"Jewish terms for obligatory war (such as defence) and optional war, which needs stronger authority."},{"topic":"td-05","q":"Give one weakness of the just war theory.","a":"People disagree about whether the rules are met, and modern weapons make proportionality and discrimination hard."},{"topic":"td-06","q":"What is a holy war?","a":"A war fought for a religious cause, believed to have God's approval and usually authorised by a religious leader."},{"topic":"td-06","q":"What were the Crusades?","a":"Christian holy wars from 1095 onwards to take control of the Holy Land, called by the Pope."},{"topic":"td-06","q":"What is the Holy Land?","a":"Jerusalem and nearby areas, sacred to Jews, Christians and Muslims."},{"topic":"td-06","q":"Why do many modern Christians reject holy war?","a":"It conflicts with Jesus' teaching to love enemies and seek peace."},{"topic":"td-06","q":"Is holy war a main idea in modern Judaism?","a":"No. Jews accept war mainly for defence, and most focus on peace today."},{"topic":"td-06","q":"Give two examples of conflicts where religion has been a factor.","a":"The Troubles in Northern Ireland and the Israel-Palestine conflict."},{"topic":"td-06","q":"Why is it hard to say religion is the only cause of a war?","a":"Most conflicts also involve politics, land, power and identity."},{"topic":"td-06","q":"Give a non-religious view on religion and war.","a":"Some say religion divides people and causes violence. Others say politics and power are the real causes."},{"topic":"td-07","q":"Define pacifism.","a":"The belief that war and violence are always wrong."},{"topic":"td-07","q":"What is the Quaker Peace Testimony?","a":"The Quaker commitment to refuse to fight and to work for peace and justice."},{"topic":"td-07","q":"Who was Desmond Doss?","a":"A Seventh-day Adventist pacifist who served as an unarmed medic in the Second World War and saved many lives."},{"topic":"td-07","q":"What is Corrymeela?","a":"A Christian reconciliation community in Northern Ireland founded in 1965 that brings people from different sides together."},{"topic":"td-07","q":"What is Pax Christi?","a":"A Catholic peace movement that works for peace, justice and disarmament."},{"topic":"td-07","q":"What did Martin Luther King use to campaign against racism?","a":"Non-violent protest, such as marches and boycotts."},{"topic":"td-07","q":"What did Desmond Tutu do after apartheid?","a":"Led the South African Truth and Reconciliation Commission to encourage forgiveness and healing."},{"topic":"td-07","q":"Give one argument against pacifism.","a":"It might leave innocent people undefended against a greater evil."},{"topic":"td-08","q":"Name two Christian organisations that help victims of war.","a":"Christian Aid and Caritas, including its English and Welsh arm CAFOD."},{"topic":"td-08","q":"When was Christian Aid started and why?","a":"In 1945, by British and Irish churches, to help refugees."},{"topic":"td-08","q":"Which parables inspire Christians to help victims?","a":"The Good Samaritan and the Sheep and Goats."},{"topic":"td-08","q":"Give two ways charities help victims of war.","a":"Emergency food, water and shelter for refugees, and help rebuilding lives and communities."},{"topic":"td-08","q":"Which Jewish duties encourage helping victims?","a":"Pikuach nefesh (saving life), tikkun olam (repairing the world) and tzedakah (charity)."},{"topic":"td-08","q":"Which verse says helping the needy is like helping Jesus?","a":"'Whatever you did for one of the least of these... you did for me' (Matthew 25:40)."},{"topic":"td-08","q":"Why might a non-religious person help war victims?","a":"Compassion and human rights, for example through the Red Cross."},{"topic":"td-08","q":"What is a refugee?","a":"A person forced to leave their country because of war or persecution."}],"quiz":[{"topic":"td-01","q":"Which term means making up and rebuilding a relationship after conflict?","options":["Retaliation","Deterrence","Reconciliation","Pacifism"],"answer":2,"why":"Reconciliation means restoring friendly relations after a conflict."},{"topic":"td-01","q":"In Judaism, what is the word for peace and wholeness?","options":["Shalom","Mitzvah","Tzedakah","Teshuvah"],"answer":0,"why":"Shalom means peace, wholeness and well-being."},{"topic":"td-01","q":"Which Bible quote does a Christian most likely use to show peace is a duty?","options":["Eye for eye","Honour your father","Be fruitful and multiply","Blessed are the peacemakers"],"answer":3,"why":"Matthew 5:9 links peacemaking directly with being a child of God."},{"topic":"td-01","q":"Why do Christians say life is sacred?","options":["Because it is long","Because humans are made in God's image","Because law says so","Because wealth matters"],"answer":1,"why":"Genesis 1:27 teaches that humans are made in God's image."},{"topic":"td-02","q":"Which best defines terrorism?","options":["Any protest","Defending a country","Violence against civilians to cause fear and win political aims","Peaceful marching"],"answer":2,"why":"Terrorism uses violence and threats, usually against civilians, for political aims."},{"topic":"td-02","q":"What did Jesus say to Peter at his arrest?","options":["Put your sword back","Run away","Fight on","Call the guards"],"answer":0,"why":"Matthew 26:52 shows Jesus rejecting violence."},{"topic":"td-02","q":"Which Jewish duty puts saving life first?","options":["Kashrut","Tikkun olam","Tzedakah","Pikuach nefesh"],"answer":3,"why":"Pikuach nefesh means saving a life takes priority over almost everything."},{"topic":"td-02","q":"Martin Luther King is an example of which approach?","options":["Terrorism","Non-violent protest","Holy war","Retaliation"],"answer":1,"why":"King led peaceful campaigns against racism."},{"topic":"td-03","q":"Which is NOT a reason for war listed by AQA?","options":["Greed","Self-defence","Fashion","Retaliation"],"answer":2,"why":"AQA lists greed, self-defence and retaliation, among others."},{"topic":"td-03","q":"Fighting to protect your country from attack is called:","options":["Self-defence","Greed","Retaliation","Terrorism"],"answer":0,"why":"Self-defence is the most widely accepted reason for war."},{"topic":"td-03","q":"Which teaching best opposes retaliation?","options":["Rule over the earth","Eye for an eye only","Take what you need","Do not repay evil for evil"],"answer":3,"why":"Romans 12:17 tells Christians not to repay evil for evil."},{"topic":"td-03","q":"War between groups inside one country is:","options":["Cold war","Civil war","Holy war","World war"],"answer":1,"why":"A civil war is internal armed conflict."},{"topic":"td-04","q":"What is nuclear deterrence?","options":["Using bombs first","Banning all weapons","Having weapons to put off attackers","Selling weapons"],"answer":2,"why":"Deterrence relies on the threat of retaliation to stop attack."},{"topic":"td-04","q":"In which year were nuclear weapons used in war?","options":["1945","1939","1914","1962"],"answer":0,"why":"Hiroshima and Nagasaki were bombed in August 1945."},{"topic":"td-04","q":"A key just war problem with nuclear weapons is that they:","options":["Are cheap","Are not strong","Are always legal","Cannot protect civilians or be proportionate"],"answer":3,"why":"They cause indiscriminate harm to civilians, which breaks just war rules."},{"topic":"td-04","q":"Which Christian group is firmly opposed to nuclear weapons?","options":["Crusaders","Quakers","Zealots","Sadducees"],"answer":1,"why":"Quakers are opposed because of their Peace Testimony."},{"topic":"td-05","q":"Who developed the just war criteria in the 13th century?","options":["Augustine","Luther","Aquinas","Calvin"],"answer":2,"why":"Aquinas built on Augustine and set out the criteria."},{"topic":"td-05","q":"Which criterion means all peaceful options have been tried?","options":["Last resort","Proportionality","Right intention","Discrimination"],"answer":0,"why":"Last resort means war only after other methods fail."},{"topic":"td-05","q":"A war that targets civilians breaks which criterion?","options":["Just cause","Last resort","Legitimate authority","Discrimination"],"answer":3,"why":"Discrimination protects civilians."},{"topic":"td-05","q":"What is milchemet mitzvah?","options":["Optional war","Obligatory war such as defence","Holy pilgrimage","War protest"],"answer":1,"why":"It is a war Jews are required to fight, such as self-defence."},{"topic":"td-06","q":"A war fought for a religious cause and approved by God is a:","options":["Civil war","Cold war","Holy war","Just war"],"answer":2,"why":"This is the definition of holy war."},{"topic":"td-06","q":"The Crusades were mainly fought to:","options":["Control the Holy Land","Gain trade","Spread the telephone","Stop pacifism"],"answer":0,"why":"They aimed to take control of the Holy Land, called by the Pope."},{"topic":"td-06","q":"Which conflict is often used as an example of religion linked to violence?","options":["The Falklands","The Cod War","The Suez crisis","The Troubles"],"answer":3,"why":"The Troubles in Northern Ireland involved religious and political identities."},{"topic":"td-06","q":"Why do many Christians reject holy war?","options":["It is cheap","It goes against Jesus' call to love enemies","It is illegal everywhere","It is boring"],"answer":1,"why":"Matthew 5:44 calls Christians to love enemies."},{"topic":"td-07","q":"The Quakers' commitment to peace is called the:","options":["Covenant","Sermon","Peace Testimony","Creed"],"answer":2,"why":"The Peace Testimony is the Quaker commitment to peace."},{"topic":"td-07","q":"Which Christian founded the Corrymeela community in 1965?","options":["Ray Davey","Martin Luther","Pope Urban","Billy Graham"],"answer":0,"why":"Ray Davey and others founded Corrymeela in Northern Ireland."},{"topic":"td-07","q":"Desmond Doss, a pacifist, served in the Second World War as:","options":["A sniper","A pilot","A general","An unarmed medic"],"answer":3,"why":"Doss refused weapons but treated the wounded."},{"topic":"td-07","q":"Which is an argument against pacifism?","options":["It follows Jesus","It may leave innocents undefended","It avoids deaths","It is non-violent"],"answer":1,"why":"Critics say force may be needed to protect the innocent."},{"topic":"td-08","q":"Christian Aid was founded in 1945 to help:","options":["Athletes","Soldiers only","Refugees","Bankers"],"answer":2,"why":"It began as help for refugees after the Second World War."},{"topic":"td-08","q":"Which parable inspires care for victims of war?","options":["Good Samaritan","Mustard Seed","Sower","Lost Coin"],"answer":0,"why":"The Good Samaritan shows love for a stranger in need."},{"topic":"td-08","q":"The Jewish duty of charity is:","options":["Brit milah","Shabbat","Kippah","Tzedakah"],"answer":3,"why":"Tzedakah means charity and justice."},{"topic":"td-08","q":"Caritas is:","options":["A Jewish festival","A Catholic charity network","A weapon","A prayer"],"answer":1,"why":"Caritas is a worldwide network of Catholic charities."}],"exam":[{"topic":"td-04","marks":4,"type":"similar","q":"Explain two similar religious beliefs about a country using weapons of mass destruction. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that Christians say weapons of mass destruction are wrong because they kill huge numbers of innocent people. This breaks the commandment 'You shall not murder' and the Christian belief that life is sacred.\nAnother similar belief, from Judaism, is that saving life (pikuach nefesh) is a very high duty, so Jews say WMD cannot be justified because they destroy life without distinction between soldiers and civilians.","points":["Christian: WMD kill indiscriminately and break 'You shall not murder' / sanctity of life","Christian: do not meet just war rules of proportionality and discrimination","Jewish: pikuach nefesh, protecting life, so WMD are wrong","Jewish: Exodus 20:13; harm to civilians and God's creation","Other valid: Pope Francis condemning possession; Quaker disarmament campaigns; cost and risk of accidents"]},{"topic":"td-05","marks":4,"type":"different","q":"Explain two different religious beliefs about the use of force in war. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that some Christians accept just war theory. They believe force is allowed if it is a last resort and fought for a just cause, such as defending the innocent, so war can sometimes be the lesser evil.\nA different belief is that Quakers are pacifists. They believe all violence is wrong because every person has some of God in them, so they refuse to fight and try to solve conflict peacefully.","points":["Christian just war: force allowed as last resort, just cause, proportionality","Christian pacifism (Quakers): all violence wrong, Peace Testimony, Matthew 5:9","Jewish: defensive war is a duty but optional wars need strong authority","Different views must differ in some clear way, such as just war versus pacifism"]},{"topic":"td-06","marks":4,"type":"different","q":"Explain two different religious views about holy war. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One view is that some Christians in the past believed holy war was acceptable. The Crusades were called by the Pope to take back the Holy Land, and those who fought believed God supported them.\nA different view is that most Christians and Jews today reject holy war. Christians point to Jesus' teaching to love your enemies, and most Jews accept war only for defence, not to spread the faith.","points":["Historical Christian: Crusades, Pope's call, forgiveness of sins promised","Old Testament war commanded by God, for example conquest of Canaan","Modern Christian: Matthew 5:44, love of enemies; peace over holy war","Jewish: war mainly defensive; milchemet mitzvah; holy war rare today"]},{"topic":"td-07","marks":4,"type":"similar","q":"Explain two similar religious beliefs about pacifism. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that Quakers say pacifism is right because Jesus taught people to love their enemies. They refuse to fight and work for peace.\nAnother similar belief is that some other Christians, such as Mennonites, are also pacifists because they believe the commandment 'You shall not murder' means all killing is wrong. Both groups believe violence is never the answer.","points":["Quakers: Peace Testimony, God in everyone, love of enemies","Mennonites/Amish: reject war, follow Sermon on the Mount","Matthew 5:9, 5:39, Exodus 20:13 as sources","Jewish similar view: some Reform Jews work for peace but Judaism is not pacifist overall"]},{"topic":"td-02","marks":4,"type":"similar","q":"Explain two similar religious beliefs about terrorism. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that Christians reject terrorism because it targets innocent people, which goes against Jesus' teaching to love your neighbour and to love your enemies.\nAnother similar belief is that Jews also reject terrorism because it breaks the commandment against murder and ignores the importance of saving life (pikuach nefesh).","points":["Christian: terrorism harms innocents, against love of neighbour and enemy","Christian: sanctity of life; Exodus 20:13","Jewish: murder forbidden, pikuach nefesh","Jewish and Christian: terrorism cannot be justified by religion"]},{"topic":"td-03","marks":4,"type":"different","q":"Explain two different religious beliefs about reasons for going to war. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that some Christians accept self-defence as a reason for war. If a country is attacked, defending people can be a just cause because Christians should protect the innocent.\nA different belief is that Christian pacifists say no reason justifies war, not even self-defence. They follow Jesus' teaching to turn the other cheek and to love enemies.","points":["Self-defence as just cause; protecting innocents; Psalm 82:4","Pacifist Christians: Matthew 5:39, no war even in self-defence","Greed and retaliation condemned by most believers","Jewish view: defensive war a duty because of pikuach nefesh"]},{"topic":"td-07","marks":6,"type":"explain-two-source","q":"Explain two reasons why some Christians work for peace. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Jesus taught Christians to be peacemakers. This means Christians should actively try to end conflict, not just avoid it. In the Sermon on the Mount, Jesus said 'Blessed are the peacemakers, for they will be called children of God.' This means Christians who work for peace are following God and will be seen as his children, so they might join groups such as Pax Christi.\nAnother reason is that Christians believe all humans are made in God's image, so every life is sacred. This means war and violence destroy something God made. In Genesis 1:27, God made humans in his image, so Christians believe they should protect life by helping people to settle disputes peacefully, as Corrymeela does in Northern Ireland.","points":["Reason 1: Jesus taught peacemaking","Source: Matthew 5:9","Application: join peace groups, mediate, work for reconciliation","Reason 2: sanctity of life","Source: Genesis 1:27","Application: protect life, support peace organisations"]},{"topic":"td-08","marks":6,"type":"explain-two-source","q":"Explain two reasons why some Christians help victims of war. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Jesus taught Christians to love their neighbour. This means they should care for anyone in need, even strangers or enemies. In the parable of the Good Samaritan, a Samaritan helps an injured stranger when others ignore him. This shows that Christians should help war victims, for example by giving to Christian Aid or volunteering.\nAnother reason is that Jesus said helping people in need is like helping him. In the parable of the Sheep and Goats Jesus says, 'Whatever you did for one of the least of these brothers and sisters of mine, you did for me.' This means Christians believe they serve Jesus when they feed and shelter refugees, so many support charities such as Caritas.","points":["Reason 1: love your neighbour","Source: Good Samaritan or Matthew 22:39","Application: donate, volunteer, support Christian Aid","Reason 2: serving Jesus through the needy","Source: Matthew 25:40, Sheep and Goats","Application: food, shelter and aid for refugees"]},{"topic":"td-02","marks":6,"type":"explain-two-source","q":"Explain two reasons why many Christians oppose terrorism. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that terrorism kills innocent people, and Christians believe life is sacred. The commandment 'You shall not murder' in Exodus 20:13 forbids unlawful killing. This means Christians believe terrorists break God's law because attacks on civilians are murder, so Christians would condemn any attack, even if the cause is religious.\nAnother reason is that Jesus taught love of enemies and rejected violence. He said, 'Love your enemies and pray for those who persecute you.' This means Christians should respond to wrongdoing with love and forgiveness, not violence, so they usually support peaceful protest and dialogue instead of terrorism.","points":["Reason 1: terrorism is murder of innocents; sanctity of life","Source: Exodus 20:13","Application: condemn all attacks on civilians","Reason 2: Jesus' teaching on love and non-violence","Source: Matthew 5:44 or Matthew 26:52","Application: support peaceful protest and dialogue"]},{"topic":"td-04","marks":6,"type":"explain-two-source","q":"Explain two reasons why many religious people oppose nuclear weapons. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that nuclear weapons cause huge loss of innocent life, which goes against the sanctity of life. The Ten Commandments say 'You shall not murder' (Exodus 20:13). This means a nuclear attack, which cannot avoid killing civilians, would break God's law, so many Christians and Jews support disarmament.\nAnother reason is that nuclear weapons cannot meet the just war rules. Just war theory says a war must be proportionate and protect civilians. Nuclear weapons are so destructive that they cannot be used in this way. Jesus said 'Blessed are the peacemakers', so many Christians feel they should campaign for peace by joining groups such as Pax Christi or supporting disarmament.","points":["Reason 1: sanctity of life and murder","Source: Exodus 20:13","Application: support disarmament","Reason 2: just war criteria cannot be met","Source: Matthew 5:9 or Isaiah 2:4","Application: campaign with Pax Christi or Quakers"]},{"topic":"td-05","marks":6,"type":"explain-two-source","q":"Explain two reasons why some Christians support the just war theory. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Christians believe the innocent should be protected. Sometimes force is the only way to stop great evil. Psalm 82:4 says, 'Rescue the weak and the needy; deliver them from the hand of the wicked.' This means Christians can accept fighting if it is a just cause, such as defending people from attack.\nAnother reason is that just war theory sets limits that make war less harmful. Augustine and Aquinas said war should be a last resort and proportionate. Ecclesiastes 3:8 says there is 'a time for war and a time for peace', so Christians can accept that war may sometimes happen, but only when strict rules are followed.","points":["Reason 1: duty to protect the innocent","Source: Psalm 82:4","Application: just cause, defence of others","Reason 2: theory limits war","Source: Ecclesiastes 3:8 or Augustine and Aquinas","Application: last resort, proportionality, discrimination"]},{"topic":"td-06","marks":6,"type":"explain-two-source","q":"Explain two reasons why many Christians today reject holy war. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Jesus taught Christians to love their enemies. Holy war aims to defeat people because of their faith, which does not fit with this. Jesus said, 'Love your enemies and pray for those who persecute you.' This means Christians should respond with love and prayer, so many today say the Crusades were wrong.\nAnother reason is that Christians believe all human life is sacred, whatever someone's faith. The commandment 'You shall not murder' in Exodus 20:13 applies to everyone. This means killing in the name of religion is murder, so many Christians prefer to work for reconciliation between faiths, for example through dialogue and community projects.","points":["Reason 1: love of enemies","Source: Matthew 5:44","Application: reject Crusades, choose prayer and dialogue","Reason 2: sanctity of all life","Source: Exodus 20:13 or Genesis 1:27","Application: interfaith work and reconciliation"]},{"topic":"td-03","marks":6,"type":"explain-two-source","q":"Explain two reasons why many religious people reject greed or retaliation as reasons for war. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that greed puts wealth and power above people. The Ten Commandments say 'You shall not covet' (Exodus 20:17). This means that going to war to take another country's land or resources is wrong because it breaks God's law and harms innocent people, so religious believers would call it unjust.\nAnother reason is that retaliation keeps violence going. Jesus taught, 'If anyone slaps you on the right cheek, turn to them the other cheek also' (Matthew 5:39). This means Christians should break the cycle of revenge with forgiveness. In practice, many Christians would call for talks instead of revenge attacks.","points":["Reason 1: greed breaks the commandment against coveting","Source: Exodus 20:17","Application: war for resources is unjust","Reason 2: retaliation continues violence","Source: Matthew 5:39 or Romans 12:17","Application: forgiveness, talks, peace-making"]},{"topic":"td-04","marks":12,"type":"evaluate","q":"'Nuclear weapons can never be justified.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Many Christians agree with this statement. Nuclear weapons kill huge numbers of innocent people, so they appear to break the commandment 'You shall not murder' (Exodus 20:13). Christians believe life is sacred because humans are made in God's image, so a weapon that can destroy whole cities treats life as worthless. Nuclear weapons also fail the just war rules of proportionality and discrimination because they cannot avoid harming civilians. Pope Francis said in 2017 that even possessing them should be condemned, and Quakers campaign for disarmament. This is a strong argument because Hiroshima shows the scale of suffering and the damage lasts for generations.\n\nHowever, others disagree. Some Christians and Jews argue that nuclear deterrence has helped keep the peace since 1945, because no country wants to risk being destroyed. Judaism teaches that saving life (pikuach nefesh) is vital, and some Jews argue that after the Holocaust a country must be able to defend its people. Some Christians accept possession as the lesser evil while hoping for disarmament, since the Bible accepts that there is 'a time for war and a time for peace' (Ecclesiastes 3:8). This argument is weaker, because deterrence only works if a country is willing to use the weapons, which most religious leaders say is wrong, and accidents or terrorists could still cause a disaster. A non-religious person might add that the billions spent on Trident could fund health and education.\n\nOverall, I think the statement is mostly convincing. The sanctity of life and just war rules make actual use almost impossible to justify. But the word 'never' is strong, because possession as a deterrent can be seen as a lesser evil even if it is not ideal. So believers have strong reasons to say use cannot be justified, but they disagree about whether keeping the weapons is acceptable.","for":["Nuclear weapons kill innocents and break 'You shall not murder' (Exodus 20:13); sanctity of life, made in God's image","Fail just war rules of proportionality and discrimination; Pope Francis 2017; Quakers and Pax Christi back disarmament; cost and risk of accidents"],"against":["Deterrence has helped keep peace since 1945; some Christians accept possession as a lesser evil","Jewish pikuach nefesh and Holocaust memory: defending the people; a time for war (Ecclesiastes 3:8); countries need protection"],"conclusion":"The sanctity of life and just war rules make use very hard to justify, but possession as deterrence can be seen as a lesser evil, so 'never' is too strong a word for possession.","points":["Developed arguments on both sides with religious teachings","Evaluation of strength of each argument","Justified conclusion","Non-religious views may be credited if relevant"]},{"topic":"td-05","marks":12,"type":"evaluate","q":"'It is impossible to fight a just war today.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Some people agree that a just war is impossible today. Just war theory, developed by Augustine and Aquinas, says that war must be a last resort, proportionate, and must protect civilians. Modern weapons such as missiles and bombs make this very hard, because they often kill civilians. Christian pacifists such as Quakers argue that war never meets these rules, quoting Jesus' command to 'love your enemies' (Matthew 5:44). This is a strong argument because many modern wars have caused huge civilian suffering and refugee crises.\n\nOn the other hand, many Christians believe a just war is still possible. The theory is a guide to judge each case, not a promise that war is good. For example, a defensive war to stop a brutal invader could have a just cause and right intention. Psalm 82:4 tells believers to 'rescue the weak and the needy', which supports using force to protect others. Jews also teach that defensive war can be an obligation, because saving life (pikuach nefesh) matters most. International law also allows self-defence, so non-religious people may agree that some wars can be justified. This argument is persuasive because it accepts that doing nothing against great evil may also be wrong, though it depends on leaders honestly following the rules.\n\nIn my view, a just war is difficult but not impossible. Modern conflict often fails the tests of proportionality and discrimination, but a limited defensive war could still meet all the criteria. The theory remains useful because it forces leaders to justify their actions. So the statement is too strong, although it is right that few modern wars meet every condition.","for":["Modern weapons make proportionality and discrimination hard; civilians suffer","Pacifist Christians: Jesus' teaching, Matthew 5:44; Quakers; Exodus 20:13"],"against":["Just war theory is a guide to judge each war; defence of the innocent (Psalm 82:4)","Jewish teaching: defensive war obligatory; pikuach nefesh; self-defence in international law"],"conclusion":"A just war is difficult but not impossible: a limited defensive war could meet the criteria, so the statement is too strong, though few modern wars satisfy every condition."},{"topic":"td-06","marks":12,"type":"evaluate","q":"'Religion causes more war than peace.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Some people agree that religion causes more war than peace. History shows religious wars, such as the Crusades, which were called by the Pope to take control of the Holy Land. Religion also forms part of conflicts today, such as the Troubles in Northern Ireland and the conflict in Israel and Palestine, where religious identity divides people. Some extremists even claim holy war to justify terrorism. Non-religious people, such as many Humanists, argue that when people believe God is on their side, they may find it easier to justify violence. This is a fair argument, but it can be exaggerated because most conflicts also involve land, power and politics.\n\nOn the other hand, many believers argue that religion promotes peace more than it causes war. Jesus taught 'Blessed are the peacemakers' (Matthew 5:9) and 'Love your enemies' (Matthew 5:44), and Jewish teaching values shalom and says that saving life is a duty. Religious groups have worked hard for peace, such as Corrymeela, which brings people from different sides in Northern Ireland together, and Pax Christi, and Martin Luther King and Desmond Tutu were driven by Christian beliefs. Most Christians today reject holy war. This argument is strong because it describes what the main teachings actually say and what religious people do every day, not just what extremists claim.\n\nOverall, I think the statement is not convincing. Religion has been linked to violence at times, but usually alongside politics and identity, whereas teachings and actions for peace are central and widespread. It is more accurate to say religion can be used to support either war or peace, depending on how people interpret it.","for":["Crusades, Troubles, Israel-Palestine; religious extremism; claims of holy war","Non-religious view that belief in God can justify violence; religion divides identities"],"against":["Jesus' teaching on peace (Matthew 5:9, 5:44); Jewish shalom and pikuach nefesh","Peacemaking: Corrymeela, Pax Christi, King, Tutu; most believers reject holy war; many wars are political"],"conclusion":"Religion has been linked to violence, but teachings and actions for peace are widespread, and many conflicts involve politics and identity, so the statement is not convincing.","points":["Both sides with developed religious teachings","Evaluation: weigh religion against political causes","Conclusion that follows the argument","Non-religious views allowed"]},{"topic":"td-07","marks":12,"type":"evaluate","q":"'Christians should always be pacifists.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Some Christians strongly agree. Jesus taught 'Blessed are the peacemakers' (Matthew 5:9) and told his followers to 'love your enemies' (Matthew 5:44). When he was arrested he told Peter to put his sword away. The commandment 'You shall not murder' (Exodus 20:13) is also used to argue that all killing is wrong. Quakers, for instance, follow a Peace Testimony and believe there is something of God in everyone, so they could never kill. This is a powerful argument because it follows Jesus' own example, and the early Church often refused to fight.\n\nOther Christians disagree. They argue that sometimes force is needed to stop great evil, so pacifism could leave innocent people unprotected. Just war theory, set out by Augustine and Aquinas, says war can be justified if it is a last resort, has a just cause and is proportionate. Psalm 82:4 tells believers to 'rescue the weak and the needy', and Dietrich Bonhoeffer joined resistance to Hitler because he believed doing nothing would be worse. The Bible also says there is 'a time for war and a time for peace' (Ecclesiastes 3:8). This argument is also strong because it tackles the problem of protecting others, but it depends on leaders following the criteria honestly, which is difficult.\n\nIn my view, the statement is not convincing as a rule for all Christians. Pacifism is a powerful moral witness and fits Jesus' teaching, but Christians disagree about how to apply love in a world where aggression exists. A better conclusion is that all Christians should work for peace and avoid violence wherever possible, while accepting that some, with a clear conscience, may support limited force as a last resort.","for":["Jesus' teaching on peace and enemies; refusing to fight at arrest; Exodus 20:13","Quakers and Peace Testimony; early Church example; non-violent protest of King"],"against":["Force may be needed to protect innocents; just war theory; Psalm 82:4","Bonhoeffer; Ecclesiastes 3:8; evil must sometimes be resisted"],"conclusion":"Pacifism is a powerful witness and fits Jesus' teaching, but Christians disagree on how to apply love, so 'always' is too strong. All Christians should work for peace, but some accept force as a last resort.","points":["Both sides with religious teachings","Evaluate each argument","Justified conclusion","Non-religious views may be credited"]},{"topic":"td-02","marks":12,"type":"evaluate","q":"'Violent protest is sometimes the only way to bring change.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Some people agree with the statement. When people are denied rights and peaceful protest is ignored, some argue violence may be the only way to be heard. Malcolm X argued that Black Americans might need to defend themselves, and some of the Suffragettes damaged property because votes for women were ignored. A few Christians say violence can be the lesser evil against a cruel regime, and Jews accept force to defend life (Exodus 22:2). Non-religious people may add that some governments only respond to pressure. This argument has some strength because history shows peaceful protest sometimes fails at first, but it is weakened because violence often leads to deaths and riots and can lose public support.\n\nOthers disagree strongly. Christians believe in love and forgiveness. Jesus said 'Put your sword back in its place, for all who draw the sword will die by the sword' (Matthew 26:52) and 'Love your enemies' (Matthew 5:44). Martin Luther King, a Baptist minister, achieved major change in civil rights in the USA by using marches and boycotts. Jews also believe in the sanctity of life, and violence puts innocent people at risk. This argument is very strong because peaceful protest has produced lasting change, and violence often damages the cause it supports.\n\nOverall, I find the statement unconvincing. Violence might sometimes force attention, but religious teachings and examples such as King show peaceful methods can also work and avoid harming innocents. 'Only way' is too strong, because other options usually exist, so most believers would say violent protest should not be the answer.","for":["Peaceful protest ignored; Malcolm X; Suffragettes; lesser evil against injustice","Jewish self-defence (Exodus 22:2); non-religious view that pressure can force change"],"against":["Jesus: Matthew 26:52, 5:44; love and forgiveness; Romans 12:21","Martin Luther King's success; sanctity of life; violence risks harm and loses support"],"conclusion":"Violence may gain attention but peaceful protest can succeed and avoids harming innocents, so 'the only way' is too strong.","points":["Both sides with religious teachings","Evaluate strengths and weaknesses","Conclusion","Non-religious views allowed"]}]},{"section":{"id":"theme-e","title":"Theme E: Religion, crime and punishment","short":"Theme E","paper":2,"religion":"Themes","blurb":"Good and evil, reasons for crime, attitudes to lawbreakers, aims of punishment, treatment of criminals, forgiveness and the death penalty."},"topics":[{"id":"te-01","code":"Crime.1","title":"Crime and punishment: good and evil intentions and actions","overview":"Before the detailed topics, know what a crime is, how punishment works in the UK, and how religious people see good and evil intentions and actions.","notes":[{"h":"Crime and law","bullets":["A **crime** is an action that breaks the law and can be punished by the state. Crimes can be against a person (murder), property (theft) or the state (treason).","In the UK, someone found guilty by a court can be punished by a fine, community sentence or prison. The most serious crimes, such as murder, carry a life sentence. The UK does not use the death penalty or corporal punishment as sentences.","Some actions are wrong but legal, such as lying or adultery. Some actions are good but not required by law, such as giving to charity."]},{"h":"Good and evil","bullets":["**Evil** actions cause suffering or harm. **Evil intentions** mean deliberately wanting to harm. Many religious people say intentions matter as well as actions.","Christians believe humans are made in God's image but affected by sin, so everyone is capable of good and evil. Many say 'hate the sin, love the sinner'.","Christians link evil to Satan's temptation and the Fall. Jews also link evil to temptation, but teach that each person has a good inclination (yetzer hatov) and an evil inclination (yetzer hara) and can choose between them.","Jews do not believe in original sin. God is just, so people must face the consequences of wrong choices but can repent."]}],"views":[{"label":"Christian","text":"Intentions matter because Jesus said wrong thoughts can be sinful as well as wrong actions. Christians believe all humans can do evil because of original sin, but God offers forgiveness."},{"label":"Jewish","text":"Jews teach free will: people can choose the good or evil inclination. Actions matter greatly, and repentance (teshuvah) is always possible."},{"label":"Non-religious","text":"Many say people become criminals because of social causes. Some say that intentions matter in deciding how serious a crime is."}],"terms":[{"term":"crime","def":"an action that breaks the law"},{"term":"evil","def":"actions or intentions that cause suffering or harm"},{"term":"intention","def":"what a person means to do or aims to achieve"},{"term":"law","def":"rules a country makes that people must follow"},{"term":"original sin","def":"the Christian belief that humans have a tendency to sin because of Adam and Eve's disobedience"},{"term":"yetzer hara","def":"the Jewish idea of the evil inclination"}],"sources":[{"text":"'Anyone who looks at a woman lustfully has already committed adultery with her in his heart.'","ref":"Matthew 5:28","use":"Use to show that intentions matter, not just actions."},{"text":"'A good man brings good things out of the good stored up in him.'","ref":"Matthew 12:35","use":"Use for the link between a person's heart and their actions."},{"text":"'All have sinned and fall short of the glory of God.'","ref":"Romans 3:23","use":"Use to explain why Christians say everyone can do wrong."},{"text":"'You intended to harm me, but God intended it for good.'","ref":"Genesis 50:20","use":"Use to discuss whether good can come from evil."}],"tip":"Do not say Christians think anyone is simply 'evil'. Use ideas such as original sin and 'hate the sin, love the sinner'."},{"id":"te-02","code":"Crime.2","title":"Reasons for crime","overview":"AQA lists seven reasons for crime and expects you to link religious teaching to each.","notes":[{"h":"Reasons","bullets":["**Poverty**: people who cannot afford basics may steal to survive. **Upbringing**: children who grow up around crime may copy it.","**Mental illness**: some conditions can lead to criminal behaviour, and offenders may need treatment as well as punishment. **Addiction**: people may steal to pay for drugs or alcohol.","**Greed**: wanting more wealth or status, which can lead to theft or fraud. **Hate**: prejudice can lead to hate crime or violence.","**Opposition to an unjust law**: some break a law they believe is morally wrong, for example Rosa Parks refusing to give up her bus seat, or the Suffragettes."]},{"h":"Religious views","bullets":["Christians say society should help the poor so people do not need to steal. Greed is condemned, and drunkenness is a sin, but addicts need support.","Hatred goes against love of neighbour, and prejudice is wrong because God made everyone equal.","On unjust laws, Christians are usually told to obey authority (Romans 13:1) but must put God first (Acts 5:29). Protest should be peaceful.","Jews stress tzedakah (charity) to reduce poverty, strong family teaching, and justice. Jews accept breaking a law only to save life or oppose clear injustice, and not for greed or hate."]}],"views":[{"label":"Christian","text":"Christians understand that some people are driven to crime by poverty or illness, so society should help them. They still believe people have free will and must face the consequences, while being offered forgiveness."},{"label":"Jewish","text":"Jews say communities must prevent crime through tzedakah and good education. Criminals are responsible for their actions, but community support should reduce temptation."},{"label":"Non-religious","text":"Many point to social causes such as poverty, poor upbringing and lack of opportunity. Some say punishment alone does not work unless the causes are tackled."}],"terms":[{"term":"poverty","def":"not having enough for a reasonable standard of living"},{"term":"upbringing","def":"the way a person is raised, including the environment around them"},{"term":"addiction","def":"being dependent on a substance such as drugs or alcohol"},{"term":"greed","def":"wanting more than you need"},{"term":"hate crime","def":"a crime committed because of prejudice against a group"},{"term":"unjust law","def":"a law believed to be morally wrong"}],"sources":[{"text":"'The love of money is a root of all kinds of evil.'","ref":"1 Timothy 6:10","use":"Use for greed as a cause of crime."},{"text":"'Everyone must submit themselves to the governing authorities.'","ref":"Romans 13:1","use":"Use to show Christians should normally obey the law."},{"text":"'We must obey God rather than human beings!'","ref":"Acts 5:29","use":"Use for breaking an unjust law."},{"text":"'You shall not steal.'","ref":"Exodus 20:15","use":"Use for theft, from poverty or greed."}],"tip":"Explain how and why a reason leads to crime and what a religious believer would say. 'People steal because of poverty' only gets full marks if you add the religious response."},{"id":"te-03","code":"Crime.3","title":"Attitudes to lawbreakers and different types of crime","overview":"Learn how religious people treat people who break the law and how they view murder, theft and hate crime.","notes":[{"h":"Lawbreakers","bullets":["Christians say people who break the law should face justice but still be treated with respect and compassion. Jesus said 'I was in prison and you came to visit me' (Matthew 25:36).","Christians want offenders to repent and change. They separate the crime from the person.","Jews believe lawbreakers must face consequences and make things right (restitution), but can be forgiven if they repent.","Both traditions accept that law is needed for order but that offenders have rights and deserve fair treatment."]},{"h":"Types of crime","bullets":["**Murder**: condemned by Christians and Jews because of 'You shall not murder', sanctity of life and Genesis 9:6.","**Theft**: wrong (Exodus 20:15), but religious people may feel sympathy where it is driven by need. Jews say the thief must repay (Exodus 22:1).","**Hate crime**: wrong because all humans are equal in God's eyes. Christians point to Galatians 3:28 and love of neighbour. Jews say all people are made in God's image and kindness to others is a key moral principle."]}],"views":[{"label":"Christian","text":"Christians condemn crime but call for compassion. They separate hating the sin from loving the sinner, and say criminals should be given a chance to reform."},{"label":"Jewish","text":"Jews say lawbreakers should be held accountable and make restitution to those they have harmed. Repentance (teshuvah) allows a fresh start."},{"label":"Non-religious","text":"Many support fair trials and rehabilitation. Some stress protecting society, while others focus on the causes of crime."}],"terms":[{"term":"lawbreaker","def":"a person who breaks the law"},{"term":"murder","def":"unlawfully killing another person"},{"term":"theft","def":"taking something without the owner's permission"},{"term":"hate crime","def":"a crime motivated by prejudice"},{"term":"restitution","def":"paying back or putting right a wrong"},{"term":"repentance","def":"being truly sorry and changing your behaviour"}],"sources":[{"text":"'I was in prison and you came to visit me.'","ref":"Matthew 25:36","use":"Use for Christian compassion towards prisoners."},{"text":"'Whoever sheds human blood, by humans shall their blood be shed.'","ref":"Genesis 9:6","use":"Use for murder; it also shows life is made in God's image."},{"text":"'There is neither Jew nor Gentile, neither slave nor free, nor is there male and female.'","ref":"Galatians 3:28","use":"Use against hate crime and discrimination."},{"text":"'Whoever steals an ox or a sheep... must pay back five head of cattle.'","ref":"Exodus 22:1","use":"Use for Jewish teaching that thieves must make restitution."}],"tip":"Be specific about the crime type. 'Christians oppose hate crime because Galatians 3:28 says all are one in Christ' is far better than 'it is wrong'."},{"id":"te-04","code":"Crime.4","title":"The aims of punishment","overview":"The three AQA aims are retribution, deterrence and reformation. Know what each means and what Christians and Jews think.","notes":[{"h":"The three aims","bullets":["**Retribution**: making the offender suffer in return for their crime, like 'an eye for an eye'. It gives the victim and society a sense of justice.","**Deterrence**: using punishment to put the offender and others off committing crimes.","**Reformation**: helping the offender change their behaviour so they will not reoffend, for example through education or therapy.","Extra aims sometimes used: **protection** (keeping society safe) and **reparation** (making amends to victims)."]},{"h":"Religious views","bullets":["Many Christians prefer reformation and mercy, but accept that wrongdoing must have consequences. Retribution alone can become revenge, which Jesus rejected.","The Old Testament 'eye for an eye' (Exodus 21:24) is read as a limit on punishment, not as a licence for revenge.","Jews accept deterrence and justice because God is just. Rabbis explained 'eye for an eye' as payment of compensation. Repentance is the route to reform.","Strengths and weaknesses: retribution satisfies justice but can increase hatred; deterrence may reduce crime but does not help offenders; reformation helps society but may seem too soft to victims."]}],"views":[{"label":"Christian","text":"Most Christians say reformation should be the main aim because Jesus taught forgiveness and love, though justice and protection matter too. Some support retribution as a fair response to serious crimes."},{"label":"Jewish","text":"Jews support justice and deterrence because God's law must be followed. They also stress repentance, restitution and giving offenders a way back."},{"label":"Non-religious","text":"Some say punishment should protect the public and deter. Others stress rehabilitation because it can reduce reoffending."}],"terms":[{"term":"retribution","def":"punishment as payback for a crime"},{"term":"deterrence","def":"using punishment to put people off committing crime"},{"term":"reformation","def":"helping offenders change so they stop offending"},{"term":"protection","def":"keeping the public safe from offenders"},{"term":"reparation","def":"making amends to victims"},{"term":"restorative justice","def":"bringing victims and offenders together so harm can be put right"}],"sources":[{"text":"'Life for life, eye for eye, tooth for tooth.'","ref":"Exodus 21:23-24","use":"Use for retribution in Christian and Jewish answers."},{"text":"'Do not take revenge... Do not be overcome by evil, but overcome evil with good.'","ref":"Romans 12:19-21","use":"Use to argue against retribution and for reformation."},{"text":"'I take no pleasure in the death of the wicked, but rather that they turn from their ways and live.'","ref":"Ezekiel 33:11","use":"Use for reformation and repentance in Jewish and Christian answers."},{"text":"'Whoever spares the rod hates their children, but the one who loves their children is careful to discipline them.'","ref":"Proverbs 13:24","use":"Use for punishment as discipline."},{"text":"'Let any one of you who is without sin be the first to throw a stone at her.'","ref":"John 8:7","use":"Use for mercy and reformation."}],"tip":"AQA likes 'explain two different aims'. Name each aim, define it, then give a religious view. Avoid just writing 'to punish'."},{"id":"te-05","code":"Crime.5","title":"Suffering and causing suffering to others","overview":"AQA asks whether it can ever be good to cause suffering, so learn religious views on suffering and the reasons some give for causing it.","notes":[{"h":"Suffering","bullets":["**Suffering** is pain or hardship. **Natural suffering** comes from disease or disasters; **moral suffering** comes from human choices, such as crime.","Many Christians say free will allows humans to cause suffering. Christians can find meaning in suffering: Romans 5:3-4 says suffering produces perseverance, character and hope. They follow Jesus, who suffered and helped others who suffered.","Jews may see suffering as a test, as in the story of Job, and stress faith, hope and helping others. They are taught to repair the world (tikkun olam)."]},{"h":"Causing suffering","bullets":["Christians and Jews say causing suffering to others is wrong because of love of neighbour and 'You shall not murder'.","Some say causing suffering can be justified in limited cases, for example punishing a criminal fairly, fighting a just war, or a doctor causing pain to heal. Intention and proportion matter.","Some religious people say suffering can bring good in the end, as in Joseph's story (Genesis 50:20), but this does not make it right to cause it.","Forgiveness can respond to suffering: after the 2015 Charleston church shooting, relatives of some victims said they forgave the killer."]}],"views":[{"label":"Christian","text":"Christians say they should reduce suffering and never cause it for its own sake. Some accept that punishment may cause hardship for a good purpose, but it must be fair and proportionate."},{"label":"Jewish","text":"Jews believe causing suffering is against the Torah, but people may cause harm by accident and must repair it. Defence of life or just punishment can justify limited force."},{"label":"Non-religious","text":"Many argue that causing suffering is wrong unless it prevents greater suffering. Utilitarian thinkers weigh the overall happiness or harm caused."}],"terms":[{"term":"suffering","def":"pain, hardship or distress"},{"term":"natural evil","def":"suffering caused by nature, such as disease or earthquakes"},{"term":"moral evil","def":"suffering caused by human actions"},{"term":"free will","def":"the ability to choose between right and wrong"},{"term":"tikkun olam","def":"the Jewish duty to repair the world"}],"sources":[{"text":"'Suffering produces perseverance; perseverance, character; and character, hope.'","ref":"Romans 5:3-4","use":"Use for the Christian view that good can come from suffering."},{"text":"'Love your neighbour as yourself.'","ref":"Matthew 22:39","use":"Use to argue against causing suffering."},{"text":"'You intended to harm me, but God intended it for good.'","ref":"Genesis 50:20","use":"Use to discuss whether any good can come from suffering."},{"text":"'Do not repay anyone evil for evil.'","ref":"Romans 12:17","use":"Use to argue against revenge."}],"tip":"For 'can it ever be good to cause suffering', show both sides: usually wrong, but some accept it for punishment, defence or healing, if fair and proportionate."},{"id":"te-06","code":"Crime.6","title":"The treatment of criminals: prison, corporal punishment and community service","overview":"Know the three forms of treatment AQA names, plus Christian and Jewish views on each. Corporal punishment is one of AQA's three key issues.","notes":[{"h":"Prison","bullets":["**Prison** is a loss of freedom for serious crimes. It aims to protect the public, punish, deter and reform.","Christians generally accept prison but want it to be humane and to help reformation through education and training. Elizabeth Fry, a Quaker, campaigned for better conditions for women prisoners. Christians are told to visit prisoners (Matthew 25:36).","Jews accept prison for serious crime, though the Torah mostly stresses compensation and restitution."]},{"h":"Corporal punishment","bullets":["**Corporal punishment** is physical punishment such as whipping or caning. It is illegal as a legal punishment in the UK and was banned in state schools in 1987.","Most Christian denominations oppose it because it harms human dignity, goes against love of neighbour, and rejects retaliation. A few point to Proverbs 13:24 on discipline.","The Torah allows up to forty lashes (Deuteronomy 25:3), but Jewish courts today do not use it, and most Jews oppose it."]},{"h":"Community service","bullets":["**Community service** is unpaid work for the community, such as cleaning or repairing, instead of prison.","It is popular with Christians and Jews because it reforms offenders, repairs harm and avoids the damage of prison. Some argue it is too lenient.","Jews link it to tikkun olam (repairing the world) and giving offenders a second chance."]}],"views":[{"label":"Christian","text":"Christians support humane treatment and reformation. Most oppose corporal punishment but accept prison and community service when they protect others and give offenders a chance to change."},{"label":"Jewish","text":"Jews value justice and repair. Prison is accepted for serious crimes, community service fits tikkun olam, and corporal punishment is not used today despite being in the Torah."},{"label":"Non-religious","text":"Some support prison for protection, others prefer community punishment. Many oppose corporal punishment as cruel and say it does not work."}],"terms":[{"term":"prison","def":"a place where offenders are held securely as punishment"},{"term":"corporal punishment","def":"physical punishment such as whipping or caning"},{"term":"community service","def":"unpaid work in the community given as a punishment"},{"term":"rehabilitation","def":"helping offenders return to normal life without reoffending"},{"term":"human dignity","def":"the worth every person has because they are human"}],"sources":[{"text":"'I was in prison and you came to visit me.'","ref":"Matthew 25:36","use":"Use for Christian duties towards prisoners."},{"text":"'Remember those in prison as if you were together with them in prison.'","ref":"Hebrews 13:3","use":"Use for compassion and humane treatment."},{"text":"'Whoever spares the rod hates their children.'","ref":"Proverbs 13:24","use":"Use for the argument that some physical discipline is allowed."},{"text":"'If you do wrong, be afraid, for the authority does not bear the sword for nothing.'","ref":"Romans 13:4","use":"Use for the state's right to punish wrongdoers."}],"tip":"A strong answer compares forms of treatment: 'Prison protects people, but community service allows reformation.' Show how the aims of punishment link in."},{"id":"te-07","code":"Crime.7","title":"Forgiveness","overview":"Forgiveness is one of AQA's three key issues for Theme E. Know Christian and Jewish teaching and how forgiveness fits with justice.","notes":[{"h":"Christian teaching","bullets":["Christians believe forgiveness is central because God forgives them. Jesus taught the Lord's Prayer, asking God to forgive us as we forgive others.","Jesus said to forgive 'seventy-seven times' (Matthew 18:21-22), meaning without limit. On the cross he said 'Father, forgive them' (Luke 23:34).","Forgiveness is not a replacement for punishment. Many Christians say offenders should accept consequences and show real sorrow.","Examples: relatives of Charleston church victims forgave the shooter. Maureen Greaves said she wanted justice but not revenge for her husband's killers."]},{"h":"Jewish teaching","bullets":["Jews place strong emphasis on repentance (**teshuvah**). The Ten Days of Repentance, between Rosh Hashanah and Yom Kippur, are a time for asking forgiveness.","Sins against God are forgiven on Yom Kippur. For sins against another person, you must first ask that person for forgiveness and make amends.","The wronged person should forgive if the offender is truly sorry. Eva Kor, a Holocaust survivor, said forgiving the Nazis freed her from anger."]},{"h":"Forgiveness and justice","bullets":["Forgiveness and punishment can go together. Forgiving someone does not mean excusing the crime.","Restorative justice lets victims meet offenders to help both sides heal."]}],"views":[{"label":"Christian","text":"Christians say forgiveness is a duty because God forgives them, and Jesus showed it on the cross. Most still say justice and punishment have a place, and forgiveness works best with repentance."},{"label":"Jewish","text":"Jews say forgiveness is a core belief linked with repentance and Yom Kippur. A victim should forgive someone who is truly sorry, but wronged people must be asked directly."},{"label":"Non-religious","text":"Some value forgiveness for emotional healing and reducing hatred. Others think some crimes are too serious to forgive."}],"terms":[{"term":"forgiveness","def":"letting go of blame and anger towards someone who has wronged you"},{"term":"repentance","def":"being truly sorry and promising to change"},{"term":"teshuvah","def":"the Jewish idea of returning to God through repentance"},{"term":"Yom Kippur","def":"the Jewish Day of Atonement"},{"term":"mercy","def":"showing compassion instead of harsh punishment"},{"term":"restorative justice","def":"bringing victims and offenders together to put things right"}],"sources":[{"text":"'Forgive us our debts, as we also have forgiven our debtors.'","ref":"Matthew 6:12","use":"Use for the Lord's Prayer and the duty to forgive in order to be forgiven."},{"text":"'Not seven times, but seventy-seven times.'","ref":"Matthew 18:22","use":"Use to show forgiveness should have no limit."},{"text":"'Father, forgive them, for they do not know what they are doing.'","ref":"Luke 23:34","use":"Use to show Jesus' example of forgiveness."},{"text":"'Though your sins are like scarlet, they shall be as white as snow.'","ref":"Isaiah 1:18","use":"Use for Jewish and Christian belief that God forgives the repentant."}],"tip":"Do not write 'forgiveness means no punishment'. A top answer explains that forgiveness and justice can work together."},{"id":"te-08","code":"Crime.8","title":"The death penalty","overview":"The death penalty is one of AQA's three key issues. Know the arguments, including sanctity of life and the principle of utility, and the views of Christians and Jews.","notes":[{"h":"Background","bullets":["The **death penalty** (capital punishment) is execution by the state for a crime. In the UK, murder stopped carrying the death penalty in 1965, confirmed permanently in 1969 (1973 in Northern Ireland). The USA and many other countries still use it.","Miscarriages of justice, such as Timothy Evans, hanged in 1950 and later pardoned, and Derek Bentley, executed in 1953 and cleared in 1998, show the risk of executing the innocent."]},{"h":"Arguments for","bullets":["Retribution: 'life for life' (Exodus 21:23-24) and Genesis 9:6.","Deterrence and protection: removes dangerous criminals permanently.","Principle of utility: the greatest good for the greatest number, so executing a dangerous criminal might protect many.","Romans 13:4 says rulers can use the sword to punish wrongdoers."]},{"h":"Arguments against","bullets":["Sanctity of life: only God gives and takes life, and 'You shall not murder'.","No chance to reform or repent. Jesus taught forgiveness and mercy.","Irreversible errors. Evidence that it deters is unclear.","Some say it lowers respect for life, and a society should show a higher standard than the killer."]}],"views":[{"label":"Catholic","text":"The Catholic Church teaches that the death penalty is inadmissible because it attacks human dignity. Pope Francis changed the Catechism in 2018 to say so."},{"label":"Church of England and Quaker","text":"The Church of England and Quakers oppose the death penalty, stressing mercy, reformation and the risk of wrongful execution."},{"label":"Some Christians","text":"Some Christians support it for the most serious crimes, quoting Genesis 9:6 and Romans 13, and arguing that it is just retribution."},{"label":"Jewish","text":"Jewish tradition accepts the Torah's death penalty in principle but makes conviction very hard. Most Jews today oppose it. Israel abolished it for murder in 1954."},{"label":"Non-religious","text":"Some support it for deterrence, retribution or protection. Others reject it because of the chance of wrongful execution and respect for human life."}],"terms":[{"term":"death penalty","def":"execution of a criminal by the state"},{"term":"sanctity of life","def":"life is holy and belongs to God"},{"term":"principle of utility","def":"choosing the action that brings most good to most people"},{"term":"miscarriage of justice","def":"when an innocent person is wrongly punished"},{"term":"abolition","def":"officially ending something, such as the death penalty"}],"sources":[{"text":"'Whoever sheds human blood, by humans shall their blood be shed; for in the image of God has God made mankind.'","ref":"Genesis 9:6","use":"Use for the argument for retribution, and also for the sanctity of life."},{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"Use for the argument that executing is killing."},{"text":"'Let any one of you who is without sin be the first to throw a stone at her.'","ref":"John 8:7","use":"Use for mercy and the opposition to execution."},{"text":"'The authority does not bear the sword for nothing.'","ref":"Romans 13:4","use":"Use for the argument that the state may punish with death."}],"tip":"A strong answer uses both sanctity of life and the principle of utility. The principle of utility can be used by both sides: protecting many people, or the harm of wrongful executions."}],"flashcards":[{"topic":"te-01","q":"What is a crime?","a":"An action that breaks the law and can be punished by the state."},{"topic":"te-01","q":"Name three types of crime by victim.","a":"Against a person (murder), against property (theft) and against the state (treason)."},{"topic":"te-01","q":"What punishments cannot be used in the UK?","a":"The death penalty and corporal punishment as sentences for crime."},{"topic":"te-01","q":"What are evil intentions?","a":"Deliberately wanting to cause harm or suffering to someone."},{"topic":"te-01","q":"Give an example of a wrong action that is not illegal.","a":"Lying or adultery are wrong according to many believers but are not usually crimes."},{"topic":"te-01","q":"What is original sin?","a":"The Christian belief that humans have a tendency to sin because of Adam and Eve's disobedience."},{"topic":"te-01","q":"What are the yetzer hatov and yetzer hara?","a":"The Jewish ideas of the good inclination and evil inclination that every person can choose between."},{"topic":"te-01","q":"Which verse shows intentions matter?","a":"'Anyone who looks at a woman lustfully has already committed adultery with her in his heart' (Matthew 5:28)."},{"topic":"te-02","q":"List AQA's reasons for crime.","a":"Poverty, upbringing, mental illness, addiction, greed, hate and opposition to an unjust law."},{"topic":"te-02","q":"How can poverty lead to crime?","a":"People who cannot afford basics may steal to survive."},{"topic":"te-02","q":"How can upbringing lead to crime?","a":"Children raised around crime may copy it and not learn right from wrong."},{"topic":"te-02","q":"What should religious people say about addiction?","a":"Addicts need help and treatment, though they remain responsible. Drunkenness is a sin."},{"topic":"te-02","q":"Give an example of breaking an unjust law.","a":"Rosa Parks refusing to give up her bus seat, or the Suffragettes campaigning for votes."},{"topic":"te-02","q":"What do Christians say about obeying the law?","a":"Obey governing authorities (Romans 13:1) unless it means disobeying God (Acts 5:29)."},{"topic":"te-02","q":"What is tzedakah and how does it relate to crime?","a":"Jewish duty of charity and justice. Helping the poor reduces the need to steal."},{"topic":"te-02","q":"Which verse links money to evil?","a":"'The love of money is a root of all kinds of evil' (1 Timothy 6:10)."},{"topic":"te-03","q":"What is a hate crime?","a":"A crime committed because of prejudice against a person or group."},{"topic":"te-03","q":"Why do Christians oppose hate crime?","a":"All humans are equal in God's eyes (Galatians 3:28) and Jesus taught love of neighbour."},{"topic":"te-03","q":"Why do Christians and Jews condemn murder?","a":"'You shall not murder', the sanctity of life, and humans being made in God's image."},{"topic":"te-03","q":"What must a Jewish thief do?","a":"Make restitution by paying back the victim, for example Exodus 22:1."},{"topic":"te-03","q":"How should Christians treat prisoners?","a":"With compassion and respect: 'I was in prison and you came to visit me' (Matthew 25:36)."},{"topic":"te-03","q":"What does 'hate the sin, love the sinner' mean?","a":"Condemn the wrong action but still treat the person with love and hope for change."},{"topic":"te-03","q":"What is restitution?","a":"Paying back or putting right the harm caused."},{"topic":"te-03","q":"Is theft always judged the same?","a":"Religious people may sympathise with theft from need, but still say it is wrong."},{"topic":"te-04","q":"Name AQA's three aims of punishment.","a":"Retribution, deterrence and reformation."},{"topic":"te-04","q":"Define retribution.","a":"Punishment as payback for a crime, often called 'an eye for an eye'."},{"topic":"te-04","q":"Define deterrence.","a":"Using punishment to put people off committing crime."},{"topic":"te-04","q":"Define reformation.","a":"Helping offenders change so that they do not reoffend."},{"topic":"te-04","q":"Which aim do most Christians prefer?","a":"Reformation, because of Jesus' teaching on forgiveness and love."},{"topic":"te-04","q":"What does 'eye for an eye' really limit?","a":"It limits punishment to match the crime. Jewish rabbis explain it as compensation."},{"topic":"te-04","q":"What is a weakness of deterrence?","a":"It may not help offenders change, and some criminals do not think about consequences."},{"topic":"te-04","q":"What is restorative justice?","a":"Bringing victims and offenders together so harm can be put right."},{"topic":"te-05","q":"What is moral evil?","a":"Suffering caused by human actions."},{"topic":"te-05","q":"What is natural evil?","a":"Suffering caused by nature, such as disease or earthquakes."},{"topic":"te-05","q":"What does Romans 5:3-4 say about suffering?","a":"Suffering produces perseverance, perseverance produces character, and character produces hope."},{"topic":"te-05","q":"How does Judaism see the story of Job?","a":"As an example of suffering as a test of faith."},{"topic":"te-05","q":"What is tikkun olam?","a":"The Jewish duty to repair the world."},{"topic":"te-05","q":"Can causing suffering ever be good?","a":"Some say yes in limited cases, such as fair punishment or healing, if proportionate. Most say it is usually wrong."},{"topic":"te-05","q":"What happened after the Charleston church shooting?","a":"Relatives of some victims publicly said they forgave the killer."},{"topic":"te-05","q":"What does Genesis 50:20 teach?","a":"Joseph said that though others meant harm, God used it for good, showing good can come from suffering."},{"topic":"te-06","q":"What is prison for?","a":"Protecting the public, punishing, deterring and reforming."},{"topic":"te-06","q":"Who was Elizabeth Fry?","a":"A Quaker who campaigned for better conditions for women prisoners."},{"topic":"te-06","q":"What is corporal punishment?","a":"Physical punishment such as whipping or caning."},{"topic":"te-06","q":"What do most Christian denominations think of corporal punishment?","a":"They oppose it because it harms dignity and goes against love."},{"topic":"te-06","q":"What does Jewish law say about lashes?","a":"The Torah allows up to forty lashes, but it is not used today."},{"topic":"te-06","q":"What is community service?","a":"Unpaid work in the community given instead of prison for less serious crimes."},{"topic":"te-06","q":"Why do Christians support community service?","a":"It aims at reformation and repairs harm without the damage of prison."},{"topic":"te-06","q":"What did the Torah stress instead of prison?","a":"Compensation and restitution."},{"topic":"te-07","q":"Which prayer links forgiveness to being forgiven?","a":"The Lord's Prayer: 'Forgive us our debts, as we also have forgiven our debtors.'"},{"topic":"te-07","q":"How often should Christians forgive?","a":"'Seventy-seven times', meaning without limit (Matthew 18:22)."},{"topic":"te-07
