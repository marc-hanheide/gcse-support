minyan so that they can worship as a community.","points":["Shekhinah as God's presence felt but not seen: comfort and trust in hard times","Shekhinah went into exile with the Jews: God does not abandon them","Presence in a minyan or Torah study (Pirkei Avot 3:6): influences regular synagogue attendance and study","Examples (burning bush, pillar of fire): reinforce that God is active in the world","Each way: 1 mark for the belief and 1 mark for how it influences Jews"]},{"topic":"jb-05","marks":4,"type":"influence","q":"Explain two ways in which belief in the Messiah influences Jews today. (4 marks)","model":"One way is that Orthodox Jews believe a Messiah from the line of King David will come and bring peace. This influences them to keep the mitzvot carefully and pray for his coming three times a day in the Amidah, because they believe this prepares the world for him.\n\nAnother way is that Reform Jews believe in a Messianic Age that humans help create. This influences them to work for justice and peace, for example through charity work and campaigning, to make the world better.","points":["Orthodox: personal Messiah; influences prayer (Amidah) and strict mitzvot observance","Hope in suffering and persecution","Reform: Messianic Age through human effort; influences Tikkun Olam, justice and peace work","Messiah as peace-bringer (Isaiah 2:4): inspires Jews to seek peace","Each way: 1 mark for the belief and 1 mark for how it influences Jews"]},{"topic":"jb-08","marks":4,"type":"influence","q":"Explain two ways in which belief in charity influences Jews today. (4 marks)","model":"One way is that Jews believe tzedakah is a duty to God and not an optional extra. This influences many Jews to give a tenth of their income to charity and to keep a tzedakah box at home.\n\nAnother way is that Jews believe wealth is a loan from God and that charity brings justice. This influences Jews to help the poor, for example by volunteering at a food bank or supporting Jewish charities that help refugees.","points":["Tzedakah as a mitzvah (duty): influences regular giving, maaser, tzedakah boxes","Wealth as a loan from God: influences generous sharing","Charity brings justice (tzedek): influences work for fairer society","Leviticus 19 (leaving gleanings) / Proverbs 25:21: even enemies should be helped","Examples: volunteering, food banks, Jewish charities, sponsorship","Each way: 1 mark for the belief and 1 mark for how it influences Jews"]},{"topic":"jb-09","marks":4,"type":"influence","q":"Explain two ways in which belief in the sanctity of life influences Jews today. (4 marks)","model":"One way is that Jews believe life is sacred because humans are made in God's image. This influences many Jews to carry organ donor cards, because organ donation can save a life and saving life is a very important mitzvah.\n\nAnother way is that Jews follow Pikuach Nefesh, the duty to save a life. This influences Jews such as doctors to work on Shabbat in an emergency, even though work is normally forbidden.","points":["Life sacred, made in God's image (Genesis 1:27): respect for every person","Pikuach Nefesh: doctors and others break Shabbat laws to save life","Organ donation and medical research supported by many Jews","Sanhedrin 4:5: saving one life is like saving a world; influences helping in emergencies","Opposition to euthanasia and caution on abortion","Each way: 1 mark for the belief and 1 mark for how it influences Jews"]},{"topic":"jb-04","marks":6,"type":"explain-two-source","q":"Explain two Jewish beliefs about life after death. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One belief is that the dead will be physically resurrected when God decides. Many Orthodox Jews believe this, which is why they bury the dead and do not cremate. Maimonides' 13th principle of faith says God will bring the dead back to life, and Ezekiel 37:12 says 'I will open your graves and bring you up from your graves'. This means Orthodox Jews are influenced to bury their dead with care so the body is ready for resurrection.\n\nAnother belief is that the soul is immortal and God judges it. Many Reform Jews hold this view and do not insist on a physical resurrection. Daniel 12:2 says that many who sleep in the dust will awake, some to everlasting life and some to shame. This means Jews are influenced to live a good life now, because they believe God will judge them on how they treated others and kept the mitzvot.","points":["Belief 1: bodily resurrection (Orthodox), supported by Ezekiel 37:12, Isaiah 26:19, Maimonides' 13th principle","Belief 2: immortality of the soul and judgement (Reform and many others), Daniel 12:2","Other creditable beliefs: Olam Ha-Ba, Gan Eden, Gehinnom, Sheol, gilgul","Source of wisdom: Tenakh, Talmud, Pirkei Avot, Maimonides","Application: burial practice, living ethically, focusing on this life","Marks: 1 point + 1 development + 1 source/application for each belief"]},{"topic":"jb-06","marks":6,"type":"explain-two-source","q":"Explain two ways in which the Covenant with Abraham is important for Jews today. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One way is that the covenant gives Jews their identity as God's chosen people. God promised Abraham that he would be the father of a great nation, saying in Genesis 12:2 'I will make you into a great nation and I will bless you'. This means Jews see themselves as having a special responsibility to serve God and to be a light to others.\n\nAnother way is that the covenant created the practice of Brit Milah. In Genesis 17:10-11 God tells Abraham that every male must be circumcised as the sign of the covenant. This means Jewish families today circumcise their baby sons on the eighth day to keep the covenant and show that the child belongs to the Jewish people.","points":["Chosen people/special relationship and responsibility (Genesis 12:1-3; Deuteronomy 7:6)","Brit Milah as the sign of the covenant (Genesis 17:10-11)","Promised Land: connection to Israel, aliyah, Jerusalem (Genesis 17:8)","Abraham as a role model of faith and obedience (Genesis 22)","Numerous descendants (Genesis 15:5): continuity of the Jewish people","Marks: 1 point + 1 development + 1 source/application for each way"]},{"topic":"jb-07","marks":6,"type":"explain-two-source","q":"Explain two ways in which the Ten Commandments are important for Jews today. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One way is that the Ten Commandments are a central part of the covenant at Sinai. They are in Exodus 20:1-17 and begin 'I am the Lord your God, who brought you out of Egypt'. This means Jews see them as direct commands from God and read them in synagogue and display them above the ark.\n\nAnother way is that they guide how Jews live and treat others. The fourth commandment says to remember Shabbat and keep it holy, and the sixth forbids murder. This means Jews today keep Shabbat as a day of rest and treat life as sacred, because they believe obeying these commandments is part of keeping their promise to God.","points":["Part of the covenant with Moses at Sinai: direct from God (Exodus 19-20)","Foundation of the 613 mitzvot","Guide for commandments between people and God (Shabbat, no idols) and between people (no murder, theft)","Displayed in synagogues and read at Shavuot","Different views: Orthodox treat all as binding, Reform as moral guidance","Marks: 1 point + 1 development + 1 source/application for each way"]},{"topic":"jb-10","marks":6,"type":"explain-two-source","q":"Explain two Jewish beliefs about free will and the mitzvot. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One belief is that God gave humans free will so they can choose between good and evil. Deuteronomy 30:19 says 'I have set before you life and death, blessing and curse. Choose life'. This means Jews are responsible for their choices, so they try to make good choices and keep the mitzvot.\n\nAnother belief is that the mitzvot are binding for Orthodox Jews but a guide for Reform Jews. Orthodox Jews believe God commanded all 613 mitzvot, so they keep them strictly, while Reform Jews use informed free will to choose which mitzvot give their life meaning. Pirkei Avot 3:15 says 'everything is foreseen, yet freedom of choice is given', which supports using free will within God's law.","points":["Free will: humans choose good or evil; judged on choices (Deuteronomy 30:19; Pirkei Avot 3:15; Maimonides)","613 mitzvot: 248 positive and 365 negative","Mitzvot between people and God, and between people","Orthodox: binding; Reform: informed choice","Source of wisdom: Torah, Pirkei Avot, Maimonides","Marks: 1 point + 1 development + 1 source/application for each belief"]},{"topic":"jb-08","marks":6,"type":"explain-two-source","q":"Explain two ways in which Jews put the idea of Tikkun Olam (healing the world) into practice. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One way is by working for social justice and helping those in need. Isaiah 42:6 says Jews should be 'a light to the nations'. This means many Jews volunteer, give to charity and campaign for fairness, for example by supporting refugees, in order to make the world a better place.\n\nAnother way is by caring for the environment. Psalm 24:1 says 'The earth is the Lord's and everything in it'. This means Jews believe the world belongs to God, so many Jews take part in recycling, tree planting and conservation as a way of looking after God's creation.","points":["Tikkun Olam: repairing the world through social justice, charity, peace work","Environmental care and stewardship (Psalm 24:1; Deuteronomy 20:19)","Isaiah 42:6, 'light to the nations'; Talmud 'not for you to finish the work'","Links to the Messianic Age (especially Reform)","Examples: volunteering, Tzedek and other charities, campaigning","Marks: 1 point + 1 development + 1 source/application for each way"]},{"topic":"jb-02","marks":6,"type":"explain-two-source","q":"Explain two Jewish beliefs about God as Law-Giver and Judge. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One belief is that God is the Law-Giver who gave the Torah and 613 mitzvot to the Jewish people. Isaiah 33:22 says 'the Lord is our lawgiver', and in Deuteronomy 10:12-13 God asks Jews to keep His commandments for their own good. This means Jews study the Torah and try to follow the mitzvot because they believe this is how to live a holy life.\n\nAnother belief is that God is a fair judge who judges everyone by their actions. Genesis 18:25 asks 'Shall not the Judge of all the earth do justice?' This means Jews try to live honestly and treat others fairly, and they repent on Rosh Hashanah and Yom Kippur because they believe God will judge them.","points":["God as Law-Giver: Torah, 613 mitzvot, covenant at Sinai (Isaiah 33:22; Deuteronomy 10:12-13)","God as Judge: Rosh Hashanah, Yom Kippur and after death (Genesis 18:25; Psalm 75:7)","Loving and merciful: forgives those who repent (Exodus 34:6)","Application: following mitzvot, repentance, ethical behaviour","Marks: 1 point + 1 development + 1 source/application for each belief"]},{"topic":"jb-05","marks":12,"type":"evaluate","q":"'Belief in the Messiah is the most important Jewish belief.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["The Messiah is one of Maimonides' 13 Principles of Faith, so for many Orthodox Jews it is a core belief. They pray for him daily in the Amidah.","Belief in the Messiah gives hope in persecution and suffering. Jews have been persecuted for centuries, and the promise of a Messianic Age of peace (Isaiah 2:4) has helped them endure.","It motivates action: Jews who want the Messianic Age to come keep the mitzvot or work for justice, so the belief shapes how they live."],"against":["The belief that God is One (the Shema) is more basic. Without it there is no Judaism, and the Messiah only matters because God is One and God will act.","Many Reform Jews do not expect a personal Messiah, so for them it cannot be the most important belief.","The covenant and the mitzvot shape daily life more than a future event. Jews keep Shabbat and kosher food laws now, whether or not the Messiah comes."],"conclusion":"The Messiah is important, especially for Orthodox Jews, but belief in God as One and the covenant are more fundamental, because the Messiah depends on them.","model":"Some Jews would agree that belief in the Messiah is the most important belief. Maimonides listed the coming of the Messiah as one of his 13 Principles of Faith, and Orthodox Jews pray for him three times a day in the Amidah. The belief gives hope. Jews have faced persecution for centuries, and the promise of a Messianic Age of peace, when nations 'will not take up sword against nation' (Isaiah 2:4), gives meaning to suffering. It also influences behaviour, because Jews who want to bring the Messianic Age nearer keep the mitzvot carefully or work for justice. This is a strong argument for Orthodox Jews, because the Messiah is linked to the Temple, resurrection and the final judgement, so it connects to many other beliefs.\n\nHowever, there are strong arguments against. The Shema says 'the Lord is One', and belief in one God is the foundation of Judaism. Without this belief, the Messiah would have no meaning, as he is sent by God. In addition, many Reform Jews do not expect a personal Messiah at all and instead see the Messianic Age as something humans must create through Tikkun Olam. For them the belief cannot be the most important. Finally, the covenant and mitzvot affect Jewish life every day, in Shabbat, prayer and food laws, whereas the Messiah is a hope for the future.\n\nOverall, I think belief in the Messiah is very important, particularly as a source of hope, but it is not the most important belief. The Messiah depends on belief in God as One and on the covenant, which give Jews their identity and daily practice, so these are more fundamental. This is supported by the fact that Jews of all traditions accept the Shema, while only some accept a personal Messiah."},{"topic":"jb-07","marks":12,"type":"evaluate","q":"'The Ten Commandments are all Jews need to live a good life.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["The Ten Commandments (Exodus 20:1-17) cover the most important duties to God and to others: worship one God, keep Shabbat, honour parents, do not murder, steal or lie.","They were given directly by God at Sinai as the core of the covenant, so they have the highest authority.","Many Reform Jews see the ethical commandments as the heart of Judaism, giving a simple guide for modern life."],"against":["The Torah contains 613 mitzvot, and Orthodox Jews believe all are binding, covering food, dress, prayer and festivals that the Ten Commandments do not mention.","The Ten Commandments do not mention charity, kindness or Tikkun Olam, which Jews believe are essential (Leviticus 19:18, Micah 6:8).","Jews also rely on the Talmud and rabbis to interpret how to apply the law, so the Ten Commandments alone are not enough."],"conclusion":"The Ten Commandments are a vital foundation, but most Jews believe a good life also needs the other mitzvot and the Oral Law, so the statement is not convincing.","model":"Some Jews would agree that the Ten Commandments are enough to live a good life. They were given by God to Moses on Mount Sinai (Exodus 20:1-17) and cover the central duties: to worship only God, to keep Shabbat, to honour parents, and not to murder, steal or lie. These laws cover duties to God and duties to other people, so they form a complete moral base. Many Reform Jews believe the ethical teaching of the Torah is more important than ritual laws, so they would see the Ten Commandments as a clear, simple guide for modern life. This is a reasonable argument, because if everyone followed them, society would be fairer and safer.\n\nHowever, most Jews would disagree. The Torah contains 613 mitzvot, and Orthodox Jews believe that all are binding because they were all given by God. These cover areas the Ten Commandments do not mention, such as kosher food, prayer, festivals and circumcision. Furthermore, the Ten Commandments say little about kindness or charity, yet Leviticus 19:18 commands 'love your neighbour as yourself' and Micah 6:8 says God requires people to 'do justice, love kindness and walk humbly'. Jews also depend on the Talmud to explain how to apply the law in everyday life. This is a strong argument, because the Ten Commandments are short and need interpretation.\n\nIn conclusion, I do not think the Ten Commandments are all Jews need. They are the heart of the covenant and give a strong moral foundation, but Jewish tradition teaches that the whole of the Torah, with the Talmud's guidance, is needed to live as God wants. Even Reform Jews, who select among the mitzvot, would still add the teachings on justice and kindness."},{"topic":"jb-09","marks":12,"type":"evaluate","q":"'Saving a life is always more important than keeping Jewish law.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Pikuach Nefesh says saving life overrides almost all mitzvot, including Shabbat, kosher laws and Yom Kippur fasting.","Life is sacred because humans are made in God's image (Genesis 1:27), and Mishnah Sanhedrin 4:5 says saving one life is like saving a whole world.","Leviticus 18:5 says Jews should 'live by' the commandments, so the law exists to protect life, not to cause death."],"against":["The Talmud (Sanhedrin 74a) says three laws can never be broken, even to save a life: idolatry, murder and forbidden sexual relations. So saving life is not 'always' more important.","Some Jews believe obeying God matters more than life itself, as in martyrdom to avoid idolatry.","A Jew cannot kill an innocent person to save another life, because all lives are equally precious."],"conclusion":"Saving a life overrides nearly all Jewish law, but because of the three exceptions the word 'always' makes the statement too strong.","model":"There is a strong case for this statement. In Judaism life is sacred, because humans are created in God's image (Genesis 1:27). The principle of Pikuach Nefesh means that the duty to save a life overrides almost all other mitzvot. A Jewish doctor can work on Shabbat, and a sick person can eat or break the fast on Yom Kippur if their life is in danger. The Mishnah says that whoever saves one life is credited as if they saved an entire world (Sanhedrin 4:5), and Leviticus 18:5 says Jews should 'live by' the laws, which suggests the law is meant to protect life. This is a convincing argument, because it shows the purpose of the Torah is to give life and not take it away.\n\nHowever, the word 'always' is a problem. The Talmud (Sanhedrin 74a) teaches that there are three laws a Jew must never break, even to save a life: murder, idolatry and forbidden sexual relations. In history, some Jews chose death rather than worship other gods, because they believed obedience to God was more important than their own survival. Also, a Jew cannot kill an innocent person to save someone else, because each life is equally sacred. This is also a strong argument, because it shows Jewish law does have limits that even Pikuach Nefesh cannot change.\n\nIn conclusion, I think the statement is mostly true but not completely. In nearly every situation, saving life comes first, and this is why Pikuach Nefesh is one of the best-known Jewish principles. But because there are three exceptions, it is not true that it is 'always' more important. The exceptions actually protect sanctity of life in a different way, as they stop one life being valued over another."},{"topic":"jb-10","marks":12,"type":"evaluate","q":"'Jews should keep all 613 mitzvot.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Orthodox Jews believe all 613 mitzvot were given by God at Sinai as part of the covenant, so they must be obeyed (Deuteronomy 11:26-28 says obedience brings blessing).","Keeping the mitzvot is how Jews keep their side of the covenant and show faith. Jeremiah 31:33 says God's law is written on their hearts.","Mitzvot give structure and identity and unite Jews across time. Maimonides wrote that they train a person to be good."],"against":["Reform Jews believe in informed free will: they choose mitzvot that have moral or spiritual meaning, since some laws, such as Temple sacrifices, are impossible or outdated today.","Many mitzvot cannot be kept by everyone, for example some apply only to priests or only in Israel.","Pikuach Nefesh shows even Orthodox Jews do not keep every law in every situation, as saving life can override the rules."],"conclusion":"The mitzvot are central to Judaism, but because some cannot be kept today and Jews are taught to use free will, it is better to say Jews should keep them as far as they can with understanding, not all of them in every case.","model":"Orthodox Jews would agree with this statement. They believe the 613 mitzvot were given by God to Moses at Sinai as part of the covenant, so each one is a command that must be followed. Deuteronomy 11:26-28 says that obeying the commandments brings a blessing, and not obeying brings a curse. The mitzvot cover every part of life, including prayer, food, Shabbat and treating others fairly, so keeping them gives Jews their identity and keeps them close to God. This is a strong argument for believers, because if God is the Law-Giver, picking and choosing could be disobedience.\n\nHowever, Reform Jews disagree. They believe God gave humans free will and that Jews should use informed choice to decide which mitzvot to follow. Pirkei Avot 3:15 says 'everything is foreseen, yet freedom of choice is given'. They argue that some mitzvot, such as Temple sacrifices, cannot be kept today and that others belong to a different time. In addition, some mitzvot apply only to priests or only in the Land of Israel, so no one can keep all 613. Even Orthodox Jews accept that Pikuach Nefesh can override mitzvot to save a life. This is a convincing argument, as it shows the statement is not realistic in practice.\n\nIn conclusion, I think the mitzvot are the heart of Jewish life and should be taken seriously, especially the ethical ones. However, the statement is too strong. Not all 613 can be kept by everyone, and Jewish teaching on free will suggests that Jews should choose to follow the mitzvot thoughtfully rather than just obey every one automatically. The best answer is that Jews should keep as many as they can with understanding."},{"topic":"jb-04","marks":12,"type":"evaluate","q":"'Jews should focus on this life, not on life after death.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Judaism teaches that Olam Ha-Zeh (this world) is where the mitzvot are done. The Tenakh says little about the afterlife, so Jews focus on how they live now.","Tikkun Olam gives Jews a duty to repair the world today. The Talmud says 'It is not for you to finish the work, but you are not free to ignore it'.","Because Jewish beliefs about the afterlife differ widely (resurrection, immortal soul, gilgul), no one can be certain, so it is wiser to concentrate on what is known."],"against":["Many Jews believe God will judge each person after death, so the afterlife gives a reason to live well (Daniel 12:2).","Orthodox Jews believe in bodily resurrection (Maimonides' 13th principle), and this affects burial practice and gives comfort when someone dies.","Belief in Gan Eden and Gehinnom motivates keeping the mitzvot, because actions have consequences beyond death. Pirkei Avot says only Torah and good deeds go with a person after death."],"conclusion":"The main emphasis of Judaism is this life, but belief in judgement and resurrection gives that life meaning, so the two cannot really be separated.","model":"There is a good argument that Jews should focus on this life. Judaism teaches that this world, Olam Ha-Zeh, is where the mitzvot are carried out and where God's will is done. The Tenakh has very little to say about the afterlife, and Jewish views differ widely, from resurrection of the body to immortality of the soul or reincarnation. Since no one can be sure, it makes sense to concentrate on what is known. Tikkun Olam gives Jews a duty to heal the world now, and the Talmud says 'It is not for you to finish the work, but you are not free to ignore it'. This is a persuasive argument, as it explains why Jewish culture has stressed charity, justice and study more than speculation about heaven.\n\nHowever, the afterlife is still important to many Jews. They believe God will judge each person on how they lived, as Daniel 12:2 says some will awake to everlasting life and some to shame. This gives a strong reason to behave well. Orthodox Jews believe in bodily resurrection, as Maimonides taught in his 13 Principles of Faith, and this shapes their burial customs and comforts the bereaved. Pirkei Avot says that only Torah and good deeds go with a person when they die, which links this life directly to what comes next. This is also a strong argument, because without belief in judgement some Jews might feel less reason to keep the mitzvot.\n\nIn conclusion, I think the statement is largely right about emphasis, because Judaism is mainly concerned with how people live now. But the two ideas are connected: belief in judgement and an eternal soul gives meaning to actions in this life. So Jews should focus on this life, while keeping the afterlife in mind as the reason it matters."}]},{"section":{"id":"jewish-practices","title":"Judaism: Practices","short":"Jewish Practices","paper":1,"religion":"Judaism","blurb":"Jewish practices: the synagogue and worship, Shabbat, home worship and the written and oral law, life-cycle ceremonies, dietary laws, and the festivals of Rosh Hashanah, Yom Kippur and Pesach."},"topics":[{"id":"jp-01","code":"Jew Pract.1","title":"The importance of the synagogue","overview":"The synagogue is the centre of Jewish community life: a place for prayer, study and gathering. Jews can pray anywhere, but communal worship in a synagogue is especially valued.","notes":[{"h":"Three roles","bullets":["**Bet Tefillah** (house of prayer): where services are held.","**Bet Midrash** (house of study): where the Torah and Talmud are studied, and where children learn Hebrew and Jewish history.","**Bet Knesset** (house of assembly): a community centre for social events, charity and celebrations such as Bar Mitzvah and weddings.","Many Orthodox Jews also call the synagogue a **shul** (from the Yiddish for 'school')."]},{"h":"Why it is important","bullets":["Some prayers can only be said with a **minyan** (ten adults). Orthodox count only men, Reform count men and women.","Jews believe the Shekhinah (divine presence) is with a group praying together.","It holds the Torah scrolls, the holiest objects in Judaism.","It supports Jewish identity, especially for Jews living as a minority in Britain.","The synagogue replaced the Temple in Jerusalem, destroyed by the Romans in 70 CE, as the main place of worship."]},{"h":"Not the only place to pray","bullets":["Jews believe God is everywhere, so prayer is possible at home, at work or outdoors.","Private prayer is valued, but communal prayer is generally seen as more important because it needs a minyan."]}],"views":[{"label":"Orthodox","text":"Daily synagogue attendance is a duty for men, and communal prayer with a minyan is highly valued. Synagogues are also centres of intense Torah study."},{"label":"Reform","text":"Synagogues are community centres for everyone. Many Reform Jews attend mainly on Shabbat and festivals, and may pray more privately at other times."}],"terms":[{"term":"synagogue","def":"the Jewish place of worship, study and community"},{"term":"Bet Tefillah / Bet Midrash / Bet Knesset","def":"house of prayer / study / assembly"},{"term":"minyan","def":"ten adults needed for communal prayer"},{"term":"shul","def":"Yiddish word for synagogue, used especially by Orthodox Jews"},{"term":"rabbi","def":"a trained Jewish teacher and leader of the community"}],"sources":[{"text":"'Happy are those who dwell in Your house; they will continually praise You.'","ref":"Psalm 84:5","use":"Use for why the synagogue is important: a place to praise God."},{"text":"'My house will be called a house of prayer for all peoples.'","ref":"Isaiah 56:7","use":"Use to show the synagogue is a place of prayer open to all."},{"text":"When ten sit and study Torah together, the Shekhinah is among them.","ref":"Pirkei Avot 3:6","use":"Use for the importance of a minyan and communal worship."},{"text":"God asks, 'Why when I come to the synagogue is no one there?'","ref":"Talmud, Berakhot 6b (paraphrase)","use":"Use to show God values communal prayer."}],"tip":"Name all three roles (prayer, study, assembly). For 'Jews should always worship in the synagogue', argue both: the minyan and Shekhinah versus God being everywhere and private prayer."},{"id":"jp-02","code":"Jew Pract.2","title":"Interior features of the synagogue","overview":"The Aron Hakodesh, bimah and Ner Tamid are named by AQA. Each feature has a purpose and a meaning linked to Jewish history and belief.","notes":[{"h":"Main features","bullets":["**Aron Hakodesh** (the Ark): a cupboard or alcove holding the Torah scrolls. It faces Jerusalem and represents the Ark of the Covenant (Exodus 25:10-22). A curtain (**parochet**) covers it.","**Bimah**: the raised reading platform from which the Torah is read, so everyone can hear. In Orthodox synagogues it is usually in the centre. In Reform it is often at the front.","**Ner Tamid**: the ever-burning light hung above the Ark. It represents God's constant presence and the menorah in the Temple (Leviticus 24:2).","**Torah scrolls (Sefer Torah)**: handwritten on parchment, wrapped in a cover and often decorated with a silver crown or breastplate. A pointer (**yad**) is used to read so the text is not touched."]},{"h":"Other features","bullets":["Menorah (seven-branched candlestick) and the Ten Commandments displayed above the Ark.","Star of David (Magen David) and prayer books (siddurim).","Women's gallery or a separating screen (**mechitzah**) in Orthodox synagogues.","Seats facing Jerusalem so worshippers face the right direction."]},{"h":"Meaning","bullets":["The Ark and Torah show the Torah is the centre of Jewish life.","The Ner Tamid reminds Jews that God is always present.","The bimah shows the Torah reading is the high point of the service."]}],"views":[{"label":"Orthodox","text":"The bimah is usually in the centre and men and women sit separately (gallery or mechitzah). The layout has little change from tradition."},{"label":"Reform","text":"The bimah is often at the front, men and women sit together, and many synagogues have an organ or choir."}],"terms":[{"term":"Aron Hakodesh","def":"the Ark where Torah scrolls are kept"},{"term":"bimah","def":"the raised platform for reading the Torah"},{"term":"Ner Tamid","def":"the ever-burning light, symbolising God's presence"},{"term":"Sefer Torah","def":"a handwritten Torah scroll"},{"term":"yad","def":"the pointer used to follow the text when reading the Torah"},{"term":"mechitzah","def":"a screen separating men and women in Orthodox synagogues"}],"sources":[{"text":"The instructions for the Ark of the Covenant.","ref":"Exodus 25:10-22","use":"Use to show the Aron Hakodesh represents the original Ark."},{"text":"'Command the Israelites to bring clear oil of pressed olives for the light, so that the lamps may be kept burning continually.'","ref":"Leviticus 24:2","use":"Use for the Ner Tamid."},{"text":"Ezra the scribe stood on a wooden platform to read the law to the people.","ref":"Nehemiah 8:4","use":"Use for the origin of the bimah."}],"tip":"For a feature question, give the name, what it is and what it means (for example Ner Tamid: ever-burning light, shows God is always present)."},{"id":"jp-03","code":"Jew Pract.3","title":"Worship in Orthodox and Reform synagogues","overview":"Orthodox and Reform synagogues differ in language, seating, music, leadership and how often they hold services. Knowing the differences is key for 'different' questions.","notes":[{"h":"Orthodox worship","bullets":["Services are almost entirely in **Hebrew**, with no instruments on Shabbat and festivals.","Men and women sit separately: women in a gallery or behind a screen (**mechitzah**).","Only men can be rabbis, lead services or count in the minyan.","Men cover their heads (**kippah**) and wear a **tallit** (prayer shawl). Married women usually cover their hair.","Services are held every day (three times)."]},{"h":"Reform worship","bullets":["Services use Hebrew and the **local language** (English in Britain).","Men and women sit together. Women can be rabbis, read from the Torah and count in the minyan.","Organs and choirs are allowed, and services are usually shorter.","Wearing a kippah or tallit is a personal choice.","Services are held mainly on Shabbat and festivals."]},{"h":"What they share","bullets":["Both use the Torah reading, the Shema and the Amidah.","Both believe in one God and respect the Tenakh, though they interpret it differently."]}],"views":[{"label":"Orthodox","text":"Tradition is preserved: Hebrew, separate seating, male leadership and no instruments on Shabbat."},{"label":"Reform","text":"Worship is adapted to modern life: equality for men and women, English prayers, music and shorter services."}],"terms":[{"term":"Orthodox","def":"the Jewish tradition that follows halakhah (Jewish law) strictly"},{"term":"Reform","def":"the Jewish tradition that adapts practice to modern life and stresses equality"},{"term":"kippah","def":"a skullcap worn by Jewish men as a sign of respect for God"},{"term":"tallit","def":"a prayer shawl with fringes (tzitzit)"},{"term":"mechitzah","def":"a screen separating men and women"}],"sources":[{"text":"The Torah says to put fringes on the corners of garments to remind Jews of the commandments.","ref":"Numbers 15:38-39","use":"Use for why Orthodox Jews wear a tallit in worship."},{"text":"'Praise Him with the sound of the horn, praise Him with lute and harp.'","ref":"Psalm 150:3","use":"Use to support Reform use of music in worship."},{"text":"'Hear, O Israel...' read in the synagogue in Hebrew or the local language.","ref":"Deuteronomy 6:4","use":"Use to show both groups share the Shema."}],"tip":"For a 'different' question give one Orthodox and one Reform difference, each with a developed point (for example seating, language, instruments, leadership)."},{"id":"jp-04","code":"Jew Pract.4","title":"Daily services and prayer","overview":"Jews pray three times a day, using fixed prayers such as the Shema and the Amidah. Prayer is a way to praise God, ask for help and keep a relationship with God.","notes":[{"h":"The daily services","bullets":["**Shacharit** (morning), **Minchah** (afternoon) and **Maariv** (evening).","Orthodox men are expected to attend all three, with a minyan.","Reform Jews attend mainly on Shabbat and festivals, though many pray at home daily."]},{"h":"Key prayers","bullets":["**Shema**: the declaration of faith. Said morning and evening.","**Amidah**: the 'standing prayer'. It has 19 blessings on weekdays: 3 of praise, 13 of requests and 3 of thanks. It is said silently, standing, facing Jerusalem.","**Kaddish**: a prayer praising God, said by mourners; **Aleinu**: closes the service.","Prayers come from the **siddur** (prayer book)."]},{"h":"Prayer items and importance","bullets":["Orthodox men wear a **tallit**, and **tefillin** (small leather boxes containing Torah verses) on weekday mornings.","Prayer must be sincere: **kavanah** means focus and intention.","Prayer is a mitzvah, helps Jews feel close to God and brings comfort and strength."]}],"views":[{"label":"Orthodox","text":"Men pray three times daily, wear tallit and tefillin, and need a minyan for key prayers. Prayers are in Hebrew."},{"label":"Reform","text":"Daily prayer is encouraged but less strictly required. Services use English and Hebrew, and men and women pray together."}],"terms":[{"term":"Amidah","def":"the standing prayer, central to every service"},{"term":"Shema","def":"the declaration of faith, said twice daily"},{"term":"tefillin","def":"leather boxes with Torah verses worn on the head and arm in weekday morning prayer"},{"term":"kavanah","def":"concentration and sincere intention in prayer"},{"term":"siddur","def":"the Jewish prayer book"}],"sources":[{"text":"The prayer of Hannah, who prayed silently from her heart.","ref":"1 Samuel 1:13","use":"Use for private, sincere prayer and the silent Amidah."},{"text":"'Evening, morning and noon I cry out and He hears my voice.'","ref":"Psalm 55:17","use":"Use for the tradition of praying three times a day."},{"text":"'Prayer without devotion is not prayer.'","ref":"Maimonides","use":"Use to show kavanah matters."},{"text":"'Bind them as a sign on your hand and let them be symbols on your forehead.'","ref":"Deuteronomy 6:8","use":"Use for tefillin."}],"tip":"Know the three services and the Amidah structure (3, 13, 3). A good 'significance of prayer' answer links to talking with God, community, and kavanah."},{"id":"jp-05","code":"Jew Pract.5","title":"Shabbat in the synagogue","overview":"Shabbat services are the main weekly worship in the synagogue and centre on the Torah reading. Orthodox and Reform services differ in style.","notes":[{"h":"Friday evening and Saturday","bullets":["**Kabbalat Shabbat** (welcoming Shabbat) service on Friday evening, with the hymn **Lekha Dodi** welcoming Shabbat like a bride.","The main service is on **Saturday morning** (Shacharit), lasting two to three hours in Orthodox synagogues.","The **Torah** is taken from the Ark, carried round the synagogue and read from the bimah. It is read in a yearly cycle, one portion (**parashah**) each week.","Members are called up for an **aliyah** ('going up') to say blessings over the reading. A passage from the Prophets (**Haftarah**) is also read.","The rabbi gives a **sermon**, and the service ends with Aleinu and often a **Kiddush** (blessing over wine) and social time."]},{"h":"Why it is important","bullets":["It is a way to keep the Shabbat commandment (Exodus 20:8) and to worship together.","It places the Torah at the centre of the community.","It marks Shabbat as different from the rest of the week."]},{"h":"Orthodox and Reform differences","bullets":["Orthodox: no instruments or electrical items, mostly Hebrew, men lead the reading and the service is longer.","Reform: organ or choir may be used, English alongside Hebrew, shorter service, women may read from the Torah."]}],"views":[{"label":"Orthodox","text":"Services are in Hebrew, men and women sit separately, no music, and electricity and driving are avoided on Shabbat."},{"label":"Reform","text":"Services may include music, English readings and women reading the Torah. Some Reform Jews drive to the synagogue on Shabbat."}],"terms":[{"term":"Kabbalat Shabbat","def":"the Friday evening service welcoming Shabbat"},{"term":"parashah","def":"the weekly Torah portion"},{"term":"aliyah (Torah)","def":"being called up to say a blessing over the Torah reading"},{"term":"Haftarah","def":"a reading from the Prophets after the Torah reading"},{"term":"Kiddush","def":"blessing said over wine to sanctify Shabbat"}],"sources":[{"text":"'Remember the Sabbath day by keeping it holy.'","ref":"Exodus 20:8","use":"Use for why Jews keep Shabbat services: it is a commandment."},{"text":"'If you call the Sabbath a delight... then you will find your joy in the Lord.'","ref":"Isaiah 58:13-14","use":"Use to show Shabbat is meant to be enjoyed, which affects how Jews celebrate it."},{"text":"Ezra read the law to the assembled people.","ref":"Nehemiah 8:1-8","use":"Use as the origin of public Torah reading."}],"tip":"Mention the Torah reading as the high point of the Saturday service and give at least one Orthodox/Reform difference."},{"id":"jp-06","code":"Jew Pract.6","title":"Shabbat in the home","overview":"Shabbat starts at sunset on Friday and ends after dark on Saturday. It is a day of rest, family and prayer, with rituals at home including candles, Kiddush and Havdalah.","notes":[{"h":"Beginning Shabbat","bullets":["The home is cleaned and a special meal is prepared before Shabbat. No cooking is done during Shabbat.","About 18 minutes before sunset, a woman (or the family) lights **two candles** and says a blessing.","The family attends the synagogue, then has the Friday meal.","At the meal, **Kiddush** is said over wine, and two plaited loaves (**challah**) are blessed. Children are blessed and songs (**zemirot**) are sung."]},{"h":"During Shabbat","bullets":["No work is allowed. The rabbis listed **39 categories of forbidden work (melachot)**, such as cooking, writing and lighting fires. Many Orthodox Jews also avoid electricity and driving.","It is a day for prayer, rest, family time and study.","Shabbat is a gift from God and a reminder of creation (God rested on the seventh day) and the Exodus."]},{"h":"Ending Shabbat: Havdalah","bullets":["**Havdalah** ('separation') is said after nightfall on Saturday.","It uses a plaited candle, a cup of wine and a spice box. The spice symbolises the sweetness of Shabbat carried into the week."]}],"views":[{"label":"Orthodox","text":"The 39 melachot are kept strictly: no cooking, driving or electricity. Meals are prepared beforehand and kept warm."},{"label":"Reform","text":"Shabbat is kept more flexibly. Some Reform Jews drive to synagogue or use electricity, seeing 'work' as what stops rest and spiritual renewal."}],"terms":[{"term":"Shabbat","def":"the Jewish holy day of rest, Friday sunset to Saturday night"},{"term":"Kiddush","def":"blessing over wine to sanctify Shabbat"},{"term":"challah","def":"special plaited bread for Shabbat"},{"term":"Havdalah","def":"the ceremony that ends Shabbat"},{"term":"melachot","def":"the 39 categories of work forbidden on Shabbat"}],"sources":[{"text":"'Remember the Sabbath day to keep it holy. Six days you shall labour... but the seventh day is a Sabbath to the Lord your God.'","ref":"Exodus 20:8-10","use":"Use to show Shabbat is a commandment and no work is allowed."},{"text":"'The Israelites shall keep the Sabbath... as a lasting covenant.'","ref":"Exodus 31:16","use":"Use to link Shabbat to the covenant."},{"text":"'If you call the Sabbath a delight...'","ref":"Isaiah 58:13","use":"Use to show Shabbat should be joyful."},{"text":"God finished creating and rested on the seventh day and made it holy.","ref":"Genesis 2:2-3","use":"Use to explain why Jews rest on Shabbat."}],"tip":"Describe what happens at the Friday meal (candles, Kiddush, challah) and Havdalah, then say why: a gift from God, rest, family and the covenant."},{"id":"jp-07","code":"Jew Pract.7","title":"Worship in the home; the written and oral law","overview":"Jewish worship also happens at home through prayer, the mezuzah and study. Judaism has the Written Law (Tenakh) and the Oral Law (Talmud), which guide daily life.","notes":[{"h":"Worship in the home","bullets":["A **mezuzah** (a small case containing the Shema) is fixed to the doorposts of the home (Deuteronomy 6:9) to remind Jews of God's laws.","Jews say blessings (**berakhot**) before and after food, and prayers on waking and before bed, including the Shema.","Home worship includes Shabbat and festival rituals.","Private prayer can be in any language and can be more personal. Women often pray at home as they are not required to attend daily services in Orthodox Judaism."]},{"h":"The Tenakh (Written Law)","bullets":["**Tenakh** is the Jewish Bible, made up of: **Torah** (five books of Moses), **Nevi'im** (Prophets) and **Ketuvim** (Writings, such as Psalms and Proverbs).","The Torah is the most sacred and contains the 613 mitzvot. It is read in the synagogue from a scroll."]},{"h":"The Talmud (Oral Law)","bullets":["The **Talmud** records rabbis' discussions of how to apply the Torah. It contains the **Mishnah** (c. 200 CE) and the **Gemara** (later commentary), and was finished by about 500 CE.","It explains how to keep laws, for example what counts as work on Shabbat, and extends the law to new situations.","Orthodox Jews believe the Oral Law was given to Moses at Sinai alongside the Written Law.","Reform Jews value the Talmud but see it as guidance written by humans, not binding law."]}],"views":[{"label":"Orthodox","text":"Both Written and Oral Law came from God. Talmud study is a religious duty, especially for men, and its rulings guide daily life."},{"label":"Reform","text":"The Tenakh and Talmud are inspired and important, but Jews may interpret them in light of modern life and conscience."}],"terms":[{"term":"Tenakh","def":"the Jewish Bible (Torah, Nevi'im, Ketuvim), the Written Law"},{"term":"Talmud","def":"the Oral Law: Mishnah and Gemara"},{"term":"mezuzah","def":"a case with the Shema fixed to doorposts"},{"term":"Mishnah","def":"the first written collection of the Oral Law"},{"term":"Gemara","def":"rabbinic discussion and commentary on the Mishnah"},{"term":"halakhah","def":"Jewish law"}],"sources":[{"text":"'Write them on the doorposts of your house and on your gates.'","ref":"Deuteronomy 6:9","use":"Use for the mezuzah in the home."},{"text":"Moses received the Torah from Sinai and handed it down.","ref":"Pirkei Avot 1:1","use":"Use for Orthodox belief that Oral and Written Law come from Sinai."},{"text":"'The Talmud is really about the conversation, and the conversation never ends.'","ref":"Rabbi Dov Linzer","use":"Use to show the Talmud is a living, evolving discussion."},{"text":"If the Tenakh is the cornerstone of Judaism, the Talmud is the central pillar.","ref":"Rabbi Adin Steinsaltz","use":"Use to show the Talmud's importance."},{"text":"Hannah prayed silently, speaking from her heart.","ref":"1 Samuel 1:13","use":"Use for private prayer."}],"tip":"AQA mark schemes for the Talmud reward: Mishnah and Gemara, applying law to new situations, oral tradition, and a named rabbi or source."},{"id":"jp-08","code":"Jew Pract.8","title":"Ceremonies associated with birth","overview":"Jews welcome new babies with ceremonies: Brit Milah for boys and naming ceremonies for girls. They link the child to the covenant and the community.","notes":[{"h":"Brit Milah (boys)","bullets":["Boys are circumcised on the **eighth day** after birth, even on Shabbat, by a trained **mohel** (Genesis 17:12).","It is the sign of the covenant with Abraham. It takes place at home or in the synagogue.","The baby is brought in by the **kvatterin** (godmother) and **kvatter** (godfather) and held by the **sandek** on his knees. A chair is set aside for the prophet Elijah.","The boy is given his Hebrew name. Prayers and a celebration meal follow."]},{"h":"Girls","bullets":["Girls are named at the synagogue, often on the first Shabbat after birth, when the father is called to the Torah.","Many families hold a **Simchat Bat** ('rejoicing for a daughter') or **Zeved Habat** (Sephardi custom) ceremony, with prayers, blessings and a party.","Reform Jews often give girls a ceremony similar to boys' in the synagogue."]},{"h":"Pidyon Haben","bullets":["The 'redemption of the firstborn son' is held on the 31st day for a first-born son, if his mother is not a daughter of a kohen or levi.","The father gives five silver coins to a kohen to 'buy back' the child (Exodus 13:13; Numbers 18:16)."]}],"views":[{"label":"Orthodox","text":"Brit Milah is compulsory for boys on day eight. Girls are named in the synagogue on Shabbat or in a simpler ceremony."},{"label":"Reform","text":"Brit Milah is also strongly encouraged. Girls' birth ceremonies are celebrated equally, often in the synagogue and including the whole family."}],"terms":[{"term":"Brit Milah","def":"circumcision of baby boys on day eight, the sign of the covenant"},{"term":"mohel","def":"a trained person who performs circumcision"},{"term":"sandek","def":"the person who holds the baby during circumcision"},{"term":"Simchat Bat","def":"a ceremony to celebrate and name a baby girl"},{"term":"Pidyon Haben","def":"the redemption of the firstborn son with five silver coins"}],"sources":[{"text":"'Every male among you shall be circumcised... At eight days old every male shall be circumcised.'","ref":"Genesis 17:10-12","use":"The key source for Brit Milah and the covenant."},{"text":"'Children are an inheritance from the Lord.'","ref":"Psalm 127:3","use":"Use to show children are a blessing, so births are celebrated."},{"text":"'Redeem every firstborn among your sons.'","ref":"Exodus 13:13","use":"Use for Pidyon Haben."},{"text":"'Be fruitful and multiply.'","ref":"Genesis 1:28","use":"Use for the importance of family and children."}],"tip":"For Brit Milah, say what happens, the day (eighth), and why (sign of the covenant with Abraham, Genesis 17). Note the difference between boys' and girls' ceremonies."},{"id":"jp-09","code":"Jew Pract.9","title":"Bar and Bat Mitzvah","overview":"Bar and Bat Mitzvah mark when a Jewish child becomes responsible for keeping the mitzvot. The ceremonies differ between Orthodox and Reform communities.","notes":[{"h":"Bar Mitzvah (boys)","bullets":["**Bar Mitzvah** means 'son of the commandment'. It happens at 13, usually on the Shabbat after his birthday.","The boy reads from the Torah (an **aliyah**) and often the **Haftarah**, and may lead parts of the service and give a speech.","He wears a **tallit** and **tefillin** for the first time.","He now counts in a **minyan** and is responsible for keeping the mitzvot himself.","The father thanks God for releasing him from responsibility for his son's sins. A family party follows.","The boy spends months learning Hebrew and Torah reading."]},{"h":"Bat Mitzvah (girls)","bullets":["**Bat Mitzvah** means 'daughter of the commandment'. It is typically at 12 (Orthodox) or 12 to 13 (Reform).","In Reform and Liberal synagogues the ceremony is like the boys': reading from the Torah and leading the service.","Many Orthodox communities hold a celebration (sometimes called **Bat Chayil**, 'daughter of worth') with a speech and a meal, but the girl does not read from the Torah in the main service.","A girl's maturity at 12 is based on a belief that girls mature earlier."]},{"h":"Why it is important","bullets":["It marks the move from child to adult in religious terms.","It links the young person to the covenant and the community.","Jews believe it reflects Pirkei Avot: 'at thirteen, the age for observing the commandments'."]}],"views":[{"label":"Orthodox","text":"Bar Mitzvah is a key milestone. Bat Mitzvah is usually celebrated differently, without the girl reading from the Torah in the main service."},{"label":"Reform","text":"Boys and girls have the same ceremony, including reading from the Torah, to show equality. Some communities hold it at 13 for both."}],"terms":[{"term":"Bar Mitzvah","def":"'son of the commandment': a boy who is responsible for the mitzvot, aged 13"},{"term":"Bat Mitzvah","def":"'daughter of the commandment': a girl who is responsible for the mitzvot, aged 12 or 13"},{"term":"tefillin","def":"leather boxes with Torah verses worn in prayer"},{"term":"Haftarah","def":"a reading from the Prophets"},{"term":"aliyah","def":"being called up to read from the Torah"}],"sources":[{"text":"'Five is the age for starting to study scripture, ten for Mishnah, thirteen for observing the commandments.'","ref":"Pirkei Avot 5:21","use":"Use to explain why Bar Mitzvah is at 13."},{"text":"'May the Lord bless you and keep you.'","ref":"Numbers 6:24-26","use":"The blessing often said at the ceremony."},{"text":"Rabbi Weinberg: girls now have equality in everything, so Bat Mitzvah gives full equality (paraphrase).","ref":"Rabbi Weinberg","use":"Use to explain the Reform view of Bat Mitzvah."}],"tip":"For a 'different' question, one difference could be Orthodox (no Torah reading by girls) versus Reform (same as boys). Also mention tallit and tefillin for boys."},{"id":"jp-10","code":"Jew Pract.10","title":"Marriage","overview":"Marriage is seen as a mitzvah and the foundation of family life. The wedding ceremony is full of symbols and takes place under a chuppah.","notes":[{"h":"Before the wedding","bullets":["Many couples sign a **ketubah** (marriage contract), setting out the husband's duties to his wife.","In Orthodox tradition the couple may fast on the wedding day and not see each other for a week before, and the groom is called to read the Torah (**aufruf**) on the Shabbat before.","Weddings cannot take place on Shabbat or major festivals."]},{"h":"The ceremony","bullets":["The wedding takes place under a **chuppah** (canopy), which represents the couple's future home. It is often outdoors or in the synagogue.","The bride may circle the groom (seven times in Orthodox weddings), symbolising building a home together.","The rabbi says blessings over wine. The groom places a plain gold ring on the bride's finger and says the declaration: 'You are consecrated to me by this ring according to the law of Moses and Israel.'","The **Seven Blessings (Sheva Berakhot)** are said, thanking God for creation, joy and love.","The groom breaks a glass with his foot, to remember the destruction of the Temple and that joy is mixed with sadness.","The couple spend a few minutes alone (**yichud**), then there is a celebration with music and dancing."]},{"h":"Why marriage is important","bullets":["It is a mitzvah (Genesis 1:28, 'be fruitful and multiply') and the basis for family and Jewish continuity.","The Talmud teaches that a person without a spouse lives without joy."]}],"views":[{"label":"Orthodox","text":"Marriage is between a man and a woman, with traditions such as the bride circling, men and women dancing separately, and the groom giving the ring. Both must be Jewish."},{"label":"Reform","text":"Practices are more flexible: the bride may also give a ring, circling is optional and men and women celebrate together. Reform and Liberal synagogues in Britain also hold same-sex weddings, which Orthodox Judaism does not."}],"terms":[{"term":"chuppah","def":"the wedding canopy symbolising the couple's home"},{"term":"ketubah","def":"the marriage contract"},{"term":"Sheva Berakhot","def":"the Seven Blessings said at the wedding"},{"term":"yichud","def":"a short time alone for the couple after the ceremony"},{"term":"kiddushin","def":"the betrothal part of the ceremony: 'sanctification'"}],"sources":[{"text":"'Be fruitful and multiply.'","ref":"Genesis 1:28","use":"Use for why marriage and children matter."},{"text":"'A man leaves his father and mother and clings to his wife, and they become one flesh.'","ref":"Genesis 2:24","use":"Use for the union of husband and wife."},{"text":"'You are consecrated to me with this ring according to the law of Moses and Israel.'","ref":"Wedding declaration (rooted in the Talmud)","use":"Use for the ring ceremony."},{"text":"Blessings thanking God who created joy and gladness, bride and groom, love and companionship.","ref":"The Seven Blessings (Sheva Berakhot)","use":"Use to show marriage is a religious event as well as a celebration."}],"tip":"Know four or five symbols and what they mean (chuppah, ring, glass, ketubah, Seven Blessings). Don't mix up the glass (Temple) and the chuppah (home)."},{"id":"jp-11","code":"Jew Pract.11","title":"Mourning the dead","overview":"Jewish mourning customs show respect for the dead, support the bereaved and move them through stages of grief. Reform and Orthodox Jews differ on some details.","notes":[{"h":"Before and at the funeral","bullets":["Jews believe in burial as soon as possible, usually within 24 hours, except on Shabbat and festivals.","The body is washed and prepared by the **Chevra Kadisha** (burial society) and wrapped in a simple white shroud. A plain wooden coffin is used, showing everyone is equal in death.","Mourners tear their clothes (**keriah**) or wear a torn black ribbon, as a sign of grief.","The funeral is held at the cemetery or a chapel. The **Kaddish**, a prayer praising God, is said by the mourners."]},{"h":"Stages of mourning","bullets":["**Shiva** ('seven'): seven days of intense mourning at home. Mourners sit on low stools, cover mirrors, do not work or wear leather shoes, and receive visitors. A memorial candle is lit and prayers are said at home.","**Sheloshim** ('thirty'): the 30 days after the funeral, with fewer restrictions.","**Avelut**: for a parent, mourning continues for a year, and the child says Kaddish daily.","**Yahrzeit**: the yearly anniversary of the death, when a candle is lit and Kaddish is said.","A gravestone is placed after about a year and an **unveiling** is held."]}],"views":[{"label":"Orthodox","text":"Burial only, never cremation. Strict observance of shiva and sheloshim. Often only men go to the graveside and say Kaddish."},{"label":"Reform","text":"Burial is preferred, but cremation is accepted by many. Mourning customs are followed more flexibly, shiva may be shorter, and women also say Kaddish."}],"terms":[{"term":"shiva","def":"seven days of intense mourning at home"},{"term":"Kaddish","def":"the mourners' prayer praising God"},{"term":"Chevra Kadisha","def":"the burial society that prepares the body"},{"term":"yahrzeit","def":"the anniversary of a death, marked with a candle"},{"term":"keriah","def":"tearing clothes as a sign of grief"}],"sources":[{"text":"'For dust you are, and to dust you shall return.'","ref":"Genesis 3:19","use":"Use for why Jews bury the dead and do not cremate."},{"text":"'The soul of a person is the lamp of the Lord.'","ref":"Proverbs 20:27","use":"Use for the memorial candle at shiva."},{"text":"David tore his clothes when he heard of the death.","ref":"2 Samuel 13:31","use":"Use for tearing clothes in grief."},{"text":"'May God comfort you among all the mourners of Zion and Jerusalem.'","ref":"Words said to mourners","use":"Use to show the community supports the bereaved."}],"tip":"Remember the stages in order: shiva (7 days), sheloshim (30), avelut (year for a parent), yahrzeit (every year). Explain one custom and why for each mark."},{"id":"jp-12","code":"Jew Pract.12","title":"Dietary laws (Kashrut)","overview":"Kashrut is the set of Jewish food laws. Jews keep them to obey God and show holiness, but views on how strictly to follow them differ.","notes":[{"h":"Key terms and rules","bullets":["**Kosher** (fit/permitted) food is allowed. **Trefah** (not fit) is forbidden. **Pareve** food (fruit, vegetables, fish, eggs) is neutral.","**Land animals**: only those that chew the cud and have split hooves (cow, sheep, goat). Pigs are not kosher (Leviticus 11).","**Fish**: must have fins and scales. Shellfish are not kosher.","**Birds**: not birds of prey. Chicken, duck and turkey are kosher.","**Blood** may not be eaten (Leviticus 17:11). Meat is salted and soaked to remove blood."]},{"h":"Meat and milk","bullets":["Meat and dairy must not be mixed or eaten together (Exodus 23:19, 'Do not boil a kid in its mother's milk').","Many homes have separate dishes, utensils and sometimes two kitchens. Jews wait a period (often 3 to 6 hours) after meat before eating dairy."]},{"h":"Slaughter and reasons","bullets":["Animals must be killed by a trained **shochet** with a very sharp knife in one quick cut, with a blessing, so it does not suffer (**shechitah**).","Reasons for keeping kosher: obedience to God, self-discipline, holiness, Jewish identity and unity, respect for life."]}],"views":[{"label":"Orthodox","text":"Kashrut is binding. They keep strictly, including separate kitchens and eating only kosher-certified food."},{"label":"Reform","text":"Kashrut is a personal choice. Some keep part of the rules (for example no pork), while others keep none, focusing on ethical mitzvot instead."}],"terms":[{"term":"kosher","def":"food that is permitted under Jewish law"},{"term":"trefah","def":"food that is forbidden"},{"term":"Kashrut","def":"the Jewish dietary laws"},{"term":"pareve","def":"neutral food that is neither meat nor dairy"},{"term":"shechitah","def":"the kosher method of slaughter"}],"sources":[{"text":"Land animals that chew the cud and have split hooves may be eaten; the pig is unclean.","ref":"Leviticus 11:3-8 and Deuteronomy 14:3-8","use":"Use for the main rules on kosher animals."},{"text":"'You shall not boil a kid in its mother's milk.'","ref":"Exodus 23:19","use":"Use for the separation of milk and meat."},{"text":"'For the life of the flesh is in the blood.'","ref":"Leviticus 17:11","use":"Use for draining the blood."},{"text":"'Do not eat the blood of any bird or animal.'","ref":"Leviticus 7:26-27","use":"Use for why blood is forbidden."}],"tip":"For different views on dietary laws, contrast strict Orthodox keeping with Reform personal choice, and say why each group thinks that way."},{"id":"jp-13","code":"Jew Pract.13","title":"Rosh Hashanah and Yom Kippur","overview":"Rosh Hashanah and Yom Kippur are the High Holy Days, which begin and end the Ten Days of Awe. They are about judgement, repentance and forgiveness.","notes":[{"h":"Rosh Hashanah (Jewish New Year)","bullets":["Falls in September or October (1 to 2 Tishrei). It remembers the creation of the world and is the day God judges everyone (**Yom HaDin**).","The **shofar** (ram's horn) is blown in the synagogue as a wake-up call to repent. It is also blown every morning during the month before.","Jews eat **apples dipped in honey** and round **challah** for a sweet year and the cycle of the year.","**Tashlich**: Jews go to flowing water and throw breadcrumbs (or empty pockets) to symbolise casting away sins (Micah 7:19).","Orthodox Jews keep two days. Reform Jews usually keep one."]},{"h":"The Ten Days of Awe","bullets":["The ten days between Rosh Hashanah and Yom Kippur are a time for **teshuvah** (repentance): asking forgiveness from God and from people you have wronged.","Jews give charity (tzedakah) and try to put right wrongs."]},{"h":"Yom Kippur (Day of Atonement)","bullets":["The holiest day of the year (10 Tishrei). Jews believe God seals His judgement for the year.","A **25-hour fast** (no food or water) from before sunset to after nightfall. Also no washing for pleasure, no leather shoes, no perfume, no marital relations and no work.","Many wear **white** (a symbol of purity) and spend much of the day in the synagogue.","Services start with **Kol Nidre**, include confession of sins (**Vidui**) and the **Book of Jonah** (God's forgiveness), and end with **Neilah** (closing) and a long blast of the shofar.","Yom Kippur forgives sins against God. For sins against other people, Jews must first apologise to the person."]}],"views":[{"label":"Orthodox","text":"Rosh Hashanah lasts two days, and Yom Kippur is observed with a full fast and many hours of services. Those who are ill are excused by Pikuach Nefesh."},{"label":"Reform","text":"Rosh Hashanah is usually one day. Services are shorter and may include English readings, and the emphasis is often on personal reflection and ethics."}],"terms":[{"term":"Rosh Hashanah","def":"Jewish New Year, a day of judgement and remembering creation"},{"term":"Yom Kippur","def":"the Day of Atonement, a 25-hour fast of repentance"},{"term":"shofar","def":"a ram's horn blown to call people to repent"},{"term":"teshuvah","def":"repentance, returning to God"},{"term":"Tashlich","def":"casting away sins symbolically into water"},{"term":"Kol Nidre","def":"prayer that begins Yom Kippur"}],"sources":[{"text":"'On the first day of the seventh month you shall have a day of rest, a sacred assembly commemorated with trumpet blasts.'","ref":"Leviticus 23:24","use":"Use for Rosh Hashanah and the shofar."},{"text":"'The tenth day of this seventh month is the Day of Atonement... you shall deny yourselves.'","ref":"Leviticus 23:27","use":"Use for Yom Kippur and fasting."},{"text":"'You will cast all our sins into the depths of the sea.'","ref":"Micah 7:19","use":"Use for Tashlich."},{"text":"'Seek the Lord while He may be found.'","ref":"Isaiah 55:6","use":"Use for the Ten Days of Awe: a time to return to God."}],"tip":"Use the words judgement, repentance, forgiveness and one symbol (shofar, white clothes, fast) with its meaning for each festival."},{"id":"jp-14","code":"Jew Pract.14","title":"Pesach (Passover)","overview":"Pesach remembers the Israelites' escape from slavery in Egypt. It is celebrated mostly at home with the Seder meal and a week without leavened bread.","notes":[{"h":"Origins","bullets":["Pesach remembers how God freed the Israelites from slavery in Egypt through Moses (Exodus 12). God sent ten plagues, and the last plague killed the firstborn of Egypt but 'passed over' Israelite homes marked with lamb's blood.","It falls in March or April (15 Nisan). It lasts **7 days** in Israel and for Reform Jews, and **8 days** for Orthodox Jews outside Israel."]},{"h":"Preparation and rules","bullets":["No **chametz** (leavened food) may be eaten or kept at home. Homes are thoroughly cleaned and the last chametz is searched for the night before.","Jews eat **matzah** (unleavened bread), because the Israelites left in such a hurry that their bread had no time to rise (Exodus 12:39).","Many families use separate dishes for Pesach."]},{"h":"The Seder meal","bullets":["Held on the first night (and second night for many Orthodox Jews) at home. The **Haggadah** is read to retell the story.","The **Seder plate**: **maror** (bitter herbs: bitterness of slavery), **charoset** (sweet paste: mortar used by slaves), **karpas** (vegetable dipped in salt water: tears), **zeroa** (shank bone: the Passover lamb), **beitzah** (roast egg: festival offering and new life).","**Four cups of wine** (freedom), **matzah**, **Elijah's cup** (a cup left for the prophet Elijah, who will announce the Messiah) and the door opened for him.","The youngest child asks the **Four Questions** ('Why is this night different?'), so the story is passed on to the next generation."]},{"h":"Why it is important","bullets":["It reminds Jews that God saves His people and gives hope for the future.","It teaches children about their history and identity. It is a family and community celebration."]}],"views":[{"label":"Orthodox","text":"Chametz laws are kept very strictly, with separate Pesach kitchens, two Seders outside Israel and an eight-day festival."},{"label":"Reform","text":"The Seder is central, but the festival is usually seven days and rules on chametz may be followed less strictly. The Seder may include modern readings about freedom today."}],"terms":[{"term":"Pesach","def":"Passover, the festival of freedom from slavery"},{"term":"Seder","def":"the special Pesach meal with ritual retelling of the Exodus"},{"term":"Haggadah","def":"the book that tells the Pesach story and guides the Seder"},{"term":"chametz","def":"leavened food forbidden at Pesach"},{"term":"matzah","def":"unleavened bread eaten at Pesach"},{"term":"maror","def":"bitter herbs symbolising slavery"}],"sources":[{"text":"'You shall not eat leavened bread; for seven days you shall eat matzot, the bread of affliction, for you left Egypt in haste.'","ref":"Deuteronomy 16:3","use":"Use for why Jews eat matzah and avoid chametz."},{"text":"'You shall observe this as an ordinance for you and your descendants for ever.'","ref":"Exodus 12:24","use":"Use to show Pesach is a commandment."},{"text":"'Anyone who has not said these three things at Pesach has not done his duty: Pesach, matzah and maror.'","ref":"Rabbi Gamaliel (Mishnah, Pesachim 10:5)","use":"Use to show the meaning of the Seder symbols."},{"text":"'The Lord took us out of Egypt with a mighty hand and an outstretched arm.'","ref":"Deuteronomy 26:8","use":"Use to show God as saviour in the story."}],"tip":"Know the Seder plate items and what each symbolises. For 'different' questions, you could contrast preparation (cleaning the home) with the Seder itself, or Orthodox and Reform practice."}],"flashcards":[{"topic":"jp-01","q":"Name the three Hebrew terms for the roles of the synagogue.","a":"Bet Tefillah (house of prayer), Bet Midrash (house of study) and Bet Knesset (house of assembly)."},{"topic":"jp-01","q":"What is a minyan?","a":"A group of ten adults needed for communal prayer. Orthodox count only men. Reform count men and women."},{"topic":"jp-01","q":"Why do some Jews call the synagogue a shul?","a":"Shul is Yiddish for 'school', stressing the synagogue as a place of study as well as prayer."},{"topic":"jp-01","q":"What replaced the Temple as the main place of Jewish worship?","a":"The synagogue, after the Romans destroyed the Temple in Jerusalem in 70 CE."},{"topic":"jp-01","q":"Why might a Jew choose to worship at home rather than in the synagogue?","a":"God is everywhere, so Jews can pray anywhere. Work, travel or distance may make synagogue prayer difficult."},{"topic":"jp-02","q":"What is the Aron Hakodesh?","a":"The Ark: the cupboard or alcove where the Torah scrolls are kept, facing Jerusalem. It represents the Ark of the Covenant."},{"topic":"jp-02","q":"What is the bimah?","a":"The raised platform from which the Torah is read, so that everyone can see and hear."},{"topic":"jp-02","q":"What does the Ner Tamid represent?","a":"The ever-burning light above the Ark, showing that God is always present (Leviticus 24:2)."},{"topic":"jp-02","q":"What is a yad?","a":"A pointer used to follow the text when reading the Torah scroll, so the parchment is not touched."},{"topic":"jp-02","q":"What is a mechitzah?","a":"A screen or barrier used in Orthodox synagogues to separate men and women."},{"topic":"jp-03","q":"In which language are Orthodox services held?","a":"Almost entirely in Hebrew. Reform services use Hebrew and the local language (English in Britain)."},{"topic":"jp-03","q":"How do Orthodox and Reform seating differ?","a":"Orthodox: men and women sit separately. Reform: men and women sit together."},{"topic":"jp-03","q":"Can women be rabbis?","a":"Not in Orthodox Judaism. In Reform Judaism, yes, and women can lead services and count in the minyan."},{"topic":"jp-03","q":"Are musical instruments used in synagogue worship?","a":"Not in Orthodox services on Shabbat and festivals. Reform synagogues often use an organ or choir."},{"topic":"jp-03","q":"How often are services held in Orthodox and Reform synagogues?","a":"Orthodox: every day. Reform: mainly on Shabbat and festivals."},{"topic":"jp-04","q":"Name the three daily services.","a":"Shacharit (morning), Minchah (afternoon) and Maariv (evening)."},{"topic":"jp-04","q":"What is the Amidah and how is it structured?","a":"The standing prayer. 19 weekday blessings: 3 of praise, 13 of requests, 3 of thanks. Said silently and standing."},{"topic":"jp-04","q":"What are tefillin?","a":"Small leather boxes containing Torah verses, strapped to the arm and head by Jewish men at weekday morning prayer."},{"topic":"jp-04","q":"What does kavanah mean?","a":"Concentration and sincere intention in prayer: prayer should come from the heart."},{"topic":"jp-04","q":"When is the Shema said?","a":"Twice a day, morning and evening. It is the declaration of faith that God is One."},{"topic":"jp-05","q":"What is Kabbalat Shabbat?","a":"The Friday evening service welcoming Shabbat, including the hymn Lekha Dodi."},{"topic":"jp-05","q":"What is the high point of the Saturday morning service?","a":"The reading of the Torah, taken from the Ark and read from the bimah."},{"topic":"jp-05","q":"What is an aliyah in the Torah service?","a":"Being called up to say a blessing over the Torah reading."},{"topic":"jp-05","q":"What is a parashah?","a":"The weekly Torah portion, so the whole Torah is read in a year."},{"topic":"jp-05","q":"What is Kiddush?","a":"A blessing over wine that sanctifies Shabbat, said in the synagogue and at home."},{"topic":"jp-06","q":"When does Shabbat begin and end?","a":"From sunset on Friday to nightfall on Saturday."},{"topic":"jp-06","q":"How many forbidden categories of work (melachot) are there on Shabbat?","a":"39, such as cooking, writing and lighting fires."},{"topic":"jp-06","q":"What happens at the Friday night meal?","a":"Candles are lit, Kiddush is said over wine, two challah loaves are blessed, children are blessed and songs are sung."},{"topic":"jp-06","q":"What is Havdalah?","a":"The ceremony that ends Shabbat, using wine, a plaited candle and a spice box."},{"topic":"jp-06","q":"Why do Jews keep Shabbat?","a":"It is a commandment (Exodus 20:8), a day of rest remembering creation, and a sign of the covenant."},{"topic":"jp-07","q":"What is a mezuzah?","a":"A small case with the Shema inside, fixed to the doorposts of a Jewish home (Deuteronomy 6:9)."},{"topic":"jp-07","q":"What are the three parts of the Tenakh?","a":"Torah (Law), Nevi'im (Prophets) and Ketuvim (Writings)."},{"topic":"jp-07","q":"What are the Mishnah and the Gemara?","a":"The Mishnah is the first written collection of the Oral Law. The Gemara is rabbis' later commentary on it. Together they make the Talmud."},{"topic":"jp-07","q":"What is the difference between the Written Law and Oral Law?","a":"The Written Law is the Tenakh (especially the Torah). The Oral Law is the Talmud, explaining how to apply it."},{"topic":"jp-07","q":"Why is the Talmud important for Jews?","a":"It explains how to keep the Torah, applies law to new situations, shows rabbis debating, and guides daily life."},{"topic":"jp-08","q":"When is Brit Milah performed and by whom?","a":"On a baby boy's eighth day by a trained mohel (Genesis 17:12)."},{"topic":"jp-08","q":"Why do Jews circumcise baby boys?","a":"It is the sign of the covenant between God and Abraham (Genesis 17:10-11)."},{"topic":"jp-08","q":"What is a sandek?","a":"The person who holds the baby during the circumcision."},{"topic":"jp-08","q":"How are baby girls welcomed?","a":"With a naming ceremony such as Simchat Bat or Zeved Habat, often in the synagogue on Shabbat."},{"topic":"jp-08","q":"What is Pidyon Haben?","a":"Redemption of the firstborn son on the 31st day, when the father gives five silver coins to a kohen."},{"topic":"jp-09","q":"What does Bar Mitzvah mean and at what age?","a":"'Son of the commandment': a boy becomes responsible for keeping the mitzvot at 13."},{"topic":"jp-09","q":"What happens at a Bar Mitzvah?","a":"The boy reads from the Torah and Haftarah, may lead the service, wears tallit and tefillin and gives a speech. A party follows."},{"topic":"jp-09","q":"At what age is Bat Mitzvah usually celebrated?","a":"12 in Orthodox communities, and 12 or 13 in Reform. Girls are seen as maturing earlier."},{"topic":"jp-09","q":"How does an Orthodox Bat Mitzvah often differ from a Reform one?","a":"Orthodox: usually a celebration or speech without the girl reading the Torah in the main service. Reform: the same as boys'."},{"topic":"jp-09","q":"Which source says thirteen is the age for observing the commandments?","a":"Pirkei Avot 5:21 (Ethics of the Fathers)."},{"topic":"jp-10","q":"What is a chuppah and what does it symbolise?","a":"The wedding canopy, symbolising the couple's new home."},{"topic":"jp-10","q":"What is a ketubah?","a":"The marriage contract, setting out the husband's duties to his wife."},{"topic":"jp-10","q":"Why does the groom break a glass?","a":"To remember the destruction of the Temple in Jerusalem and that there is sadness even in times of joy."},{"topic":"jp-10","q":"What are the Sheva Berakhot?","a":"The Seven Blessings said at the wedding, thanking God for creation, joy and love."},{"topic":"jp-10","q":"What does the wedding ring show?","a":"An unbroken plain ring symbolises the hope for a lasting marriage. The groom gives it with the declaration 'according to the law of Moses and Israel'."},{"topic":"jp-11","q":"Within how long are Jews usually buried?","a":"As soon as possible, usually within 24 hours, except on Shabbat and festivals."},{"topic":"jp-11","q":"What is shiva?","a":"Seven days of intense mourning at home: low stools, covered mirrors, no work, visits from the community and prayers."},{"topic":"jp-11","q":"What is Kaddish?","a":"A prayer praising God, said by mourners. It does not mention death."},{"topic":"jp-11","q":"Put the mourning stages in order.","a":"Shiva (7 days), sheloshim (30 days), avelut (a year for a parent), then yahrzeit (every year)."},{"topic":"jp-11","q":"Why do Orthodox Jews not cremate?","a":"They believe in bodily resurrection and the teaching 'to dust you shall return' (Genesis 3:19)."},{"topic":"jp-12","q":"What does kosher mean? What does trefah mean?","a":"Kosher means permitted or fit. Trefah means forbidden or not fit."},{"topic":"jp-12","q":"What makes a land animal kosher?","a":"It must chew the cud and have split hooves (cow, sheep, goat). Pigs are not kosher."},{"topic":"jp-12","q":"What makes fish kosher?","a":"It must have fins and scales. Shellfish and eels are not kosher."},{"topic":"jp-12","q":"Why are milk and meat kept separate?","a":"Exodus 23:19 says do not boil a kid in its mother's milk. Homes use separate dishes and cutlery."},{"topic":"jp-12","q":"What is shechitah?","a":"Kosher slaughter by a trained shochet using a sharp knife in one cut, so the animal feels little pain and the blood drains."},{"topic":"jp-13","q":"What is the shofar and when is it blown?","a":"A ram's horn blown at Rosh Hashanah, and at the end of Yom Kippur, as a call to repent."},{"topic":"jp-13","q":"What is Tashlich?","a":"A Rosh Hashanah custom of throwing breadcrumbs into water to symbolise casting away sins."},{"topic":"jp-13","q":"How long is the Yom Kippur fast and what else is forbidden?","a":"25 hours. No food or drink, washing for pleasure, leather shoes, perfume, marital relations or work."},{"topic":"jp-13","q":"What are the Ten Days of Awe?","a":"The ten days from Rosh Hashanah to Yom Kippur, for repentance and putting right wrongs."},{"topic":"jp-13","q":"What does Yom Kippur forgive?","a":"Sins against God. For sins against other people, Jews must first apologise to the person."},{"topic":"jp-14","q":"What does Pesach remember?","a":"The Exodus: God freeing the Israelites from slavery in Egypt, 'passing over' their homes during the tenth plague."},{"topic":"jp-14","q":"What is chametz and why is it removed?","a":"Leavened food. It is removed because the Israelites left Egypt in such haste that their bread had no time to rise."},{"topic":"jp-14","q":"What does maror symbolise?","a":"Bitter herbs, representing the bitterness of slavery."},{"topic":"jp-14","q":"What is the Haggadah?","a":"The book that tells the Pesach story and guides the Seder meal."},{"topic":"jp-14","q":"What is Elijah's cup?","a":"A cup of wine left for the pro
