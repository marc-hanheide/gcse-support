","q":"What did Jesus say on the cross?","a":"'Father, forgive them, for they do not know what they are doing' (Luke 23:34)."},{"topic":"te-07","q":"What is teshuvah?","a":"Jewish repentance, returning to God and making amends."},{"topic":"te-07","q":"What are the Ten Days of Repentance?","a":"The period between Rosh Hashanah and Yom Kippur for seeking forgiveness."},{"topic":"te-07","q":"What must a Jew do after harming another person?","a":"Ask the person for forgiveness and make amends before Yom Kippur."},{"topic":"te-07","q":"Does forgiveness replace punishment?","a":"No. Many believers say forgiveness and justice can go together."},{"topic":"te-07","q":"Who was Eva Kor?","a":"A Holocaust survivor who forgave the Nazis to free herself from anger."},{"topic":"te-08","q":"When was the UK death penalty for murder abolished?","a":"1965, and confirmed permanently in 1969."},{"topic":"te-08","q":"Give two religious arguments for the death penalty.","a":"Genesis 9:6 and 'life for life' support retribution, and Romans 13:4 allows the state to punish."},{"topic":"te-08","q":"Give two religious arguments against.","a":"Sanctity of life ('You shall not murder') and the loss of any chance to repent or reform."},{"topic":"te-08","q":"What is the principle of utility?","a":"Choosing the action that brings the most good for the most people."},{"topic":"te-08","q":"Who was Timothy Evans?","a":"A man hanged in 1950 for murders later linked to John Christie. He was pardoned in 1966."},{"topic":"te-08","q":"What did Pope Francis change in 2018?","a":"The Catholic Catechism to say the death penalty is inadmissible."},{"topic":"te-08","q":"What is a miscarriage of justice?","a":"When an innocent person is wrongly punished."},{"topic":"te-08","q":"When did Israel abolish the death penalty for murder?","a":"1954."}],"quiz":[{"topic":"te-01","q":"Which describes an action that breaks the law?","options":["A mitzvah","A tradition","A crime","A custom"],"answer":2,"why":"A crime is an action that breaks the law."},{"topic":"te-01","q":"Which punishment is not used in the UK?","options":["The death penalty","Fines","Community service","Prison"],"answer":0,"why":"The UK abolished the death penalty for murder in 1965."},{"topic":"te-01","q":"Which idea does Judaism use to describe good and evil inclinations?","options":["Shema","Kashrut","Mezuzah","Yetzer hatov and hara"],"answer":3,"why":"Jews teach that everyone has a good and an evil inclination."},{"topic":"te-01","q":"Why do Christians say everyone can do wrong?","options":["Free money","Original sin","Kindness","Tradition"],"answer":1,"why":"Original sin means humans have a tendency to sin."},{"topic":"te-02","q":"Which is NOT a reason for crime in the AQA specification?","options":["Poverty","Addiction","Sunshine","Greed"],"answer":2,"why":"AQA lists poverty, upbringing, mental illness, addiction, greed, hate and unjust laws."},{"topic":"te-02","q":"Breaking a law because you think it is morally wrong is:","options":["Opposition to an unjust law","Greed","Addiction","Poverty"],"answer":0,"why":"Examples are Rosa Parks and the Suffragettes."},{"topic":"te-02","q":"Which verse might Christians use about obeying authority?","options":["Psalm 23","Matthew 5:9","Genesis 1:27","Romans 13:1"],"answer":3,"why":"Romans 13:1 says to submit to governing authorities."},{"topic":"te-02","q":"Tzedakah helps prevent crime by:","options":["Raising taxes","Helping the poor","Building prisons","Educating judges"],"answer":1,"why":"Charity reduces the need to steal."},{"topic":"te-03","q":"A crime committed because of prejudice is:","options":["Fraud","Theft","Hate crime","Treason"],"answer":2,"why":"Hate crime targets people because of who they are."},{"topic":"te-03","q":"Which verse supports equality and so opposes hate crime?","options":["Galatians 3:28","Exodus 21:24","Deuteronomy 25:3","Matthew 6:12"],"answer":0,"why":"Galatians 3:28 says all are one in Christ."},{"topic":"te-03","q":"A Jewish thief should:","options":["Be ignored","Pay nothing","Leave the country","Make restitution"],"answer":3,"why":"Exodus 22:1 requires paying back."},{"topic":"te-03","q":"'I was in prison and you came to visit me' is from:","options":["Genesis 9","Matthew 25","Isaiah 2","Psalm 82"],"answer":1,"why":"It comes from the Sheep and Goats."},{"topic":"te-04","q":"Which aim of punishment means taking revenge?","options":["Reformation","Deterrence","Retribution","Protection"],"answer":2,"why":"Retribution means punishment as payback."},{"topic":"te-04","q":"Which aim aims to put people off committing crime?","options":["Deterrence","Reformation","Reparation","Retribution"],"answer":0,"why":"Deterrence uses punishment as a warning."},{"topic":"te-04","q":"Most Christians prefer which aim?","options":["Retribution","Humiliation","Revenge","Reformation"],"answer":3,"why":"Reformation fits forgiveness and love."},{"topic":"te-04","q":"Rabbis often explain 'eye for an eye' as:","options":["Revenge","Compensation","Blindness","Banishment"],"answer":1,"why":"It was interpreted as payment of fair compensation."},{"topic":"te-05","q":"Suffering caused by human choices is:","options":["Luck","Natural evil","Moral evil","Karma"],"answer":2,"why":"Moral evil comes from human actions."},{"topic":"te-05","q":"Romans 5:3-4 suggests that suffering can lead to:","options":["Hope","Wealth","Revenge","Fame"],"answer":0,"why":"Suffering produces perseverance, character and hope."},{"topic":"te-05","q":"The story of Job in Judaism is mostly about:","options":["A festival","A war","A wedding","A test of faith"],"answer":3,"why":"Job's suffering tests his faith."},{"topic":"te-05","q":"Which is an argument that causing suffering may be justified?","options":["Boredom","Fair punishment","Greed","Hatred"],"answer":1,"why":"Some accept that fair, proportionate punishment causes suffering for a good aim."},{"topic":"te-06","q":"Who campaigned for women prisoners' conditions?","options":["John Paul II","Martin Luther","Elizabeth Fry","Mother Teresa"],"answer":2,"why":"Elizabeth Fry was a Quaker prison reformer."},{"topic":"te-06","q":"What is corporal punishment?","options":["Physical punishment","Unpaid work","Fine","Prison"],"answer":0,"why":"Corporal punishment causes physical pain."},{"topic":"te-06","q":"Community service is mainly linked to which aim?","options":["Exile","Revenge","Execution","Reformation"],"answer":3,"why":"It helps offenders repair harm and change."},{"topic":"te-06","q":"How many lashes does Deuteronomy 25 allow?","options":["Up to 4","Up to 40","Up to 400","None"],"answer":1,"why":"The Torah allows up to forty lashes."},{"topic":"te-07","q":"'Seventy-seven times' refers to:","options":["Taxes","Prayer","Forgiveness","Fasting"],"answer":2,"why":"Jesus said to forgive without limit."},{"topic":"te-07","q":"Yom Kippur is:","options":["Day of Atonement","New Year","Passover","Harvest"],"answer":0,"why":"Yom Kippur is the Day of Atonement."},{"topic":"te-07","q":"Jewish teshuvah means:","options":["Dietary law","Charity","Prayer shawl","Repentance"],"answer":3,"why":"Teshuvah means returning to God through repentance."},{"topic":"te-07","q":"Does forgiveness replace punishment?","options":["Always","Not always; they can work together","Never","Only in law"],"answer":1,"why":"Forgiveness and justice can go side by side."},{"topic":"te-08","q":"In which year did the UK abolish the death penalty for murder?","options":["1985","1945","1965","1995"],"answer":2,"why":"The Murder (Abolition of Death Penalty) Act was passed in 1965."},{"topic":"te-08","q":"Which verse is often used to support the death penalty?","options":["Genesis 9:6","Matthew 5:9","Luke 23:34","Psalm 34:14"],"answer":0,"why":"Genesis 9:6 says whoever sheds blood by humans shall their blood be shed."},{"topic":"te-08","q":"Which Christian argument is used against the death penalty?","options":["Utility only","Retribution","Deterrence","Sanctity of life"],"answer":3,"why":"Sanctity of life means only God should take life."},{"topic":"te-08","q":"The principle of utility is about:","options":["Obeying God","The greatest good for most people","Revenge","Following tradition"],"answer":1,"why":"It weighs overall happiness or harm."}],"exam":[{"topic":"te-07","marks":4,"type":"similar","q":"Explain two similar religious beliefs about forgiveness. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that Christians should forgive because God forgives them. In the Lord's Prayer Christians ask God to forgive them as they forgive others, so forgiving others is part of being forgiven.\nAnother similar belief, from Judaism, is that forgiveness is important and linked to repentance. Jews believe a person wronged should forgive someone who is truly sorry, especially in the Ten Days of Repentance before Yom Kippur.","points":["Christian: forgive as God forgives; Lord's Prayer; Matthew 18:22","Christian: Jesus on the cross, Luke 23:34","Jewish: teshuvah, Ten Days of Repentance, Yom Kippur","Jewish: forgive if the offender is sincerely sorry"]},{"topic":"te-08","marks":4,"type":"different","q":"Explain two different religious beliefs about the death penalty. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that some Christians support the death penalty for murder because Genesis 9:6 says whoever sheds human blood, by humans shall their blood be shed. They see it as fair retribution.\nA different belief is that Catholics and Quakers oppose it because life is sacred and only God should take life. They also say executed people lose the chance to repent and reform.","points":["For: Genesis 9:6, life for life, retribution; Romans 13:4","For: deterrence and protecting society; principle of utility","Against: sanctity of life; 'You shall not murder'; no chance to reform","Against: Catholic Catechism 2018; Quaker view; miscarriages of justice","Jewish: allowed in principle but very hard to apply; most oppose today"]},{"topic":"te-06","marks":4,"type":"different","q":"Explain two different religious beliefs about corporal punishment. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that most Christians oppose corporal punishment because it harms human dignity and goes against Jesus' teaching to love your neighbour and not to repay evil for evil.\nA different belief is that some people use the Bible, such as Proverbs 13:24, to argue that discipline, including physical correction, shows love. Although the Torah allows up to forty lashes, most Jews today do not use this.","points":["Against: dignity, love of neighbour, Romans 12:17","For: Proverbs 13:24, discipline; Romans 13:4","Jewish: Torah allows forty lashes, not practised today","Corporal punishment is illegal in the UK as a sentence"]},{"topic":"te-04","marks":4,"type":"different","q":"Explain two different religious beliefs about the aims of punishment. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that some religious people support retribution because it is fair that wrongdoers suffer for what they did. The Old Testament teaches 'life for life, eye for eye', which they see as justice.\nA different belief is that most Christians prefer reformation because Jesus taught forgiveness. They believe offenders should be helped to change, for example through education in prison.","points":["Retribution: Exodus 21:23-24, justice","Reformation: forgiveness, Romans 12:21, education and therapy","Deterrence: put people off; Jewish view on law being followed","Jewish: justice and repentance; compensation"]},{"topic":"te-03","marks":4,"type":"similar","q":"Explain two similar religious beliefs about hate crime. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that Christians oppose hate crime because all people are equal in God's eyes. Galatians 3:28 says all are one in Christ, so attacking someone for who they are is wrong.\nAnother similar belief is that Jews oppose hate crime because all humans are made in God's image and kindness to others is a key moral principle. Targeting a group for prejudice goes against this.","points":["Christian: Galatians 3:28; love of neighbour","Christian: made in God's image","Jewish: God made all humans equal; kindness to others","Jewish: prejudice against Torah's justice"]},{"topic":"te-05","marks":4,"type":"different","q":"Explain two different religious beliefs about suffering. In your answer you must refer to one or more religious traditions. (4 marks)","model":"One belief is that some Christians see suffering as something that can lead to good. Romans 5:3-4 says suffering produces perseverance, character and hope, so it can strengthen faith.\nA different belief from Judaism is that suffering may be a test from God, as in the story of Job, who stayed faithful through terrible suffering.","points":["Christian: Romans 5:3-4; Jesus' own suffering; help others","Christian: free will leads to suffering","Jewish: Job, test of faith; hope and faith","Jewish: tikkun olam, repair harm"]},{"topic":"te-02","marks":6,"type":"explain-two-source","q":"Explain two reasons why some people commit crime. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is greed. Some people want more wealth than they need, so they commit theft or fraud. The Bible says 'the love of money is a root of all kinds of evil' (1 Timothy 6:10). This means that greed can lead people to break the law for personal gain, so religious believers would say people should be satisfied with what they have and care about others.\nAnother reason is poverty. People who cannot afford food or shelter may steal to survive. Jews teach tzedakah, the duty of charity, so the community should help the poor. This means that if a society supports the needy, fewer people will need to turn to crime.","points":["Reason 1: greed","Source: 1 Timothy 6:10","Application: believers say be content, share","Reason 2: poverty","Source: tzedakah or Exodus 20:15","Application: community help reduces crime"]},{"topic":"te-01","marks":6,"type":"explain-two-source","q":"Explain two reasons why intentions matter as well as actions. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Jesus taught that what is in a person's heart matters as much as what they do. He said 'anyone who looks at a woman lustfully has already committed adultery with her in his heart' (Matthew 5:28). This means a person can be guilty of wrongdoing in their thoughts, so Christians try to control their thoughts and not only avoid evil acts.\nAnother reason is that God knows a person's intentions and will judge them. Jews teach that people have a good inclination and an evil inclination, and must choose between them. This means that if someone intends to do evil, they are choosing wrongly, so repentance must involve changing their intentions.","points":["Reason 1: Jesus taught intentions matter","Source: Matthew 5:28 or Matthew 12:35","Application: guard thoughts and motives","Reason 2: God judges the heart; free choice","Source: yetzer hatov and hara","Application: repentance includes changed intentions"]},{"topic":"te-04","marks":6,"type":"explain-two-source","q":"Explain two reasons why many Christians believe reformation should be the main aim of punishment. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Jesus taught forgiveness. Christians believe offenders can change if they are given a chance. In Romans 12:21 it says 'Do not be overcome by evil, but overcome evil with good.' This means that responding to crime with help, rather than revenge, is better, so many Christians support education and counselling in prison.\nAnother reason is that Christians believe everyone is made in God's image and so has dignity. This means punishment should treat offenders with respect and aim to restore them, not just hurt them. Christians support charities such as Prison Fellowship, which helps prisoners rebuild their lives.","points":["Reason 1: forgiveness and love","Source: Romans 12:21 or Matthew 18:22","Application: education, counselling, second chances","Reason 2: human dignity, made in God's image","Source: Genesis 1:27","Application: support prisoners through charities"]},{"topic":"te-06","marks":6,"type":"explain-two-source","q":"Explain two reasons why some Christians support community service as a punishment. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that community service allows offenders to reform and make amends. Jesus taught forgiveness and second chances. In Matthew 18:22 he said to forgive 'seventy-seven times', which means Christians believe offenders should be given the chance to put things right and become better people.\nAnother reason is that it avoids the harm of prison for less serious crimes and shows love for neighbour. Jesus said 'Love your neighbour as yourself' (Matthew 22:39). This means punishment should be fair and help both the victim and community, so unpaid work repairing the neighbourhood is seen as a positive response.","points":["Reason 1: reformation and making amends","Source: Matthew 18:22","Application: second chances, repairing harm","Reason 2: love for neighbour; community benefits","Source: Matthew 22:39","Application: fair, constructive punishment"]},{"topic":"te-07","marks":6,"type":"explain-two-source","q":"Explain two reasons why Christians believe in forgiving people who have committed crimes. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Jesus taught Christians to forgive. In the Lord's Prayer, Christians ask God to 'forgive us our debts, as we also have forgiven our debtors' (Matthew 6:12). This means that if Christians want God's forgiveness they must forgive others, so many forgive criminals even for serious crimes.\nAnother reason is that Jesus set an example on the cross. He said 'Father, forgive them, for they do not know what they are doing' (Luke 23:34). This shows that forgiveness is possible even in the worst situations, so Christians try to follow his example, as the relatives of the Charleston shooting victims did.","points":["Reason 1: Lord's Prayer; forgive to be forgiven","Source: Matthew 6:12","Application: forgive offenders","Reason 2: Jesus' example","Source: Luke 23:34 or Matthew 18:22","Application: follow Jesus even in serious cases"]},{"topic":"te-08","marks":6,"type":"explain-two-source","q":"Explain two reasons why many Christians oppose the death penalty. Refer to sacred writings or another source of religious belief and teaching in your answer. (6 marks)","model":"One reason is that Christians believe life is sacred and belongs to God. The commandment 'You shall not murder' (Exodus 20:13) means that killing is wrong. This means that many Christians say the state should not take a life, even a murderer's, so Catholics and Quakers campaign against it.\nAnother reason is that Christians believe in mercy and a chance to repent. Jesus taught forgiveness and said to the crowd about the woman caught in adultery 'Let any one of you who is without sin be the first to throw a stone at her' (John 8:7). This means no human is perfect, so executing someone removes any chance of reform and forgiveness.","points":["Reason 1: sanctity of life","Source: Exodus 20:13","Application: Catholic and Quaker opposition","Reason 2: mercy and chance to reform","Source: John 8:7 or Matthew 5:7","Application: offenders can repent; miscarriage of justice risk"]},{"topic":"te-08","marks":12,"type":"evaluate","q":"'The death penalty is never acceptable.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Many Christians agree with this statement. They believe life is sacred, and 'You shall not murder' (Exodus 20:13) means that killing is wrong, even when the state does it. The death penalty also removes the chance for an offender to repent and reform, and Jesus taught mercy and forgiveness. Catholics changed their Catechism in 2018 to say it is inadmissible, and Quakers and the Church of England oppose it. There is also the risk of killing innocent people, as in the case of Timothy Evans, who was hanged in 1950 and later pardoned. This is a strong argument because executions cannot be undone.\n\nHowever, others disagree. Some Christians and Jews point to Genesis 9:6, 'Whoever sheds human blood, by humans shall their blood be shed', and the Old Testament idea of 'life for life'. They see the death penalty as fair retribution for the worst crimes. Romans 13:4 also suggests rulers can punish wrongdoers with the sword. Supporters also argue it protects society and may deter others, and the principle of utility could be used to say executing a dangerous criminal helps the greatest number of people. This argument is weaker because evidence for deterrence is unclear and because most religious traditions today place mercy and sanctity of life above retribution.\n\nOverall, I think the statement is convincing for most believers. The risk of wrongful execution, the loss of repentance and the value of life are powerful reasons. However, 'never' is a strong word, and a believer who supports retribution for the worst crimes might disagree. Therefore, while I accept that many religious believers have strong reasons to oppose it, the statement is not as certain as it sounds.","for":["Sanctity of life; Exodus 20:13; mercy and forgiveness (John 8:7); no chance to reform","Miscarriages of justice (Evans, Bentley); Catholic Catechism 2018; Quaker and Church of England opposition"],"against":["Genesis 9:6; life for life; Romans 13:4; retribution for serious crimes","Deterrence and protection; principle of utility; Israel retains for exceptional crimes"],"conclusion":"Sanctity of life, mercy and the risk of wrongful execution make the statement convincing for most believers, but 'never' is strong for those who support retribution.","points":["Developed arguments on both sides with religious teachings","Evaluation of strength of arguments","Justified conclusion","Non-religious views may be credited"]},{"topic":"te-06","marks":12,"type":"evaluate","q":"'Prison is the best way to treat criminals.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Some people agree that prison is the best way to treat criminals. It protects the public by keeping dangerous offenders away from society, which fits love of neighbour. It also acts as punishment and deterrence, and Romans 13:4 says authorities have the right to punish wrongdoers. Christians and Jews accept that serious crimes need serious consequences because God is just. Prison can also help reformation if it offers education and training, and Christians are told to visit prisoners (Matthew 25:36). This is a strong argument for serious crimes such as murder or violent attacks.\n\nHowever, others disagree. Prison can be harmful and may lead to more crime, because prisoners may mix with other criminals and lose jobs and family. Many Christians and Jews prefer reformation and repairing harm, such as community service. Jews link this to tikkun olam, repairing the world, and the Torah stresses compensation rather than imprisonment. Elizabeth Fry, a Quaker, argued prisoners should be treated with dignity and helped to change. This is a strong argument for less serious crimes, where prison may do more harm than good. Non-religious people might also point to the high cost of prison.\n\nOverall, I think the statement is not fully convincing. Prison is necessary for dangerous offenders, but it is not best for every criminal. A punishment should fit the crime and its aims: protection for the dangerous, and reformation for others. So prison is one important tool, but not always the best one, and a fair system should choose the treatment that best fits the crime, the offender and the victim.","for":["Protects public; punishment and deterrence; Romans 13:4; justice","Chance for education and reform; Matthew 25:36"],"against":["Prison may increase reoffending and harm families; high cost","Community service, restitution and tikkun olam; Elizabeth Fry; Torah stresses compensation"],"conclusion":"Prison is necessary for dangerous offenders, but different crimes need different treatments, so it is not always the best way.","points":["Both sides with religious teachings","Evaluate strengths and weaknesses","Conclusion","Non-religious views allowed"]},{"topic":"te-07","marks":12,"type":"evaluate","q":"'Christians should always forgive criminals.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Many Christians agree with this statement. Jesus taught that Christians should forgive without limit, saying 'seventy-seven times' (Matthew 18:22). In the Lord's Prayer Christians ask God to forgive them as they forgive others, and on the cross Jesus said 'Father, forgive them' (Luke 23:34). Christians believe they are forgiven by God, so they should forgive others, even for very serious crimes. The relatives of victims at the Charleston church shooting showed this by forgiving the killer. This is a powerful argument because it follows Jesus' own example and can break cycles of hatred and revenge.\n\nHowever, others argue that forgiveness is not always straightforward or should not replace justice. Forgiving someone does not mean they should escape punishment, and many Christians believe offenders should show real sorrow before they are forgiven. Some victims find forgiveness extremely difficult, and demanding it could add to their pain. Jews also teach that the person who was wronged is only obliged to forgive when the offender has sincerely apologised and made amends. This argument is strong because it respects victims and the need for justice, and it still allows forgiveness when it is deserved.\n\nOverall, I think the statement is partly convincing. Christians are called to forgive and should always be willing to forgive, because Jesus' teaching is clear. However, forgiveness does not mean ignoring crime or removing punishment, and it can take time. So Christians should aim to forgive, while also supporting justice and the victims of crime, and they should never pressure victims to forgive before they are ready.","for":["Matthew 18:22; Lord's Prayer; Luke 23:34; God forgives so Christians must; Charleston example","Forgiveness breaks cycles of hatred; links to reformation"],"against":["Forgiveness is not a replacement for punishment; justice needed","Offender should show repentance; victims may find it difficult; Jewish view that sincere apology is needed"],"conclusion":"Christians are called to be willing to forgive, but forgiveness works with justice and repentance, so 'always' is only partly convincing.","points":["Both sides with religious teaching","Evaluation","Justified conclusion","Non-religious views may be credited"]},{"topic":"te-04","marks":12,"type":"evaluate","q":"'Reformation is the most important aim of punishment.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Many Christians agree with this statement. Jesus taught forgiveness and love, and Romans 12:21 says 'Do not be overcome by evil, but overcome evil with good.' Reformation helps offenders change so they stop committing crime, which benefits both offenders and society. Christians believe everyone is made in God's image and can change, and Jews teach repentance (teshuvah) so that offenders can start again. Education, therapy and community work in prison can reduce reoffending. This is a strong argument because if offenders really change, there are fewer future victims.\n\nHowever, others disagree and argue that retribution or deterrence matter more. The Old Testament teaches 'life for life, eye for eye' (Exodus 21:23-24), which supports fair payback for harm. Romans 13:4 says rulers punish wrongdoers, and deterrence may stop others from offending. Victims and society may feel that justice has not been done if offenders are treated too gently. Also, some criminals do not want to change, so protection of the public must come first. This argument is strong for serious crimes, but retribution can easily turn into revenge, which Jesus rejected.\n\nOverall, I think reformation is the most important aim for most believers, particularly Christians, because it fits teachings on forgiveness and gives offenders hope. But it cannot be the only aim, because justice for victims and protection of the public are also essential. A good system balances all the aims, with reformation as the main goal where possible, because a punishment that changes someone for good helps everyone in the long run.","for":["Jesus' teaching on forgiveness; Romans 12:21; made in God's image; Jewish teshuvah","Reduces reoffending; education and therapy; helps society and victims"],"against":["Exodus 21:23-24 retribution; Romans 13:4; justice for victims","Deterrence and protection; some offenders do not change; risk of revenge"],"conclusion":"Reformation fits religious teaching best, but justice and protection are also needed, so the best system balances all aims with reformation as the main goal.","points":["Both sides with religious teaching","Evaluation of each argument","Justified conclusion","Non-religious views may be credited"]},{"topic":"te-02","marks":12,"type":"evaluate","q":"'People should never break the law.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","model":"Many religious believers agree that people should usually obey the law. Romans 13:1 says 'Everyone must submit themselves to the governing authorities, for there is no authority except that which God has established.' Laws protect people and keep order, and breaking them can cause harm, as with theft, violence or fraud. Jews teach that following the law is important for justice, and Christians and Jews both condemn crimes such as murder and theft. If everyone chose which laws to follow, society could not function. This is a strong argument because laws protect the vulnerable and avoid chaos.\n\nHowever, others argue that breaking the law can be right when a law is unjust. Acts 5:29 says 'We must obey God rather than human beings!' and Christians such as Martin Luther King broke unjust laws, using peaceful civil disobedience to challenge segregation. The Suffragettes also broke the law to win votes for women. Jews may break a law to save a life (pikuach nefesh). This argument is strong when the law is clearly unjust, but it is weaker if the protest becomes violent, because Christians must still follow Jesus' command to love their enemies.\n\nOverall, I think the statement is not convincing as an absolute rule. Believers should respect the law because it protects people, but conscience and God's commands can sometimes come first. The best approach is to work to change an unjust law, peacefully, and accept the consequences, as this respects both conscience and the role of authority in keeping society safe and fair.","for":["Romans 13:1; laws protect society; crimes such as theft and murder condemned","Obeying law shows justice; Jewish and Christian respect for law"],"against":["Acts 5:29; unjust laws; Martin Luther King and civil disobedience; Suffragettes","Pikuach nefesh may override law; peaceful protest only"],"conclusion":"Believers should usually obey the law, but conscience and God's commands can sometimes come first, so 'never' is too strong when a law is clearly unjust.","points":["Both sides with religious teaching","Evaluation","Justified conclusion","Non-religious views may be credited"]}]}],"glossary":[{"group":"Christianity","term":"Ascension","def":"Going or being taken up; the event forty days after the resurrection when Jesus returned to glory in heaven."},{"group":"Christianity","term":"Atonement","def":"Making amends or payment for a wrong. The belief that reconciliation between God and humanity that was brought about by the death of Jesus as a sacrifice."},{"group":"Christianity","term":"Baptism","def":"The sacrament through which people become members of the Church. It involves the use of water as a symbol of the washing away of sin."},{"group":"Christianity","term":"Believers' baptism","def":"Initiation into the Church, by immersion in water, of people old enough to understand the ceremony/rite and who have made the decision to live a Christian life."},{"group":"Christianity","term":"Bible","def":"Source of wisdom and authority; a holy book containing both the Old and New Testaments."},{"group":"Christianity","term":"Catholic","def":"The tradition within the Christian Church which is led by the Pope; also called the Roman Catholic Church. (Note: The term 'catholic' refers to the communion of all Christians, the universal Church, although it is not a term included on this specification)."},{"group":"Christianity","term":"Catholic Agency for Overseas Development (CAFOD)","def":"A Christian charity that provides emergency and long-term aid to the developing world."},{"group":"Christianity","term":"Christ","def":"Literally means 'Anointed One' in Greek; the Hebrew equivalent is Messiah. The leader promised by God to the Jews; Christians believe Jesus to be the Christ."},{"group":"Christianity","term":"Christian Aid","def":"A Christian charity that provides emergency and long-term aid to the developing world."},{"group":"Christianity","term":"Christmas","def":"The festival/celebration to remember the birth of Jesus."},{"group":"Christianity","term":"Church","def":"The People of God/Body of Christ, among whom Christ is beloved to be present and active. Members of a particular Christian denomination/tradition, eg Roman Catholic, Methodist. A building in which Christians worship."},{"group":"Christianity","term":"Creation","def":"Bringing the world into existence; the belief that the world is God's loving creation."},{"group":"Christianity","term":"Crucifixion","def":"The death of Jesus; a form of the death penalty used by the Romans."},{"group":"Christianity","term":"Easter","def":"Festival/celebration of the resurrection of Jesus; the Easter season ends with Pentecost (50 days after Easter Sunday) which remembers the coming of the Holy Spirit to earth following the ascension."},{"group":"Christianity","term":"Eucharist/Holy Communion","def":"Literally 'thanksgiving'; a sacrament in which the death and resurrection of Jesus are celebrated, using bread and wine."},{"group":"Christianity","term":"Evangelism","def":"Preaching the gospel (the good news about God) to convert people to the Christian faith."},{"group":"Christianity","term":"Evil","def":"The opposite of good; a cause of suffering and against the will of God."},{"group":"Christianity","term":"The Father","def":"The first Person of the Trinity, the belief in God as creator and sustainer of the universe."},{"group":"Christianity","term":"Food banks","def":"Places in local communities where people in need can go to collect food; often run/supported by local churches and religious charities."},{"group":"Christianity","term":"Grace","def":"The unconditional and generous love that God shows to people who do not deserve it."},{"group":"Christianity","term":"Heaven","def":"Belief that after death Christians can enter a state of being with God for eternity."},{"group":"Christianity","term":"Hell","def":"Belief in a place of eternal suffering, or a state after death of being in separation from God."},{"group":"Christianity","term":"Holy Spirit","def":"The third Person of the Trinity; believed to be present with believers since Pentecost and active on earth."},{"group":"Christianity","term":"Incarnation","def":"Literally 'in flesh', or 'enfleshed;' belief that God took on human form in the person of Jesus."},{"group":"Christianity","term":"Infant baptism","def":"Sacrament of initiation of babies and young children into the Church."},{"group":"Christianity","term":"Informal prayer","def":"Spontaneous prayers spoken from the heart which are personal and unique to the person/people at the time."},{"group":"Christianity","term":"Iona","def":"Place of pilgrimage founded by St Columba in the fourth century."},{"group":"Christianity","term":"Jesus","def":"Believed by Christians to be the Son of God, he was a first century Jewish teacher living and travelling in Palestine/Israel."},{"group":"Christianity","term":"Judgement","def":"The belief that God will decides whether each person should receive eternal life or eternal punishment based on their earthly life."},{"group":"Christianity","term":"Just","def":"Fair or equal treatment, a state of justice. Belief about the nature of God as treating all people justly."},{"group":"Christianity","term":"Liturgical worship","def":"A church service which follows a set structure or ritual."},{"group":"Christianity","term":"Law","def":"Rules or commands which must be followed; the law of God is revealed in the Bible."},{"group":"Christianity","term":"Lourdes","def":"Place of pilgrimage where the Virgin Mary appeared to St Bernadette in a series of visions and it is claimed that miraculous healings have taken place."},{"group":"Christianity","term":"Lord's Prayer","def":"The prayer taught to the disciples by Jesus; also known as the 'Our Father' and widely said by Christians in both church services and privately."},{"group":"Christianity","term":"Mission","def":"Literally 'sent out'; the duty of Christians to spread the gospel (the good news about Jesus)."},{"group":"Christianity","term":"Non-liturgical worship/informal worship","def":"Service that does not follow a set text or ritual; sometimes spontaneous or charismatic."},{"group":"Christianity","term":"Omnipotent","def":"The belief that God is 'all powerful'."},{"group":"Christianity","term":"The Oneness of God","def":"The belief that God is one singular divine being (who can be manifest in the Three Persons of the Trinity)."},{"group":"Christianity","term":"Original sin","def":"Belief human nature is flawed, and that we all have the tendency to sin; traditional belief held by some Christians that this came from Adam & Eve's eating of the forbidden fruit as recorded in Genesis 3."},{"group":"Christianity","term":"Orthodox","def":"A denomination/tradition of the Church popular in some parts of Eastern Europe. There are two main Orthodox Churches - Greek and Russian."},{"group":"Christianity","term":"Persecution","def":"Facing hostility and ill-treatment; some Christians face punishment and death for practising their faith."},{"group":"Christianity","term":"Pilgrimage","def":"A religious journey to a holy site/sacred place, it is an act of worship and devotion."},{"group":"Christianity","term":"Prayer","def":"Communicating with God through words of praise, thanksgiving or confession, or requests for his help or guidance; listening to and speaking to God."},{"group":"Christianity","term":"Private worship","def":"A believer giving God praise and worship on their own."},{"group":"Christianity","term":"Protestant","def":"Christian denominations in which authority is generally based on the Bible, rather than Church tradition/teaching. (eg Anglican, Methodist, Baptist)."},{"group":"Christianity","term":"Reconciliation","def":"Making up and rebuilding relationships between two groups/sides after disagreement."},{"group":"Christianity","term":"Resurrection","def":"Being raised from the dead; the event three days after the crucifixion when it is believed that God raised Jesus from the dead. e the afterlife will take, referring to either physical or spiritual bodies."},{"group":"Christianity","term":"Sacrament","def":"The outward and visible sign of an invisible and spiritual grace. (eg Baptism and the Eucharist are recognised as sacraments by most Christians)."},{"group":"Christianity","term":"Salvation","def":"Being saved; belief that through God's grace, Jesus' death and resurrection brought about salvation for humanity. Saving of the soul and being able to enter eternal life in heaven."},{"group":"Christianity","term":"Set prayers","def":"These are prayers written throughout the centuries which many Christians worldwide use (eg The Lord's Prayer)."},{"group":"Christianity","term":"Sin","def":"Behaviour which is against God's laws and wishes/against Christian principles of morality."},{"group":"Christianity","term":"The Son","def":"The second Person of the Trinity; Jesus believed to be God incarnate."},{"group":"Christianity","term":"Son of God","def":"A title used for Jesus; the second Person of the Trinity. Shows the special relationship between Jesus and God."},{"group":"Christianity","term":"Street pastors","def":"A Christian organisation involving people working, mainly at night, on city streets giving care to those who need it."},{"group":"Christianity","term":"Suffering","def":"An effect of evil; undergoing pain and hardship."},{"group":"Christianity","term":"Tearfund","def":"A Christian charity that provides emergency and long-term aid to the developing world."},{"group":"Christianity","term":"Trinity","def":"The belief that God as One includes God also being manifest in three Persons: the Father, Son and Holy Spirit."},{"group":"Christianity","term":"Word","def":"In the Bible, John 1 describes God creating the world through his eternal Word. This links the eternal Word to Jesus in the statement: '”The Word was made flesh and dwelt among us” (John 1:14)."},{"group":"Christianity","term":"Worship","def":"Showing adoration and reverence; offering praise to God."},{"group":"Judaism","term":"Abraham","def":"Known as the father of the Jewish people. God made a covenant with him, promising him land and descendants."},{"group":"Judaism","term":"The Amidah","def":"The 'standing prayer'. Recited as part of public acts of worship in the synagogue."},{"group":"Judaism","term":"Aron hakodesh (ark)","def":"The holiest part of the synagogue containing the Torah scrolls."},{"group":"Judaism","term":"Bar Mitzvah","def":"Coming of age ceremony of boys aged 13. Literally \"Son of the Commandment\"."},{"group":"Judaism","term":"Bat Mitzvah","def":"Coming of age ceremony for girls aged 12. Literally \"Daughter of Commandment\"."},{"group":"Judaism","term":"Bimah (reading platform)","def":"The reading platform in a synagogue from which the Torah is read."},{"group":"Judaism","term":"Brit Milah","def":"Religious rite of circumcision, usually performed eight days after a boy's birth."},{"group":"Judaism","term":"Charity","def":"Key moral principle; giving to those in need. Hebrew term 'tzedakah' literally means 'justice' but used to refer to charity (because giving to those in need is part of promoting justice)."},{"group":"Judaism","term":"The Covenant","def":"A binding promise/agreement; God's agreement to look after his chosen people."},{"group":"Judaism","term":"Creator","def":"Part of the understanding of the nature of God; the belief that God created the world from nothing."},{"group":"Judaism","term":"Dietary laws","def":"The food laws that were given by God, found in the Torah. These rules relate to what may/may not be eaten, combinations of foods, and the preparation of food."},{"group":"Judaism","term":"Divine presence (Shekhinah)","def":"Belief that God is beyond human understanding but his presence may be experienced/known."},{"group":"Judaism","term":"Free will","def":"Humans are free to choose to do right or to do wrong, this freedom is a gift from God but comes with responsibility."},{"group":"Judaism","term":"God as one","def":"Part of the understanding of the nature of God; belief that there is only one God, monotheism. Reflected in the 1st Commandment “You shall have no other Gods before me.” (Exodus 20:3)"},{"group":"Judaism","term":"Healing the world","def":"Key moral principle related to making the world a better place (Hebrew 'tikkun olam')."},{"group":"Judaism","term":"Judge","def":"Part of the understanding of the nature of God; the belief that God is fair. God's justice incorporates both forgiveness and mercy."},{"group":"Judaism","term":"Judgement","def":"Part of beliefs about life after death; a Day of Judgement when God will judge the living and the dead."},{"group":"Judaism","term":"Justice","def":"Key moral principle; fairness in the way people are treated."},{"group":"Judaism","term":"Kosher","def":"Food that is 'clean' and that meets the requirements of the dietary laws."},{"group":"Judaism","term":"Law-Giver","def":"Part of the understanding of the nature of God; refers to God's giving of the Law to Moses on Mount Sinai."},{"group":"Judaism","term":"Liberal Judaism","def":"This is a form of progressive Judaism which seems to combine traditional beliefs and practices with modern interpretations."},{"group":"Judaism","term":"Merciful","def":"Part of the understanding of the nature of God; God as compassionate."},{"group":"Judaism","term":"The Messiah","def":"Literally 'the anointed one'. Orthodox Jews believe that the Messiah will be a human person sent by God to establish justice and peace on the earth. For Reform Jews, the Messiah is a symbolic figure."},{"group":"Judaism","term":"Mitzvot","def":"Mitzvot (singular is 'mitzvah') are the 613 Jewish commandments/rules found in the Tenakh."},{"group":"Judaism","term":"Moses","def":"The person through whom God set the Israelites free from slavery in Egypt, gave the Ten Commandments and made a covenant with Israel."},{"group":"Judaism","term":"Mourning rituals","def":"Refers to set practices that are carried out by Jews as a way of grieving for loved ones who have died."},{"group":"Judaism","term":"Ner tamid (ever-burning light)","def":"A feature of the synagogue; a light that is above and in front of the aron hakodesh, which burns constantly as a symbol of God's presence."},{"group":"Judaism","term":"Orthodox Judaism","def":"Jews who believe God gave the complete Torah to Moses and therefore live according to Jewish laws and traditions."},{"group":"Judaism","term":"Pesach","def":"Festival that celebrates the Jewish Exodus from Egypt, often called Passover."},{"group":"Judaism","term":"Prayer","def":"Communicating with God; listening to and speaking to God."},{"group":"Judaism","term":"Reform Judaism","def":"Jews who believe the Torah was inspired by God and was developed through their history - therefore laws may be changed or adapted as modern life changes."},{"group":"Judaism","term":"Resurrection","def":"Being raised from the dead; part of beliefs about life after death that in a future age the dead will rise and live again."},{"group":"Judaism","term":"Rosh Hashanah","def":"Festival celebrating the Jewish New Year. It is the start of the ten day period of High Holy Days that culminates in Yom Kippur."},{"group":"Judaism","term":"Sanctity of human life","def":"Belief that human life is a sacred/special because it is a precious gift from God."},{"group":"Judaism","term":"'Saving a life' (Pikuach Nefesh)","def":"This principle overrides all other religious laws because saving a human life should be of upmost importance in any situation."},{"group":"Judaism","term":"Shabbat","def":"The Sabbath/holy day of the week; beginning at sunset on Friday until sunset on Saturday."},{"group":"Judaism","term":"Sinai","def":"The mountain where Moses received the Law and where the covenant between God and Israel was made."},{"group":"Judaism","term":"Synagogue","def":"The place of public worship, also used for study and gathering. Literally means 'coming together'."},{"group":"Judaism","term":"Talmud (oral law)","def":"Source of authority; the law believed by Orthodox Jews to have been given to Moses but was not written down for many centuries, it was then expanded with rabbinic explanation/commentaries."},{"group":"Judaism","term":"Tenakh (written law)","def":"Holy book/source of authority; the Jewish scriptures. Includes into three parts: Torah (Law), Nevi'im (prophets) and Ketuvim (writings)."},{"group":"Judaism","term":"The Ten Commandments","def":"Source of authority; religious and moral rules that were given by God to Moses on Mount Sinai."},{"group":"Judaism","term":"Trefah","def":"Forbidden food - literally means 'torn'. It does not fulfil the Jewish dietary laws/is not kosher."},{"group":"Judaism","term":"Yom Kippur","def":"The Day of Atonement - a day of repentance and fasting on the tenth day after Rosh Hashanah. The holiest day of the Jewish year."},{"group":"Theme A","term":"Compassion","def":"Sympathy and concern for the suffering of others."},{"group":"Theme A","term":"Contraception","def":"Precautions taken to prevent pregnancy and to protect against contracting or transmitting STIs (sexually transmitted infections)."},{"group":"Theme A","term":"Divorce","def":"Legal ending of a marriage."},{"group":"Theme A","term":"Extended family","def":"Family unit comprising two parents and their children, but also grandparents, cousins etc."},{"group":"Theme A","term":"Family planning","def":"Planning when to have a family and how big a family to have by use of birth control practices and/or contraception."},{"group":"Theme A","term":"Gender discrimination","def":"Acting on prejudices against someone because of their gender."},{"group":"Theme A","term":"Gender equality","def":"Belief that all genders have equal status and value, so discrimination against any is wrong."},{"group":"Theme A","term":"Gender prejudice","def":"Negative thoughts, feelings or beliefs about a person or group based on their gender."},{"group":"Theme A","term":"Heterosexuality","def":"Being physically/sexually attracted to persons of the opposite gender."},{"group":"Theme A","term":"Homosexuality","def":"Being physically/sexually attracted to persons of the same gender."},{"group":"Theme A","term":"Nuclear family","def":"Family unit made up of two parents and their child(ren)."},{"group":"Theme A","term":"Polygamy","def":"The practice of having multiple spouses (wives and/or husbands)."},{"group":"Theme A","term":"Procreation","def":"Having a child; seen as a duty in many religions."},{"group":"Theme A","term":"Remarriage","def":"Marriage for the second time, after divorce ending an earlier marriage."},{"group":"Theme A","term":"Vows","def":"Promises made during a marriage ceremony."},{"group":"Theme B","term":"Abortion","def":"The deliberate ending of a pregnancy."},{"group":"Theme B","term":"Afterlife","def":"Beliefs about what happens to 'us' after our body has died; in many religions this relates to life after death or immortality in some form."},{"group":"Theme B","term":"Animal experimentation","def":"The use of animals for medical research and product testing."},{"group":"Theme B","term":"Awe and Wonder","def":"Sense of wonderment at nature; often linked to the feeling t <div class="card"><b>The exam in one minute</b>
<p class="small mut">AQA GCSE Religious Studies A (8062). Two papers, each 1 hour 45 minutes and worth 50% of the GCSE.</p>
<table class="t"><tr><th>Paper</th><th>What is on it</th></tr>

<p class="small mut">Each set is worth 24 marks. Up to 3 extra marks for spelling, punctuation and grammar (SPaG) are given on the 12-mark answers: up to 3 for each religion on Paper 1 and up to 3 on Paper 2.</p></div>

<h2>Every set has the same five questions</h2>
<table class="t"><tr><th>Q</th><th>Marks</th><th>What to do</th><th>Time</th></tr>
<tr><td>1</td><td>1</td><td>Multiple choice. Read all four options, cross out wrong ones, then choose.</td><td>1 min</td></tr>

<tr><td>4</td><td>6</td><td>"Explain two... Refer to sacred writings or another source of belief and teaching." Two developed points plus a named source.</td><td>6 min</td></tr>
<tr><td>5</td><td>12</td><td>"Evaluate this statement." Both sides, evaluation, conclusion.</td><td>12 min</td></tr></table>
<p class="small mut">About 25 minutes per set. These question marks (1, 1, 4, 6, 12) apply to exams from summer 2026 onwards. Older past papers use 1, 2, 4, 5, 12, so the 2 and 5 mark questions in old papers are a little different.</p>

<h2>How to answer each question</h2>
<details open><summary>1 mark: multiple choice and short answer</summary><div>
<ul class="b"><li>Paper 1: tick a box. Paper 2: write the letter or answer in your booklet.</li>
<li>Learn the key terms exactly (use the Glossary). Many 1-mark questions ask for a definition.</li>

<details><summary>4 marks: Explain two (point and development, twice)</summary><div>
<p>Write two separate points. Each point is worth 2 marks: one for the point, one for developing it.</p>
<ol class="steps"><li><b>Point:</b> state the belief or practice.</li><li><b>Development:</b> explain what it means, or say how it affects believers.</li></ol>
<p><b>Which command wording?</b> Your school's breakdown:</p>
<ul class="b"><li><b>Paper 1, Beliefs sections:</b> always an <b>influence</b> question. Say what the belief is, then how it changes the way a Christian or Jew thinks, feels or acts today. Other words for influence: impact, affect, change.</li>
<li><b>Paper 1, Practices sections:</b> always a <b>different</b> question (two different beliefs or practices).</li>
<li><b>Paper 2:</b> "different" or "similar" religious beliefs. Make sure one of your points is a Christian view.</li></ul>
<div class="eg"><b>Influence example.</b> One belief about hell is that it is a place of punishment for those who have not loved God and others. This influences Christians to treat others well so that they avoid going to hell. Another belief is that hell is a place where God is absent. This influences Christians to follow God's teaching and stay close to him.</div>
<div class="eg"><b>Different example (Paper 2, divorce).</b> Some Christians believe divorce is allowed if it is the lesser of two evils. However, Catholic Christians believe divorce is not allowed because it breaks a promise made before God.</div>
<p><b>Different</b> means the two points must differ: for example two traditions (Christian then Jewish), or two views from one religion where one agrees and the other disagrees.<br><b>Similar</b> means both points argue from the same direction. Do not just repeat the first point in new words.</p></div></details>

<details><summary>6 marks: Explain two, with a source of wisdom and authority</summary><div>
<ol class="steps"><li><b>Point:</b> a belief, reason or teaching.</li><li><b>Development:</b> explain what it means.</li><li><b>Source:</b> name the source (Bible book and chapter, a Church teaching, the Torah, a creed).</li><li><b>Application:</b> say how the source supports your point.</li></ol>
<div class="eg">One Christian belief is that God gave humans stewardship of the world, so Christians have a duty to look after it for God. In Genesis God tells Adam and Eve to rule over the fish of the sea. This shows that God commanded humans to care for the world, so Christians should obey him.</div>
<p>You need a source that clearly links to the question. Only one source is needed, but it must be named and used, not just dropped in.</p>
<p><b>What counts as a source of wisdom and authority?</b> The Bible (give the book), Jesus' teachings, the creeds, Church teachings, the Torah, the Talmud, the Ten Commandments, the Shema, and religious leaders' teachings.</p></div></details>

<details><summary>12 marks: Evaluate (and SPaG)</summary><div>
<p>The question gives a statement, such as "Abortion is always wrong". You must argue <b>both sides</b>, then decide.</p>
<ol class="steps"><li><b>Plan (1 min):</b> two arguments for, two against. Note a teaching or source for each.</li>
<li><b>Support:</b> a developed argument that agrees, with religious teaching.</li>
<li><b>Challenge:</b> a developed argument that disagrees, with religious teaching.</li>
<li><b>Evaluate each:</b> how strong or convincing is it, and why? Use words such as "However", "This is convincing because", "This is weaker because".</li>
<li><b>Conclusion:</b> say which side is stronger and give a reason.</li></ol>
<p><b>Your school's top tips</b></p>
<ul class="b"><li>You need religious beliefs and teachings to get more than 6 out of 12.</li>
<li>You need both sides to get more than 6 out of 12.</li>
<li>You need to evaluate your arguments to get above 9 out of 12.</li>
<li>End on a conclusion: which side is strongest?</li></ul>
<p><b>SPaG (up to 3 extra marks):</b> use capital letters and full stops correctly, write in paragraphs, and spell key terms accurately (omnipotent, atonement, pacifism, euthanasia, sanctity of life).</p></div></details>

<h2>Useful sentence starters</h2>
<div class="card"><ul class="b">
<li><b>Develop:</b> "This means that...", "This is because...", "As a result...", "For example..."</li>
<li><b>Influence:</b> "This influences Christians to...", "This encourages Jews to...", "So a believer might..."</li>
<li><b>Sources:</b> "In the Bible, Jesus says...", "In Genesis...", "The Torah teaches...", "The Catholic Church teaches..."</li>
<li><b>Evaluate:</b> "However...", "On the other hand...", "This is a strong argument because...", "Many would disagree because..."</li>
<li><b>Conclude:</b> "Overall, the stronger argument is... because..."</li></ul></div>

<h2>Common mistakes</h2>
<div class="card"><ul class="b">
<li>Listing facts without explaining them (no development).</li>
<li>Two points that are really the same point.</li>
<li>No named source on a 6-mark question.</li>
<li>Saying "Christians believe..." for everything. Say "Catholics", "Protestants" or "some Christians" when views differ.</li>
<li>Only one side on a 12-mark answer, or no conclusion.</li>
<li>Giving only your own opinion. The exam wants religious teachings, and you may add non-religious views if the question allows.</li>
<li>Spending too long on early questions and rushing the 12-marker.</li></ul></div>

<h2>A simple revision routine</h2>
<div class="card"><ol class="steps">
<li><b>Learn:</b> read one topic in the section page and tick it as revised.</li>
<li><b>Recall:</b> do the flashcards for that topic.</li>
<li><b>Check:</b> take the quiz for that topic, then re-do your mistakes.</li>
<li><b>Write:</b> answer one exam question under timed conditions, then self-mark with the mark points.</li>
<li><b>Repeat:</b> do ten due flashcards every day. The app brings back cards you find hard.</li></ol></div>

  SECS.forEach(function(s){o+='<option value="'+s.section.id+'"'+(sel===s.section.id?' selected':'')+'>'+esc(s.section.title)+'</option>'});return o}
function topicOptions(sec,sel){var o='<option value="all">All topics</option>';if(SEC[sec])SEC[sec].topics.forEach(function(t){o+='<option value="'+t.id+'"'+(sel===t.id?' selected':'')+'>'+esc(t.code+': '+t.title)+'</option>'});return o}
function scopeUI(sc,extra){sc=sc||{};return '<label class="f" for="sc-sec">What to cover</label><select id="sc-sec" data-scope="1">'+scopeOptions(sc.sec||'all')+(extra||'')+'</select><div id="sc-topwrap" style="'+(SEC[sc.sec]?'':'display:none')+'"><label class="f" for="sc-top">Topic</label><select id="sc-top">'+topicOptions(sc.sec,sc.topic)+'</select></div>'}
function readScope(){var s=$('#sc-sec')?$('#sc-sec').value:'all',t=$('#sc-top')?$('#sc-top').value:'all';return {sec:s,topic:SEC[s]?t:'all'}}
function inScope(s,sc){var v=sc.sec;if(!v||v==='all')return true;var m=/^p(\d+)$/.exec(v);if(m)return s.section.paper===+m[1];return s.section.id===v}
function pool(kind,sc){var out=[];SECS.forEach(function(s){if(!inScope(s,sc))return;s[kind].forEach(function(x){if(sc.topic&&sc.topic!=='all'&&x.topic!==sc.topic)return;out.push(x)})});return out}

function startCards(){
  var sc=readScope();cardSetup={sec:sc.sec,topic:sc.topic,mode:$('#cd-mode').value,n:$('#cd-n').value};beginCards()}
function beginCards(){
  var now=Date.now(),all=pool('cards',cardSetup),q;
  if(cardSetup.mode==='all')q=shuffle(all);
  else if(cardSetup.mode==='weak')q=shuffle(all.filter(function(c){var x=S.cards[c.id];return x&&x.b<=2}));
  else{var d=shuffle(all.filter(function(c){return isDue(c,now)})),n=shuffle(all.filter(function(c){return !S.cards[c.id]}));q=d.concat(n)}
  q=q.slice(0,parseInt(cardSetup.n,10)||20);
  if(!q.length){view(hdr('Flashcards','',true)+'<div class="card"><p><b>Nothing to practise here right now.</b></p><p class="mut">No cards are due in this selection. Try "All cards, shuffled", or pick another section.</p><a class="btn pri" href="#/cards" data-act="resetCardsRoute">Change selection</a></div>');return}
  CS={queue:q,total:q.length,done:0,good:0,again:0,flip:false,seen:{}};renderCard()}
function renderCard(){
  if(!CS)return;

  var c=CS.queue[0],col_=col(c.sec);
  var h='<header class="top"><button class="ib" data-act="endCards" aria-label="Stop and go back">‹</button><div style="flex:1">'+bar(pct(CS.done,CS.total),col_)+'<p class="sub small" style="margin:4px 0 0">'+CS.done+' of '+CS.total+' · '+esc(SEC[c.sec].section.short||SEC[c.sec].section.title)+'</p></div>'+HOMEBTN+'</header>';
  h+='<div class="card fc c" style="--c:'+col_+';border-color:'+col_+'" data-act="flip" role="button" tabindex="0" aria-label="Card. Tap to reveal the answer">';
  h+=CS.flip?'<div class="small mut" style="margin-bottom:8px">Answer</div><div class="a">'+fmt(c.a)+'</div>'+sayBtn(c.say)+'<div class="hint">'+esc(c.q)+'</div>':'<div class="small mut" style="margin-bottom:8px">'+esc(tname(c.sec,c.topic))+'</div><div class="q">'+fmt(c.q)+'</div><div class="hint">Tap to reveal the answer</div>';
  h+='</div>';
  h+=CS.flip?'<div class="row"><button class="btn bad" data-act="cardAns" data-v="0">Not yet</button><button class="btn ok" data-act="cardAns" data-v="1">Got it</button></div>':'<button class="btn" style="width:100%" data-act="flip">Show answer</button>';
  view(h);var f=$('.fc');if(f)f.focus({preventScroll:true})}
var INTV=[0,0,1,3,7,14,30];
function cardAns(v){
  var c=CS.queue.shift(),x=S.cards[c.id]||{b:0,d:0},first=!CS.seen[c.id];CS.seen[c.id]=1;
  if(v){x.b=Math.min(6,(x.b||0)+1);x.d=Date.now()+INTV[Math.min(x.b,6)]*DAY;if(first)CS.good++;CS.done++}
  else{x.b=1;x.d=Date.now();if(first)CS.again++;CS.queue.splice(Math.min(3,CS.queue.length),0,c)}
  if(x.b>5)x.b=5;
  S.cards[c.id]=x;save();CS.flip=false;renderCard()}
