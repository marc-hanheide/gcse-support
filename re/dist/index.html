l":"Protestant","text":"Life continues after death, with judgement and heaven or hell. Salvation comes through faith in Jesus. Many do not accept purgatory."},{"label":"Orthodox Jewish","text":"The soul survives and the dead will be resurrected at the Messianic age. Everyone is accountable to God, so people should live by the mitzvot."},{"label":"Reform and Liberal Jewish","text":"Many focus on the soul living on, rather than bodily resurrection, and put emphasis on this life."},{"label":"Non-religious","text":"Death is the end of consciousness. Life is precious because it is the only one we have. Some leave open the possibility of an afterlife."}],"terms":[{"term":"afterlife","def":"beliefs about what happens to people after their body dies"},{"term":"resurrection","def":"rising again from death; for Christians, Jesus rose on the third day"},{"term":"judgement","def":"God deciding the fate of each person after death"},{"term":"heaven","def":"the place or state of eternal life with God"},{"term":"hell","def":"the place or state of separation from God"},{"term":"purgatory","def":"in Catholic belief, a place where souls are cleansed before heaven"},{"term":"Olam Ha-Ba","def":"the Jewish belief in a world to come after death"}],"sources":[{"text":"'I am the resurrection and the life. The one who believes in me will live, even though they die.'","ref":"John 11:25-26","use":"Jesus promises eternal life. Use it for Christian belief in life after death."},{"text":"Jesus describes people being separated like sheep and goats at the final judgement.","ref":"Matthew 25:31-46","use":"Source for judgement. Apply it by saying Christians try to help others in life."},{"text":"'He will wipe every tear from their eyes. There will be no more death or mourning.'","ref":"Revelation 21:4","use":"Source for the Christian view of heaven."},{"text":"'Multitudes who sleep in the dust of the earth will awake.'","ref":"Daniel 12:2","use":"Jewish source for resurrection of the dead."}],"tip":"For 'life after death' 12 markers, use evidence arguments: religious experience and the resurrection for, and lack of scientific proof for against. Then judge which is more convincing."}],"flashcards":[{"topic":"tb-01","q":"What is the Big Bang theory?","a":"The scientific theory that the universe began almost 14 billion years ago from a tiny, hot, dense point (a singularity), then expanded and cooled to form stars and galaxies."},{"topic":"tb-01","q":"What does creation ex nihilo mean?","a":"Creation out of nothing. Many Christians and Jews believe God made the universe from nothing, simply by his word."},{"topic":"tb-01","q":"What does Genesis 1:3 teach about God?","a":"God said 'Let there be light', and there was light. It shows God is all-powerful and can create just by speaking."},{"topic":"tb-01","q":"Why do some Christians reject the Big Bang?","a":"They take Genesis literally as God's word, so believe he made the world in six days, and see the Bible as more reliable than science."},{"topic":"tb-01","q":"How can a Christian accept both the Big Bang and creation?","a":"They can say Genesis is symbolic, that the Big Bang was God's method, and that science explains how while religion explains why."},{"topic":"tb-01","q":"What does the Catholic Church teach about the Big Bang?","a":"It accepts the Big Bang as a scientific theory that does not contradict belief in God as creator."},{"topic":"tb-01","q":"What does John 1:1-3 add to Christian beliefs about creation?","a":"It says everything was made through the Word, who is Jesus. This links creation to Jesus and the Trinity."},{"topic":"tb-01","q":"What is the non-religious view of the universe's origin?","a":"Atheists and humanists say science, such as the Big Bang and natural laws, explains the universe without God."},{"topic":"tb-02","q":"What is stewardship?","a":"The duty given by God to humans to look after the world and everything in it."},{"topic":"tb-02","q":"What is dominion?","a":"The belief that humans have been given charge of the world (Genesis 1:26-28). Most believers say this means caring rule, not exploitation."},{"topic":"tb-02","q":"Which verse is the main source for stewardship?","a":"Genesis 2:15: God put Adam in the garden 'to work it and take care of it'."},{"topic":"tb-02","q":"What does Psalm 24:1 say and why is it important?","a":"'The earth is the Lord's, and everything in it.' It shows the world belongs to God, so humans are caretakers, not owners."},{"topic":"tb-02","q":"What is awe and wonder?","a":"A feeling of amazement at nature, which many believers see as showing God's greatness (Psalm 19:1)."},{"topic":"tb-02","q":"What is Tikkun Olam?","a":"The Jewish duty to repair or heal the world, which includes caring for the environment."},{"topic":"tb-02","q":"What is bal tashchit?","a":"The Jewish rule against wasting or destroying things, based on Deuteronomy 20:19-20."},{"topic":"tb-02","q":"Give one way a religious person could carry out the duty of stewardship.","a":"Recycle, cut energy use, plant trees, join Eco Church or support charities such as CAFOD or Christian Aid."},{"topic":"tb-03","q":"What are natural resources?","a":"Materials found in nature that people use, such as oil, coal, gas, water and trees."},{"topic":"tb-03","q":"What does sustainable development mean?","a":"Meeting today's needs without damaging the ability of future generations to meet theirs."},{"topic":"tb-03","q":"Why do Christians say abusing the environment is wrong?","a":"The world belongs to God (Psalm 24:1) and humans are stewards who will answer to him, so wasting it fails in that duty."},{"topic":"tb-03","q":"What is Laudato Si'?","a":"A 2015 letter by Pope Francis on caring for 'our common home'. It calls for less waste and pollution and care for the poor."},{"topic":"tb-03","q":"How does the Parable of the Talents link to the environment?","a":"God entrusts humans with the world and expects them to use it wisely. Careless use fails the master."},{"topic":"tb-03","q":"Name two pressures on the environment.","a":"Population growth and deforestation. Others: fossil fuel use, climate change, waste."},{"topic":"tb-03","q":"What is the Jewish festival of Tu BiShvat?","a":"The New Year of the Trees, when Jews plant trees and celebrate the natural world."},{"topic":"tb-03","q":"Which Christian groups work on environmental issues?","a":"Eco Church (A Rocha UK), CAFOD and Christian Aid."},{"topic":"tb-04","q":"What is pollution?","a":"Contamination of the environment with harmful substances."},{"topic":"tb-04","q":"Name three types of pollution and a cause of each.","a":"Air (vehicle and factory fumes), water (oil spills, chemicals, waste), land (rubbish and chemicals)."},{"topic":"tb-04","q":"Why do Christians say pollution is wrong?","a":"It abuses God's creation (stewardship) and harms neighbours, especially the poor, which goes against 'love your neighbour'."},{"topic":"tb-04","q":"What effect does air pollution have on health?","a":"It can cause asthma, lung disease and other illness, and it contributes to climate change."},{"topic":"tb-04","q":"What did the Deepwater Horizon spill (2010) show?","a":"It showed how oil pollution can kill huge numbers of sea creatures and damage ecosystems."},{"topic":"tb-04","q":"What does Pope Francis say about pollution in Laudato Si'?","a":"That waste and pollution are damaging 'our common home' and that people must reduce waste and care for the poor."},{"topic":"tb-04","q":"How might a Jewish person reduce pollution?","a":"By following bal tashchit (avoiding waste) and Tikkun Olam (repairing the world), for example recycling and saving energy."},{"topic":"tb-04","q":"What is renewable energy?","a":"Energy from sources that do not run out, such as wind and solar. It reduces pollution compared to fossil fuels."},{"topic":"tb-05","q":"What is animal experimentation?","a":"Using animals for medical research or to test products."},{"topic":"tb-05","q":"Give a Christian argument in favour of animal experimentation.","a":"Humans are more valuable than animals (made in God's image), so research that saves lives is acceptable if suffering is minimised."},{"topic":"tb-05","q":"Give a religious argument against animal experimentation.","a":"Animals are God's creatures and valuable to him (Genesis 1:25, Proverbs 12:10), so causing suffering is cruel and wrong."},{"topic":"tb-05","q":"What are the 3Rs in UK animal testing?","a":"Replace animals where possible, reduce the number used, and refine methods to cut suffering."},{"topic":"tb-05","q":"What does Genesis 9:3 say about eating animals?","a":"After the flood God said 'Everything that lives and moves about will be food for you', so Christians and Jews may eat meat."},{"topic":"tb-05","q":"What is shechita?","a":"The Jewish method of killing animals for kosher meat, designed to be quick and humane."},{"topic":"tb-05","q":"What is tza'ar ba'alei chayim?","a":"The Jewish teaching that humans must not cause unnecessary pain to animals."},{"topic":"tb-05","q":"Why are some Christians vegetarian?","a":"They believe animals are God's creatures, they want to avoid cruelty, and some point to Eden (Genesis 1:29) where only plants were eaten."},{"topic":"tb-06","q":"What does Genesis 1:27 say about human life?","a":"God created mankind in his own image. This gives humans special value and responsibility."},{"topic":"tb-06","q":"What does Genesis 2:7 teach?","a":"God formed Adam from dust and breathed life into him. Life comes from God."},{"topic":"tb-06","q":"What is evolution?","a":"The scientific theory that living things developed over millions of years through natural selection."},{"topic":"tb-06","q":"Who wrote On the Origin of Species and when?","a":"Charles Darwin, in 1859."},{"topic":"tb-06","q":"What is natural selection?","a":"Creatures best suited to their environment survive and pass on their genes, so species change over time."},{"topic":"tb-06","q":"What is intelligent design?","a":"The belief that living things are too complex to have happened by chance, so they must have been designed by God."},{"topic":"tb-06","q":"How can a Christian accept evolution?","a":"By saying Genesis is symbolic, that God used evolution to create life, and that Genesis explains why while science explains how."},{"topic":"tb-06","q":"Why might a creationist reject evolution?","a":"They take Genesis literally as God's word, so God made humans directly rather than through evolution."},{"topic":"tb-07","q":"What is the sanctity of life?","a":"The belief that life is sacred and holy because it is created by God."},{"topic":"tb-07","q":"What is quality of life?","a":"The standard of health, comfort and happiness a person experiences."},{"topic":"tb-07","q":"What is pikuach nefesh?","a":"The Jewish principle that saving a life overrides almost all other laws, including the Sabbath."},{"topic":"tb-07","q":"Which commandment supports the sanctity of life?","a":"'You shall not murder' (Exodus 20:13)."},{"topic":"tb-07","q":"Why do Christians say the body belongs to God?","a":"1 Corinthians 6:19: 'Your bodies are temples of the Holy Spirit', so life is not ours to take."},{"topic":"tb-07","q":"How can quality of life conflict with sanctity of life?","a":"Quality of life may suggest ending a life of suffering is kind, but sanctity of life says life is sacred whatever its condition."},{"topic":"tb-07","q":"Give a non-religious view of the value of life.","a":"Humanists value life as the only one we have, but also stress quality of life and personal choice."},{"topic":"tb-08","q":"What is the legal time limit for abortion in Britain?","a":"24 weeks, under the Abortion Act 1967 as amended. After that it is only allowed in serious cases, such as risk to the mother's life or severe foetal abnormality."},{"topic":"tb-08","q":"What does the Catholic Church teach about abortion?","a":"Life begins at conception and abortion is always wrong because it ends an innocent human life."},{"topic":"tb-08","q":"What does the Church of England teach about abortion?","a":"Abortion takes a life and is serious, but may be the lesser of two evils in limited cases, such as a risk to the mother's life."},{"topic":"tb-08","q":"What is the Jewish view of abortion?","a":"Life is valuable and the foetus is protected, but it is not a full person until most of it is born, so abortion is allowed to save the mother."},{"topic":"tb-08","q":"What does pro-life mean?","a":"The belief that the unborn child has a right to life, so abortion is wrong."},{"topic":"tb-08","q":"What does pro-choice mean?","a":"The belief that a woman has the right to choose whether to have an abortion."},{"topic":"tb-08","q":"Which Bible verse shows God knows people before birth?","a":"Jeremiah 1:5: 'Before I formed you in the womb I knew you, before you were born I set you apart.'"},{"topic":"tb-08","q":"Give an argument for abortion that a Christian might use.","a":"Compassion: it may be the lesser of two evils where the mother's life is at risk or after rape. Jesus taught mercy."},{"topic":"tb-09","q":"What is euthanasia?","a":"Painlessly ending someone's life to relieve suffering from an incurable or painful illness."},{"topic":"tb-09","q":"What is the difference between voluntary and non-voluntary euthanasia?","a":"Voluntary is at the patient's request. Non-voluntary is when the patient cannot ask, for example if unconscious."},{"topic":"tb-09","q":"What is the UK law on euthanasia?","a":"Euthanasia and assisted suicide are illegal in England and Wales. The Suicide Act 1961 made suicide legal, but helping is a crime."},{"topic":"tb-09","q":"Why do many Christians oppose euthanasia?","a":"Life is a gift from God and only God should end it. 'You shall not murder' and the sanctity of life."},{"topic":"tb-09","q":"What is a hospice?","a":"A place that cares for the dying, easing pain and offering support, which Christians often see as an alternative to euthanasia."},{"topic":"tb-09","q":"Why might some Christians support euthanasia?","a":"Compassion and mercy ('Blessed are the merciful'): ending unbearable suffering may be the most loving thing."},{"topic":"tb-09","q":"What is the Orthodox Jewish view of euthanasia?","a":"Active euthanasia is forbidden and counts as murder, but treatment that only prolongs dying may be withheld."},{"topic":"tb-09","q":"What is a non-religious argument for euthanasia?","a":"People should have the right to choose a dignified death and avoid pointless suffering."},{"topic":"tb-10","q":"Why do Christians believe in life after death?","a":"Jesus rose from the dead and promised eternal life (John 11:25-26), and the Bible teaches judgement, heaven and hell."},{"topic":"tb-10","q":"What is purgatory?","a":"In Catholic belief, a place where souls are cleansed after death before they enter heaven."},{"topic":"tb-10","q":"What is Olam Ha-Ba?","a":"The Jewish belief in a world to come after death."},{"topic":"tb-10","q":"Why do Orthodox Jews avoid cremation?","a":"They believe God will resurrect the body, so it must be buried."},{"topic":"tb-10","q":"How does belief in judgement affect a Christian's life?","a":"It encourages them to live morally and help others (Matthew 25:31-46), knowing God will judge them."},{"topic":"tb-10","q":"What do atheists and humanists believe about death?","a":"That death is the end of consciousness, so this life is precious and should be lived fully."},{"topic":"tb-10","q":"Give one argument for life after death.","a":"The resurrection of Jesus, religious experiences, near-death experiences, or the idea that the soul is separate from the body."},{"topic":"tb-10","q":"Give one argument against life after death.","a":"There is no scientific evidence, the mind depends on the brain, and belief may be wishful thinking."}],"quiz":[{"topic":"tb-01","q":"Which of the following is a religious theory about how the universe began?","options":["Creation","Collision theory","Natural selection","The steady cloud"],"answer":0,"why":"Creation is the religious belief that God made the universe. Natural selection is part of evolution, not the origin of the universe."},{"topic":"tb-01","q":"The scientific theory that the universe began almost 14 billion years ago from a singularity is called:","options":["Evolution","The Big Bang","Intelligent design","Creationism"],"answer":1,"why":"The Big Bang theory describes the expansion of the universe from a hot, dense point."},{"topic":"tb-01","q":"A Christian says: 'Genesis tells us why God made the world, and science tells us how.' This view is most likely held by:","options":["A creationist","An atheist","A liberal or Catholic Christian","A fundamentalist"],"answer":2,"why":"Liberal and Catholic Christians treat Genesis as a symbolic story, so they can accept science."},{"topic":"tb-01","q":"Which source shows that God created by speaking?","options":["Genesis 2:15","Psalm 24:1","Exodus 20:13","Genesis 1:3"],"answer":3,"why":"'Let there be light' in Genesis 1:3 shows God creating by his word."},{"topic":"tb-02","q":"Which term means the duty given by God to look after the world?","options":["Stewardship","Dominion","Evolution","Sanctity"],"answer":0,"why":"Stewardship is the caretaker role. Dominion is about being in charge."},{"topic":"tb-02","q":"Which verse says 'The earth is the Lord's, and everything in it'?","options":["Genesis 1:27","Psalm 24:1","Matthew 5:7","Exodus 20:14"],"answer":1,"why":"Psalm 24:1 shows the world belongs to God."},{"topic":"tb-02","q":"Which Jewish idea means 'repairing the world'?","options":["Shechita","Pikuach nefesh","Tikkun Olam","Kosher"],"answer":2,"why":"Tikkun Olam is the duty to repair and heal the world."},{"topic":"tb-02","q":"A believer feels amazed when she sees a starry sky and thinks of God. This is an example of:","options":["Dominion","Pollution","Euthanasia","Awe and wonder"],"answer":3,"why":"Awe and wonder is amazement at nature, often linked to a sense that God is revealed through it."},{"topic":"tb-03","q":"Which of these is a natural resource?","options":["Oil","Plastic bag","A car","A fridge"],"answer":0,"why":"Natural resources, such as oil, coal, water and trees, come from nature."},{"topic":"tb-03","q":"What does 'sustainable development' aim to do?","options":["Use up resources quickly","Meet today's needs without harming future generations","Stop all building","Increase pollution"],"answer":1,"why":"Sustainable development looks after the needs of future generations as well as the present."},{"topic":"tb-03","q":"Which parable is used to teach that humans should use God's gifts wisely?","options":["The Good Samaritan","The Prodigal Son","The Talents","The Sower"],"answer":2,"why":"The Parable of the Talents says servants must use what they are given responsibly."},{"topic":"tb-03","q":"Pope Francis's 2015 letter about caring for the environment is called:","options":["Humanae Vitae","Genesis","Summa Theologica","Laudato Si'"],"answer":3,"why":"Laudato Si' is about caring for our common home. Humanae Vitae is about contraception."},{"topic":"tb-04","q":"Which is an example of water pollution?","options":["Oil spill at sea","Vehicle fumes","Cutting trees","Wind turbines"],"answer":0,"why":"Oil spills harm marine life and are a type of water pollution."},{"topic":"tb-04","q":"Why do Christians say pollution goes against 'love your neighbour'?","options":["It makes lakes blue","It harms other people, especially the poor","It saves money","It is a Jewish law"],"answer":1,"why":"Pollution affects people's health and lives, which is unloving."},{"topic":"tb-04","q":"Which of the following causes air pollution?","options":["Recycling","Planting trees","Fumes from vehicles and factories","Solar panels"],"answer":2,"why":"Fumes from vehicles and factories release harmful gases."},{"topic":"tb-05","q":"Which verse is used to show humans can eat animals?","options":["Genesis 2:15","Luke 12:6","Psalm 19:1","Genesis 9:3"],"answer":3,"why":"After the flood, God said everything that lives and moves would be food for humans."},{"topic":"tb-05","q":"What does 'kosher' mean?","options":["Food allowed by Jewish law","A Christian prayer","A type of pollution","A medical test"],"answer":0,"why":"Kosher food is prepared according to Jewish dietary laws."},{"topic":"tb-05","q":"Which statement is a religious argument against animal experimentation?","options":["Humans are more important","Animals are God's creatures and should not suffer","It saves lives","It is legal in the UK"],"answer":1,"why":"Believers argue animals are valuable to God and cruelty is wrong."},{"topic":"tb-05","q":"Which Jewish teaching tells people not to cause pain to animals?","options":["Olam Ha-Ba","Bal tashchit","Tza'ar ba'alei chayim","Chuppah"],"answer":2,"why":"Tza'ar ba'alei chayim means avoiding cruelty to living creatures."},{"topic":"tb-06","q":"Who wrote On the Origin of Species?","options":["Pope Francis","Isaac Newton","Richard Dawkins","Charles Darwin"],"answer":3,"why":"Darwin published it in 1859 and put forward natural selection."},{"topic":"tb-06","q":"Which phrase describes how some Christians accept both Genesis and evolution?","options":["Genesis is a symbolic story and evolution is God's method","Genesis is wrong","Evolution is false","God did not create"],"answer":0,"why":"This is the 'why and how' approach: Genesis explains why, science explains how."},{"topic":"tb-06","q":"What do creationists believe?","options":["Evolution is correct","Genesis is literally true","There is no God","Life began in space"],"answer":1,"why":"Creationists take the Genesis account as God's word and as describing real events."},{"topic":"tb-07","q":"What does 'sanctity of life' mean?","options":["Life is just a chemical process","Life should have luxury","Life is sacred because God created it","Life ends at birth"],"answer":2,"why":"Sanctity of life is the belief that life is holy and special."},{"topic":"tb-07","q":"What is 'quality of life'?","options":["The number of years lived","A medical drug","A religious law","The standard of health, comfort and happiness"],"answer":3,"why":"Quality of life is about how good a person's life is, not just whether they are alive."},{"topic":"tb-07","q":"Which Jewish principle says saving a life overrides almost all other laws?","options":["Pikuach nefesh","Kashrut","Mitzvah","Minyan"],"answer":0,"why":"Pikuach nefesh means saving life takes priority, even over the Sabbath."},{"topic":"tb-08","q":"What is the legal upper time limit for most abortions in Britain?","options":["12 weeks","24 weeks","18 weeks","32 weeks"],"answer":1,"why":"The Abortion Act 1967, as amended, sets 24 weeks for most abortions."},{"topic":"tb-08","q":"Which Church teaches that abortion is always wrong?","options":["Church of England","Methodist Church","Roman Catholic Church","Quakers"],"answer":2,"why":"Catholics believe life begins at conception and abortion ends an innocent life."},{"topic":"tb-08","q":"A person who believes a woman has the right to choose whether to have an abortion is:","options":["Pro-life","A creationist","A pacifist","Pro-choice"],"answer":3,"why":"Pro-choice supporters emphasise a woman's right to choose."},{"topic":"tb-08","q":"Which Bible verse shows God knew people before they were born?","options":["Jeremiah 1:5","Genesis 9:3","Exodus 20:14","Galatians 3:28"],"answer":0,"why":"Jeremiah 1:5 is widely used in the abortion debate."},{"topic":"tb-09","q":"Which of the following is voluntary euthanasia?","options":["A doctor ends a patient's life against their wishes","A patient asks a doctor to end their life","A patient refuses food","Palliative care"],"answer":1,"why":"Voluntary euthanasia is carried out at the patient's own request."},{"topic":"tb-09","q":"Which Act made suicide legal in England and Wales?","options":["Abortion Act 1967","Equality Act 2010","Suicide Act 1961","Marriage Act 2013"],"answer":2,"why":"The Suicide Act 1961 decriminalised suicide, though assisting suicide remains a crime."},{"topic":"tb-09","q":"What is a hospice?","options":["A type of drug","A law","A Christian festival","A place that cares for the dying"],"answer":3,"why":"Hospices provide palliative care. Christians often support them as an alternative to euthanasia."},{"topic":"tb-09","q":"Which commandment is used to argue euthanasia is wrong?","options":["You shall not murder","Honour your father and mother","You shall not steal","Keep the Sabbath"],"answer":0,"why":"Opponents say ending a life breaks the commandment against murder."},{"topic":"tb-10","q":"Which Christian belief is a place where souls are cleansed before heaven?","options":["Olam Ha-Ba","Purgatory","Resurrection","Salvation"],"answer":1,"why":"Purgatory is a Catholic belief. Many Protestants do not accept it."},{"topic":"tb-10","q":"Why do Orthodox Jews avoid cremation?","options":["It costs money","The law forbids burial","They believe in bodily resurrection","They do not believe in God"],"answer":2,"why":"They believe God will raise the dead, so the body is buried."},{"topic":"tb-10","q":"Which verse describes Jesus saying 'I am the resurrection and the life'?","options":["Genesis 1:1","Psalm 24:1","Exodus 20:12","John 11:25"],"answer":3,"why":"John 11:25-26 is a key Christian source for life after death."},{"topic":"tb-10","q":"Which of these is a non-religious argument against life after death?","options":["There is no scientific evidence for it","Jesus rose again","Religious experiences","The soul is separate from the body"],"answer":0,"why":"Sceptics point to the lack of scientific proof and to the mind depending on the brain."}],"exam":[{"topic":"tb-08","marks":12,"type":"evaluate","q":"'Abortion is always wrong.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Many religious people agree with this statement. The Roman Catholic Church teaches that life begins at conception and is sacred because humans are made in God's image (Genesis 1:27). Jeremiah 1:5 says 'Before I formed you in the womb I knew you', which suggests God has a plan for every unborn child, and the commandment 'You shall not murder' (Exodus 20:13) is used to say abortion is killing. Pro-life supporters add that unwanted children can be adopted. This is a strong argument for believers who see life as a gift from God, because it treats the unborn as having full value from the start.\n\nHowever, many people disagree. The Church of England teaches that abortion is serious, but may be the lesser of two evils where the mother's life is at risk, or after rape. Jesus taught compassion ('Blessed are the merciful', Matthew 5:7), so some Christians say the suffering of the woman matters too. Judaism teaches that the mother's life comes first and that the foetus is not a full person until it is mostly born. Pro-choice supporters argue that a woman has the right to decide what happens to her own body and that quality of life matters, for example if a baby would be born with a severe condition. This argument is strong in extreme cases such as danger to life, but it is less convincing if the reason is only convenience, as it does not explain the rights of the unborn child.\n\nIn conclusion, I think the word 'always' makes the statement too strong. Even religious teaching recognises exceptions, such as saving the mother's life, and a loving God would not want a woman to die. However, I think the sanctity of life means abortion should never be taken lightly, and Christians would say it should be a last resort with support and alternatives offered. Therefore abortion is a serious moral wrong in most cases, but not in every case.","for":["Catholic teaching: life begins at conception and is sacred (Genesis 1:27, Catechism).","Jeremiah 1:5 and Psalm 139:13: God knows and plans each person before birth.","'You shall not murder' (Exodus 20:13): abortion is killing an innocent life.","Alternatives such as adoption exist.","Evaluation: strong for those who accept sanctity of life, since the unborn child has full value."],"against":["Church of England: lesser of two evils, for example if the mother's life is at risk.","Compassion: Matthew 5:7, and Jewish teaching that the mother's life comes first.","Pro-choice: the woman's right to choose, and quality of life.","Evaluation: strong in extreme cases, weaker if the reason is convenience."],"conclusion":"Abortion is a serious wrong in most views, but 'always' is too strong as even religious teachings allow exceptions such as saving the mother's life."},{"topic":"tb-09","marks":12,"type":"evaluate","q":"'Euthanasia should be legal.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Some people believe euthanasia should be legal. Non-religious people, such as humanists, argue that people should be able to choose a dignified death and avoid pointless suffering, as they have a right to decide about their own lives. Some Christians agree, quoting 'Blessed are the merciful' (Matthew 5:7): if a person is in unbearable pain and clearly asks to die, helping them could be the most loving act. God gave humans free will, so they should be able to decide how they die. This argument is strong because it is based on compassion and autonomy, but it relies on there being safeguards so the choice is truly free.\n\nHowever, many people think euthanasia should remain illegal. The Catholic Church and Church of England teach that life is a gift from God and only God should end it. Exodus 20:13 says 'You shall not murder', and 1 Corinthians 6:19 says our bodies are 'temples of the Holy Spirit'. Orthodox Jews also see euthanasia as murder. They argue that hospices and palliative care can control pain without ending life. Many people also worry that if euthanasia were legal, the elderly, disabled or poor might feel pressured to choose it, or that mistakes might be made. This argument is strong because the risk of pressure on vulnerable people is real, and it is hard to reverse the choice once made.\n\nIn conclusion, I think the arguments against are slightly stronger. Compassion is important, but the sanctity of life and the risk of harm to vulnerable people mean that changing the law is dangerous. Better palliative care is a safer way to reduce suffering. However, I accept that people who are dying and in great pain can have a powerful case, so the law needs to be debated carefully, and religious and non-religious people can reasonably disagree.","for":["Compassion and mercy (Matthew 5:7): ending unbearable suffering can be loving.","Free will and autonomy: people should choose how they die.","Humanists: a right to a dignified death.","Evaluation: strong, but needs safeguards to make sure the choice is free."],"against":["Sanctity of life: only God should end life (Exodus 20:13, 1 Corinthians 6:19).","Orthodox Jews: active euthanasia is murder.","Hospices and palliative care are alternatives.","Risk of pressure on vulnerable people and mistakes.","Evaluation: strong because the risks are serious and irreversible."],"conclusion":"Compassion gives a powerful case, but the sanctity of life and the risk to vulnerable people make the arguments against slightly stronger."},{"topic":"tb-10","marks":12,"type":"evaluate","q":"'There is no good evidence for life after death.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Many non-religious people agree with this statement. Atheists and humanists say there is no scientific proof that anything happens after death, because nobody has been able to test it. They also point out that the mind depends on the brain, so when the brain stops, consciousness ends. Some say belief in heaven is just wishful thinking, because people find it hard to accept death. This argument is strong because science relies on evidence that can be tested, but it does not prove that there is no afterlife, only that science cannot measure it.\n\nHowever, religious people argue that there is good evidence. Christians point to the resurrection of Jesus, who rose from the dead and promised 'I am the resurrection and the life' (John 11:25). If Jesus rose, death is not the end. Many believers also cite religious experiences, and some people report near-death experiences. Christians and Jews also say that conscience and the sense that justice must be done suggest God will judge people after death (Matthew 25:31-46). Orthodox Jews believe God will raise the dead. This argument is strong for believers who accept the Bible as God's word, but is weaker for sceptics, as the resurrection depends on faith in the Gospels and near-death experiences could be caused by the brain.\n\nIn conclusion, I think the statement depends on what counts as 'good evidence'. If it means scientific proof, the statement is true, as there is none. But religious believers use a different kind of evidence, such as scripture and experience, which they find convincing. I think belief in life after death is reasonable, but it cannot be proved, so it ultimately requires faith. For someone who already believes in God, the resurrection is strong evidence. For someone who does not, it is not.","for":["No scientific proof of an afterlife.","The mind depends on the brain, so consciousness ends at death.","Heaven may be wishful thinking.","Evaluation: strong because science needs testable evidence, but it does not prove there is no afterlife."],"against":["Resurrection of Jesus and his promise (John 11:25).","Religious experiences and near-death experiences.","Conscience and justice suggest judgement (Matthew 25:31-46); Orthodox Jewish belief in resurrection.","Evaluation: strong for believers, weaker for sceptics who point to the brain."],"conclusion":"There is no scientific proof, but believers use scripture and experience as evidence, so belief is reasonable but requires faith."},{"topic":"tb-03","marks":12,"type":"evaluate","q":"'Looking after the environment is the most important duty for religious believers.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Some religious people would agree with this statement. Christians and Jews believe God created the world and it belongs to him ('The earth is the Lord's', Psalm 24:1), so humans are stewards who must look after it. In Genesis 2:15 God told Adam to 'take care of' the garden. Jews also follow Tikkun Olam, repairing the world. If the environment is destroyed, there will be no future for humans or other creatures, so protecting it comes before everything else. This is a strong argument because environmental damage such as climate change affects everyone, especially the poor, and cannot easily be reversed.\n\nHowever, other believers say it is not the most important duty. Jesus said the greatest commandments are to love God and love your neighbour (Matthew 22:37-39), so worshipping God and caring for people come first. Christians may argue that helping the poor, the sick and the homeless is more urgent than protecting nature, and that humans are more valuable than the rest of creation because they are made in God's image. Some believers also think that since God is in control, humans cannot be the only ones responsible. This argument is strong because Jesus put people first, but it is weaker when we remember that harming the environment also harms people, so the two duties are linked.\n\nIn conclusion, I think looking after the environment is a very important duty but not necessarily the most important one. Religious teaching puts loving God and loving others first, but caring for the environment is a way of doing both, because it respects God's creation and protects human life. For this reason I believe the duties support each other, and a believer who ignores the environment is failing in other duties as well.","for":["The world is God's (Psalm 24:1) and humans are stewards (Genesis 2:15).","Tikkun Olam: Jews must repair the world.","Without a healthy planet, there is no future for humans.","Evaluation: strong because environmental damage affects everyone and is hard to reverse."],"against":["Greatest commandments: love God and love neighbour (Matthew 22:37-39).","Helping people may be more urgent than protecting nature; humans are made in God's image.","Evaluation: strong because Jesus put people first, but environmental harm also harms people."],"conclusion":"Looking after the environment is very important, but it is part of loving God and neighbour, so the duties go together rather than competing."},{"topic":"tb-01","marks":12,"type":"evaluate","q":"'Science has disproved what religion teaches about the origins of the universe.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Some people agree with this statement. Genesis 1 teaches that God created the world in six days, but the Big Bang theory says the universe began almost 14 billion years ago and developed through natural processes. Scientists can support the Big Bang with evidence, such as the expansion of the universe, while there is no scientific evidence for the six days. Non-religious people, such as atheists, say that science explains the universe without needing God. This argument is strong for those who only trust evidence, because the Big Bang is supported by testable observations.\n\nHowever, many religious people disagree. Creationist Christians and some Orthodox Jews say Genesis is the word of God, so it is true and science is mistaken. Others say there is no conflict at all. Catholics and liberal Christians accept the Big Bang and say Genesis is a symbolic story. They believe that God caused the Big Bang, so science explains how the universe began and religion explains why. The Big Bang theory was even first proposed by a Catholic priest, Georges Lemaitre. Science also cannot explain what caused the Big Bang or why anything exists at all. This argument is strong because it respects both sides, but it does not satisfy creationists who think the Bible should be taken literally.\n\nIn conclusion, I do not think science has disproved religion. Science may have disproved a literal reading of Genesis for some believers, but religion is not mainly about how the universe began. It is about why it exists and what it means. Since science cannot answer questions of purpose or what came before the Big Bang, belief in a creator God remains possible. Therefore the statement is too strong, although it does challenge those who read Genesis literally.","for":["Genesis says six days; science says almost 14 billion years.","The Big Bang is supported by evidence; Genesis is not scientific evidence.","Non-religious: the universe can be explained naturally without God.","Evaluation: strong for those who trust only evidence."],"against":["Many Christians and Jews read Genesis as symbolic and accept the Big Bang.","Science explains how, religion explains why; Georges Lemaitre, a priest, proposed the Big Bang.","Science cannot explain what caused the Big Bang or why anything exists.","Creationists say Genesis is God's word.","Evaluation: strong because it respects both, though it does not satisfy literal believers."],"conclusion":"Science challenges a literal reading of Genesis but has not disproved belief in a creator, so the statement is too strong."},{"topic":"tb-09","marks":4,"type":"different","q":"Explain two different religious beliefs about euthanasia. In your answer you must refer to one or more religious traditions.","model":"One belief, held by Roman Catholics, is that euthanasia is always wrong. This is because life is a gift from God and only God has the right to end it, so deliberately ending a life breaks the commandment 'You shall not murder'. A different belief, held by some liberal Christians, is that euthanasia can be acceptable. This is because Jesus taught compassion, so ending the unbearable suffering of a person who clearly asks to die can be the most loving thing to do.","points":["Catholic: euthanasia is wrong (1), sanctity of life / only God ends life / do not murder (1).","Liberal Christian or other: euthanasia may be acceptable (1), compassion / quality of life / free will (1).","Other creditable: Orthodox Jewish view that active euthanasia is murder; Reform Jewish openness to a dignified death."]},{"topic":"tb-08","marks":4,"type":"similar","q":"Explain two similar religious beliefs about abortion. In your answer you must refer to one or more religious traditions.","model":"One belief, held by Christians, is that abortion may be allowed to save the mother's life. This is because the Church of England teaches that, although abortion takes a life, it can be the lesser of two evils when the mother's life is at risk. A similar belief, held by Jews, is that abortion is permitted if the mother's life is in danger. This is because Judaism teaches that the mother's life comes first, and the foetus is not a full person until it is mostly born.","points":["Christian (Church of England or similar): abortion may be allowed to save the mother (1), lesser of two evils / sanctity of her life (1).","Jewish: abortion allowed if mother's life is at risk (1), mother's life comes before the foetus / foetus not a full person until mostly born (1).","Other creditable: both traditions value the life of the unborn and discourage abortion for convenience."]},{"topic":"tb-01","marks":4,"type":"different","q":"Explain two different religious beliefs about the origins of the universe. In your answer you must refer to one or more religious traditions.","model":"One belief, held by creationist Christians, is that God made the universe in six days exactly as Genesis 1 describes. This is because they believe the Bible is the word of God, so it is literally true, and they reject the Big Bang. A different belief, held by many Catholics and liberal Christians, is that Genesis is a symbolic story. This is because they believe God created the universe but that the Big Bang could be the way he did it, so science and religion can agree.","points":["Creationist: God created in six days as in Genesis (1), because the Bible is God's word (1).","Catholic or liberal: Genesis is symbolic and the Big Bang is compatible with God (1), science explains how, religion explains why (1).","Other creditable: some Orthodox Jews read the 'days' as long periods; non-religious view that the Big Bang needs no God (if the question allows it)."]},{"topic":"tb-04","marks":4,"type":"similar","q":"Explain two similar religious beliefs about pollution. In your answer you must refer to one or more religious traditions.","model":"One belief, held by Christians, is that polluting the environment is wrong because it fails the duty of stewardship. God gave humans the job of caring for the world, so they must pass it on in good condition. A similar belief, held by Jews, is that pollution goes against the duty of Tikkun Olam, which means repairing the world. This is because the world belongs to God, so people should heal it, not damage it.","points":["Christian: pollution is wrong / goes against stewardship (1), God gave humans care of the world (1).","Jewish: pollution goes against Tikkun Olam or bal tashchit (1), the world belongs to God and should be repaired (1).","Other creditable: pollution harms neighbours, so goes against 'love your neighbour'; Laudato Si'."]},{"topic":"tb-05","marks":4,"type":"different","q":"Explain two different religious beliefs about eating animals. In your answer you must refer to one or more religious traditions.","model":"One belief, held by many Christians, is that it is acceptable to eat meat. This is because Genesis 9:3 says 'Everything that lives and moves about will be food for you', so God has allowed humans to use animals for food. A different belief, held by some Christians who are vegetarian, is that eating animals is wrong. This is because animals are God's creatures and valuable to him, so killing them for food is unnecessary and causes suffering.","points":["Christians may eat meat (1), God gave permission in Genesis 9:3 / humans have dominion (1).","Some Christians are vegetarian (1), animals are God's creatures / avoid cruelty / Genesis 1:29 (1).","Other creditable: Jews may eat only kosher meat killed by shechita; Jews are forbidden to eat pork."]},{"topic":"tb-06","marks":4,"type":"different","q":"Explain two different religious beliefs about evolution. In your answer you must refer to one or more religious traditions.","model":"One belief, held by creationist Christians, is that evolution is wrong. This is because they believe God created humans directly as described in Genesis, so humans did not develop from earlier species. A different belief, held by many Christians and Reform Jews, is that evolution is how God created life. This is because they see Genesis as symbolic, so evolution can be God's method and science and faith can work together.","points":["Creationist: evolution rejected (1), Genesis is literally true / God made humans directly (1).","Other Christians or Reform Jews: evolution accepted as God's method (1), Genesis symbolic / science explains how (1).","Other creditable: some Orthodox Jews reject evolution, others accept it."]},{"topic":"tb-02","marks":6,"type":"explain-two-source","q":"Explain two reasons why many religious people believe they have a duty to look after the world. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One reason is that the world belongs to God. This means humans are only caretakers and do not own it. Psalm 24:1 says 'The earth is the Lord's, and everything in it'. This means religious people should treat the world with respect, for example by avoiding waste and pollution. Another reason is that God gave humans the role of stewards. This means God trusted them with the job of looking after creation. Genesis 2:15 says God put Adam in the garden 'to work it and take care of it'. This means believers should protect the environment, as they will have to answer to God for how they have treated it.","points":["Reason 1: the world belongs to God (1), development (1), Psalm 24:1 (1), application (1).","Reason 2: God gave humans stewardship (1), development (1), Genesis 2:15 (1), application (1).","Other creditable: future generations, awe and wonder (Psalm 19:1), Tikkun Olam."]},{"topic":"tb-03","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about the use and abuse of the environment. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that humans must use the environment wisely. This means they may use natural resources, but must not waste them. The Parable of the Talents (Matthew 25:14-30) teaches that God trusts people with gifts and expects them to use them well. This means Christians should use energy and resources carefully, for example by recycling. Another belief is that abusing the environment is wrong because it belongs to God. Leviticus 25:23 says 'the land is mine and you reside in my land as foreigners and strangers'. This means humans are only tenants, so they must not destroy or pollute what is God's.","points":["Use resources wisely (1), development (1), Matthew 25:14-30 (1), application (1).","Abuse is wrong because the earth is God's (1), development (1), Leviticus 25:23 or Psalm 24:1 (1), application (1).","Other creditable: Laudato Si'; bal tashchit; Deuteronomy 20:19."]},{"topic":"tb-05","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about animal experimentation. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that animal experimentation is acceptable if it saves human lives. This is because humans are made in the image of God and have dominion over animals (Genesis 1:26). This means human life is more valuable, so Christians can support medical research on animals if suffering is kept to a minimum. Another belief is that experiments on animals are wrong because animals are God's creatures. Proverbs 12:10 says 'The righteous care for the needs of their animals'. This means causing animals pain for research is cruel, so some Christians oppose experimentation or support alternatives such as computer models.","points":["Acceptable if it saves lives (1), humans more valuable (1), Genesis 1:26 or Catechism (1), application with minimal suffering (1).","Wrong because animals matter to God (1), cruelty (1), Proverbs 12:10 or Luke 12:6 (1), application (1).","Other creditable: Jewish tza'ar ba'alei chayim; UK law and the 3Rs."]},{"topic":"tb-07","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about the sanctity of life. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that life is sacred because humans are made in the image of God. This means every person has special value, whatever their age or health. Genesis 1:27 says 'God created mankind in his own image'. This means Christians treat all human life as precious and oppose actions that end it, such as euthanasia. Another belief is that only God can take life. Exodus 20:13 says 'You shall not murder'. This means killing is wrong, so many Christians and Jews oppose abortion and euthanasia, as they believe life belongs to God.","points":["Life is sacred because made in God's image (1), development (1), Genesis 1:27 (1), application (1).","Only God takes life (1), development (1), Exodus 20:13 (1), application (1).","Other creditable: pikuach nefesh; 1 Corinthians 6:19; Psalm 139."]},{"topic":"tb-08","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about abortion. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief, held by Catholics, is that abortion is wrong because life begins at conception. This means that the unborn child is already a person with a right to life. Jeremiah 1:5 says 'Before I formed you in the womb I knew you'. This means God has a purpose for every person before birth, so Catholics believe abortion destroys God's plan. Another belief is that abortion may sometimes be allowed. Some Christians point to Matthew 5:7, 'Blessed are the merciful'. This means showing compassion to a woman whose life is at risk or who has been raped, so abortion can be the lesser of two evils.","points":["Abortion wrong, life begins at conception (1), development (1), Jeremiah 1:5 / Psalm 139:13 / Exodus 20:13 (1), application (1).","Abortion may be allowed in some cases (1), compassion / mother's life / lesser of two evils (1), Matthew 5:7 (1), application (1).","Other creditable: Jewish teaching that the mother's life comes first; Catechism CCC 2270."]},{"topic":"tb-09","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about euthanasia. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that euthanasia is wrong because it breaks the sanctity of life. This means life is a gift from God and only God should decide when it ends. Exodus 20:13 says 'You shall not murder', which Christians and Jews use to oppose euthanasia. This means they support hospices and palliative care instead of ending life. Another belief, held by some Christians, is that euthanasia can be an act of compassion. Matthew 5:7 says 'Blessed are the merciful'. This means that, where a person is in unbearable pain and asks to die, helping them could be the most loving thing to do.","points":["Euthanasia wrong, sanctity of life (1), development (1), Exodus 20:13 or Ecclesiastes 3:2 (1), application such as hospices (1).","Euthanasia may be compassionate (1), development (1), Matthew 5:7 (1), application (1).","Other creditable: 1 Corinthians 6:19; Jewish teaching that active euthanasia is murder."]},{"topic":"tb-10","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about life after death. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that Christians will be raised to eternal life because Jesus rose from the dead. This means death is not the end, and believers will have life with God. In John 11:25-26 Jesus says 'I am the resurrection and the life'. This means Christians can face death with hope, and it encourages them to live in a way that follows him. Another belief is that God will judge everyone after death. Matthew 25:31-46 describes people being separated like sheep and goats. This means Christians believe their actions have consequences, so they try to help the poor and live a good life.","points":["Resurrection and eternal life (1), development (1), John 11:25-26 or 1 Corinthians 15 (1), application (1).","Judgement (1), development (1), Matthew 25:31-46 (1), application (1).","Other creditable: heaven (Revelation 21:4); Catholic purgatory; Jewish Olam Ha-Ba and resurrection."]}]},{"section":{"id":"theme-d","title":"Theme D: Religion, peace and conflict","short":"Theme D","paper":2,"religion":"Themes","blurb":"Violence, terrorism, reasons for war, just war, holy war, pacifism, nuclear weapons, peacemaking and how religious people respond to victims of war."},"topics":[{"id":"td-01","code":"War.1","title":"Introduction to religion, peace and conflict","overview":"The exam can ask you to define peace, justice, forgiveness and reconciliation, so you need exact meanings and a religious link for each.","notes":[{"h":"Key ideas","bullets":["**Conflict** is a serious disagreement between individuals, groups or nations. It can grow into **war**, which is armed conflict between states.","**Peace** is more than the absence of fighting. It means harmony, fairness and safety. In Judaism the word is **shalom**, which also means wholeness and well-being.","**Justice** means putting things right fairly. Many believers say real peace is impossible without justice.","**Forgiveness** means letting go of anger and blame. **Reconciliation** means rebuilding a broken relationship after a conflict."]},{"h":"Why religion cares","bullets":["Christians and Jews believe humans are made in God's image (Genesis 1:27), so every life is sacred. This is the **sanctity of life**.","Christians follow Jesus, called the Prince of Peace, who taught forgiveness and love of enemies.","Jews pray for shalom, and the prophets describe a future when nations stop training for war.","Religion has both encouraged peace and been used to justify war. The rest of this theme looks at both sides."]}],"views":[{"label":"Christian","text":"Christians see peace, justice, forgiveness and reconciliation as part of God's plan. Jesus said peacemakers will be called children of God, and he taught people to forgive again and again."},{"label":"Jewish","text":"Jews value shalom as a gift from God and a duty for people. Justice (tzedek) is a key moral principle, and forgiveness and repentance are central to Yom Kippur."},{"label":"Non-religious","text":"Humanists value peace because war harms human happiness. They do not need a command from God, and many support international law and talks to settle disputes."}],"terms":[{"term":"conflict","def":"a serious disagreement between individuals, groups or nations"},{"term":"peace","def":"harmony and the absence of war; in Judaism, shalom"},{"term":"justice","def":"bringing fairness back to a situation"},{"term":"forgiveness","def":"letting go of blame and anger towards someone who has wronged you"},{"term":"reconciliation","def":"making up and rebuilding a relationship after a conflict"},{"term":"sanctity of life","def":"the belief that life is holy because it is created by God"}],"sources":[{"text":"'Blessed are the peacemakers, for they will be called children of God.'","ref":"Matthew 5:9","use":"Use for any question on peace, peacemaking or why Christians avoid war."},{"text":"'Turn from evil and do good; seek peace and pursue it.'","ref":"Psalm 34:14","use":"A short Jewish and Christian source showing peace is something you must actively work for."},{"text":"'They will beat their swords into ploughshares... Nation will not take up sword against nation.'","ref":"Isaiah 2:4","use":"Use for the hope of a world without war, in Jewish and Christian answers."},{"text":"God made humans in his own image.","ref":"Genesis 1:27","use":"Use to explain the sanctity of life as a reason to avoid violence."}],"tip":"Definitions are often 1-mark questions. Give a clear definition and, if the question allows, a religious example in your 4 and 6-mark answers."},{"id":"td-02","code":"War.2","title":"Violence, violent protest and terrorism","overview":"AQA names violence as one of its three issues for Theme D, so you must be able to explain contrasting views about violence, protest and terrorism.","notes":[{"h":"Violence and protest","bullets":["**Violence** is behaviour that uses physical force to hurt, kill or damage. **Protest** is a public way of showing disagreement.","Peaceful protest is part of democracy. Examples are marches, petitions and vigils. Martin Luther King, a Baptist minister, led non-violent protest against racism in the USA.","Violent protest includes riots and damage to property. Some people say it is justified when peaceful methods are ignored, but most argue it makes things worse and harms innocent people."]},{"h":"Terrorism","bullets":["**Terrorism** is the use of violence and threats, usually against civilians, to spread fear and force a government or society to meet political demands.","Examples include the 7 July 2005 London bombings and the Manchester Arena attack in 2017.","Terrorists sometimes claim a religious cause, but the main religions condemn attacks on innocent people.","Christians and Jews reject terrorism because it breaks the commandment against murder, ignores the sanctity of life and cannot be fought with love of neighbour."]},{"h":"Religious views on violence","bullets":["Most Christians say violence should be a last resort. Jesus taught love of enemies and told Peter to put away his sword.","Some Christians accept limited force to protect the innocent, for example under just war thinking. Pacifists reject all violence.","Jews allow force in self-defence (Exodus 22:2) but value saving life (**pikuach nefesh**) above almost everything, so violence must not be used for revenge."]}],"views":[{"label":"Christian","text":"Christians stress love, forgiveness and peaceful protest. Many support non-violent protest against injustice. Most reject terrorism and violent protest, though a few say force can be the lesser evil against a cruel regime."},{"label":"Jewish","text":"Jews support peaceful protest for justice and reject terrorism because it targets the innocent. Violence is acceptable only to defend life, and even then the aim is to protect, not to punish."},{"label":"Non-religious","text":"Many non-religious people support the right to protest but say violence is wrong when it harms innocents. Some argue violent protest can be the lesser evil if peaceful protest is ignored."}],"terms":[{"term":"violence","def":"using physical force to hurt, kill or damage"},{"term":"protest","def":"a public statement or action showing disagreement"},{"term":"terrorism","def":"violence and threats against civilians to create fear and gain political aims"},{"term":"civil disobedience","def":"deliberately breaking a law peacefully as a protest"},{"term":"pikuach nefesh","def":"the Jewish duty to save life"}],"sources":[{"text":"'Love your enemies and pray for those who persecute you.'","ref":"Matthew 5:44","use":"Use to explain why Christians reject violent protest and terrorism."},{"text":"'Put your sword back in its place, for all who draw the sword will die by the sword.'","ref":"Matthew 26:52","use":"Use to show Jesus rejected violence even when he was arrested."},{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"Use for Jewish and Christian opposition to terrorism and killing the innocent."},{"text":"'Do not do anything that endangers your neighbour's life.'","ref":"Leviticus 19:16","use":"A Jewish source about protecting life, useful for views on terrorism."}],"tip":"Do not say all religious people reject all violence. Show the range: pacifists, just war supporters, and those who accept force only as a last resort."},{"id":"td-03","code":"War.3","title":"Reasons for war","overview":"AQA lists greed, self-defence and retaliation as reasons for war, and expects you to say how religious people judge each.","notes":[{"h":"Reasons for war","bullets":["**Greed**: going to war to gain land, oil, gold or power. Almost all religious people see this as unjust.","**Self-defence**: fighting to protect your country or others from attack. This is the most widely accepted reason.","**Retaliation**: hitting back after an attack. It is often condemned because it leads to a cycle of revenge.","Other causes include ideology, religion, and **civil war**, which is fighting between groups inside one country."]},{"h":"Religious views","bullets":["Christians condemn greed (the Bible warns against coveting) and retaliation (Jesus taught not to repay evil for evil). Self-defence can be accepted under just war ideas.","Jews accept defensive war because of pikuach nefesh. A war of choice needs strong justification and proper authority.","Both traditions say that the harm of war must be weighed carefully, because war kills innocent people and damages God's creation."]},{"h":"Non-religious views","bullets":["International law, such as Article 51 of the UN Charter, recognises self-defence as a right, but not aggression or revenge.","Humanists judge war by its consequences: does it reduce suffering overall?"]}],"views":[{"label":"Christian","text":"Self-defence may be a just reason if other options have failed. Greed and revenge are wrong because Jesus taught love of neighbour and forgiveness. Pacifist Christians reject even defensive war."},{"label":"Jewish","text":"Defending the community is a duty because saving life is vital. Greed and revenge are not valid reasons, and the Torah sets rules to limit harm even in war."},{"label":"Non-religious","text":"Many accept self-defence as a legitimate reason for war but see greed and retaliation as unjustifiable because they cause needless suffering."}],"terms":[{"term":"greed","def":"wanting more than you need, such as land or resources"},{"term":"self-defence","def":"protecting yourself or others from attack"},{"term":"retaliation","def":"hitting back at someone for harming you"},{"term":"civil war","def":"armed conflict between groups inside one country"},{"term":"war","def":"organised armed conflict between states or groups"}],"sources":[{"text":"'Do not repay anyone evil for evil.'","ref":"Romans 12:17","use":"Use to argue against retaliation as a reason for war."},{"text":"'You shall not covet... anything that belongs to your neighbour.'","ref":"Exodus 20:17","use":"Use to condemn greed as a cause of war."},{"text":"'Rescue the weak and needy; deliver them from the hand of the wicked.'","ref":"Psalm 82:4","use":"Use to support fighting in defence of others."},{"text":"'If anyone slaps you on the right cheek, turn to them the other cheek also.'","ref":"Matthew 5:39","use":"Use for the Christian argument against retaliation."}],"tip":"In a 4-mark question give two clear reasons, then say what a Christian or Jew would think of each. Do not just list greed, self-defence and retaliation."},{"id":"td-04","code":"War.4","title":"Nuclear weapons and weapons of mass destruction","overview":"Weapons of mass destruction is one of AQA's three key issues, so know the arguments about deterrence, just war and the sanctity of life.","notes":[{"h":"Facts","bullets":["**Weapons of mass destruction (WMD)** cause widespread, indiscriminate harm. They include nuclear, chemical and biological weapons.","Nuclear bombs were used in war only in August 1945, on Hiroshima and Nagasaki in Japan. Around 140,000 people died in Hiroshima by the end of that year.","**Nuclear deterrence** is the idea that having nuclear weapons stops other countries attacking because of the threat of devastating retaliation. The UK keeps its Trident system for this reason."]},{"h":"Arguments for keeping them","bullets":["Deterrence has helped to prevent a world war since 1945.","They protect the country and its allies, so some Christians and Jews see possession as a lesser evil."]},{"h":"Arguments against","bullets":["They kill civilians and cannot meet the just war rules of proportionality and discrimination (protecting non-combatants).","They damage God's creation and breach the sanctity of life.","They cost billions each year that could fund health, education or help for the poor.","Accidents, hacking or terrorists getting hold of them are real risks."]}],"views":[{"label":"Catholic","text":"Catholic teaching condemns using nuclear weapons. Pope Francis said in 2017 that even possessing them should be firmly condemned. Catholics support disarmament and Pax Christi works for it."},{"label":"Quaker","text":"Quakers are strongly opposed to all nuclear weapons and campaign for disarmament, linked to their Peace Testimony."},{"label":"Other Christian","text":"Some Christians, including some Anglicans, have accepted deterrence as the lesser evil, while stressing that actual use could not be justified."},{"label":"Jewish","text":"Most Jews say WMD cannot be justified because they destroy innocent life, though some argue that deterrence protects the Jewish people after the Holocaust."},{"label":"Non-religious","text":"Some support deterrence for security. Others argue the cost and danger outweigh any benefit and campaign for disarmament, for example through CND."}],"terms":[{"term":"nuclear weapon","def":"a weapon using a nuclear reaction to cause huge damage and loss of life"},{"term":"weapons of mass destruction","def":"weapons that cause widespread, indiscriminate damage, such as nuclear, chemical and biological weapons"},{"term":"nuclear deterrence","def":"having nuclear weapons to put off attackers"},{"term":"proportionality","def":"a just war rule that force used must not be excessive"},{"term":"disarmament","def":"reducing or getting rid of weapons"}],"sources":[{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"Use to argue that WMD, which kill huge numbers of innocents, break God's law."},{"text":"'They will beat their swords into ploughshares.'","ref":"Isaiah 2:4","use":"Use for the call for disarmament and a world without war."},{"text":"'Blessed are the peacemakers.'","ref":"Matthew 5:9","use":"Use for religious campaigns against nuclear weapons."},{"text":"'Love your neighbour as yourself.'","ref":"Matthew 22:39","use":"Use to argue WMD cannot fit with loving everyone, including civilians."}],"tip":"For 'similar beliefs' questions, pair WMD with just war ideas or the sanctity of life, then make a second, different point such as cost or campaigning."},{"id":"td-05","code":"War.5","title":"The just war theory","overview":"Just war theory is the main Christian way of deciding whether a war can be right. You need the criteria, who developed them, and how to evaluate them.","notes":[{"h":"Origins and criteria","bullets":["The **just war theory** is a set of rules for deciding when going to war is justified and how it should be fought.","St Augustine (4th to 5th century) was an early Christian thinker on this. St Thomas Aquinas (13th century) set out the criteria in more detail.","**Just cause**: for example self-defence or protecting the innocent. **Legitimate authority**: declared by a proper government or ruler, not by individuals.","**Right intention**: aim to restore peace and justice, not revenge or greed. **Last resort**: all peaceful options tried first.","**Reasonable chance of success**: no point causing deaths if the war cannot be won. **Proportionality**: no more force than needed.","**Discrimination**: civilians must not be targeted. AQA mark schemes list this as well, so learn it."]},{"h":"Using the theory","bullets":["Christians use the theory to judge wars such as the Second World War, the Falklands War, and wars involving modern weapons.","Weakness: people disagree about whether each rule has been met, and modern weapons make proportionality and discrimination hard.","Jewish teaching separates an obligatory war (milchemet mitzvah), such as defence, from an optional war (milchemet reshut), which needs strong authority. The Torah also limits harm to the enemy (Deuteronomy 20)."]}],"views":[{"label":"Catholic","text":"The Catholic Church teaches that force may be used only as a last resort in defence and with just war limits. Catholics must still work for peace."},{"label":"Other Christian","text":"Many Protestants, such as Anglicans, accept just war thinking as a realistic guide while hoping for peace."},{"label":"Pacifist Christian","text":"Quakers and others say no war can be just because it always kills and harms the innocent."},{"label":"Jewish","text":"Defensive war is a duty and may be required to save life. Optional wars need proper authority, and the Torah demands that peace is offered first (Deuteronomy 20:10)."},{"label":"Non-religious","text":"International law uses similar ideas, such as self-defence, proportionality and protecting civilians."}],"terms":[{"term":"just war","def":"a war that meets agreed rules for fairness, set out by Christian thinkers"},{"term":"just cause","def":"a good reason for war, such as defence"},{"term":"legitimate authority","def":"the right of a proper government or ruler to declare war"},{"term":"last resort","def":"trying all peaceful options before fighting"},{"term":"proportionality","def":"using only as much force as necessary"},{"term":"discrimination","def":"not deliberately attacking civilians"}],"sources":[{"text":"'There is a time for war and a time for peace.'","ref":"Ecclesiastes 3:8","use":"Use to show the Bible accepts that war can sometimes happen."},{"text":"'Rescue the weak and needy; deliver them from the hand of the wicked.'","ref":"Psalm 82:4","use":"Use for just cause: defending the innocent."},{"text":"'When you march up to attack a city, make its people an offer of peace.'","ref":"Deuteronomy 20:10","use":"Use for last resort in a Jewish answer."},{"text":"'Do not repay anyone evil for evil.'","ref":"Romans 12:17","use":"Use as a counter-argument that war should be avoided."}],"tip":"Name at least four criteria and apply them. A top answer says whether a war could meet them, not just lists them."},{"id":"td-06","code":"War.6","title":"Holy war and religion as a cause of war and violence","overview":"AQA asks about holy war and about religion and belief as a cause of war in the modern world. Be ready to explain both and to give a balanced view.","notes":[{"h":"Holy war","bullets":["A **holy war** is fought for a religious cause, believed to be supported by God and usually authorised by a religious leader.","A war is not holy just because soldiers are religious. The religion must be the reason for the war.","The **Crusades** were a series of Christian holy wars from 1095 onwards to take control of the Holy Land, called by Popes. Knights were promised forgiveness of sins.","In the Old Testament, wars such as the conquest of Canaan are described as commanded by God."]},{"h":"Modern views","bullets":["Many Christians today reject holy war. They say it breaks Jesus' call to love enemies and to seek peace.","Most Jews do not support holy war today. Jews accept war mainly for defence, not to spread the faith.","Some extremist groups claim holy war to justify terrorism, but religious leaders in the main faiths condemn this."]},{"h":"Religion as a cause of conflict","bullets":["Religion can be a cause when beliefs, holy places or religious freedom are threatened. Examples include the Troubles in Northern Ireland and conflict in Israel and Palestine.","Many conflicts mix religion with politics, land and identity, so it is hard to say religion is the only cause.","Religion also drives peacemaking, such as Corrymeela and Pax Christi.","Non-religious people often point out that religion has caused violence, while religious people point out that most believers reject violence."]}],"views":[{"label":"Christian","text":"Most Christians today reject holy war. They say the Crusades went against Jesus' teaching, though some say a war could be just if it protects people from attack, including religious freedom."},{"label":"Jewish","text":"Holy war is rare in modern Judaism. Defensive wars are accepted. Old Testament wars are read as belonging to a different time, and most Jews today focus on peace."},{"label":"Non-religious","text":"Some argue that religion often causes conflict by dividing people. Others argue that politics, land and power are the real causes and that religion is used as an excuse."}],"terms":[{"term":"holy war","def":"a war fought for a religious cause and believed to have God's approval"},{"term":"Crusades","def":"Christian holy wars from 1095 to reclaim the Holy Land"},{"term":"Holy Land","def":"Jerusalem and nearby areas, sacred to Jews, Christians and Muslims"},{"term":"extremism","def":"holding very strong views and being willing to use violence"},{"term":"religious freedom","def":"the right to practise your faith without being attacked"}],"sources":[{"text":"'Love your enemies and pray for those who persecute you.'","ref":"Matthew 5:44","use":"Use to argue holy war goes against Jesus' teaching."},{"text":"'The Lord is a warrior; the Lord is his name.'","ref":"Exodus 15:3","use":"Use to show that the Old Testament sometimes presents God as supporting war."},{"text":"'Blessed are the peacemakers.'","ref":"Matthew 5:9","use":"Use to show that religion also encourages peace."},{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"Use to argue that killing in the name of religion is wrong."}],"tip":"In a 12-mark answer, avoid saying 'religion causes all wars'. Use examples and show that religion is often one factor among others."},{"id":"td-07","code":"War.7","title":"Pacifism and peacemaking","overview":"Pacifism is one of AQA's three key issues. Also learn named examples of religious peacemaking, because questions ask about the work of individuals and groups.","notes":[{"h":"Pacifism","bullets":["**Pacifism** is the belief that war and violence are always wrong. Some pacifists will not fight at all, while others will serve as medics.","Christian pacifists point to Jesus' teaching in the Sermon on the Mount, his arrest without resistance, and the commandment not to murder.","The **Quakers** have a Peace Testimony: they refuse to fight and work for peace. Mennonites also hold pacifist beliefs.","Desmond Doss, a Seventh-day Adventist, refused to carry a weapon but served as a medic in the Second World War and saved many lives.","Arguments against pacifism: it may leave innocent people undefended, and some evil may only be stopped by force."]},{"h":"Peacemaking","bullets":["**Peacemaking** means working to end conflict and build reconciliation.","Martin Luther King used non-violent protest to campaign against racism. Archbishop Desmond Tutu led South Africa's Truth and Reconciliation Commission to bring forgiveness after apartheid.","**Corrymeela** is a Christian community in Northern Ireland, founded in 1965, which brings people from different sides together. **Pax Christi** is a Catholic peace movement.","Pope Francis speaks out for peace and has called for prayer and dialogue in conflict zones.","Jews work for peace through prayer for shalom, interfaith dialogue and by supporting justice."]}],"views":[{"label":"Quaker","text":"Quakers believe every person has some of God in them, so killing is wrong. They refuse to fight and work for peace and justice."},{"label":"Catholic","text":"The Catholic Church accepts just war but places huge emphasis on peace. Pax Christi works for peace and disarmament, and Pope Francis speaks for peace."},{"label":"Other Christian","text":"Many Christians say they should be peacemakers while accepting that force may sometimes be needed to stop greater evil."},{"label":"Jewish","text":"Jews value peace highly but Judaism is not pacifist. Defensive force is allowed, yet Jews are taught to pursue peace."},{"label":"Non-religious","text":"Some non-religious people are pacifists on moral grounds, while others accept fighting if it prevents greater harm."}],"terms":[{"term":"pacifism","def":"the belief that all war and violence is wrong"},{"term":"peacemaking","def":"working to bring peace and reconciliation"},{"term":"Peace Testimony","def":"the Quaker commitment to peace and refusing to fight"},{"term":"conscientious objector","def":"someone who refuses to fight because of their conscience"},{"term":"non-violent protest","def":"campaigning for change without using force"}],"sources":[{"text":"'Blessed are the peacemakers, for they will be called children of God.'","ref":"Matthew 5:9","use":"Use as the main Christian source for peacemaking and pacifism."},{"text":"'If anyone slaps you on the right cheek, turn to them the other cheek also.'","ref":"Matthew 5:39","use":"Use to explain Christian non-violence."},{"text":"'If it is possible, as far as it depends on you, live at peace with everyone.'","ref":"Romans 12:18","use":"Use to show that Christians should actively seek peace."},{"text":"'Nation will not take up sword against nation.'","ref":"Isaiah 2:4","use":"Use for the Jewish and Christian hope for a peaceful world."}],"tip":"For peacemaking, name an individual or group and say exactly what they did. 'Corrymeela brings Catholics and Protestants together' beats 'religions help peace'."},{"id":"td-08","code":"War.8","title":"Religious responses to the victims of war","overview":"AQA asks about religious responses to victims of war, including the work of one present-day religious organisation. Learn Christian Aid or Caritas in detail.","notes":[{"h":"Who the victims are","bullets":["Victims of war include people killed or injured, refugees forced to flee, families who lose homes, and child soldiers.","War also causes hunger, disease and trauma long after the fighting stops."]},{"h":"How believers respond","bullets":["Christians help because of Jesus' teaching to love your neighbour and care for the needy. The parable of the Good Samaritan and the Sheep and Goats are key sources.","**Christian Aid** was set up in 1945 by British and Irish churches to help refugees. Today it supports people affected by conflict, for example by providing food, water, shelter and help to rebuild lives.","**Caritas** is a worldwide Catholic network. In England and Wales, **CAFOD** is part of it. They offer emergency aid, support for refugees and help to rebuild communities.","Jews help through the duty of saving life (pikuach ne
