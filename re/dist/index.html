phet Elijah, who Jews believe will announce the Messiah. The door is opened for him."}],"quiz":[{"topic":"jp-01","q":"Which one of the following means 'house of study'?","options":["Bet Knesset","Bet Midrash","Bet Tefillah","Bet Din"],"answer":1,"why":"Bet Midrash means house of study. Bet Tefillah is house of prayer and Bet Knesset is house of assembly."},{"topic":"jp-01","q":"How many adults are needed for a minyan?","options":["Three","Seven","Thirteen","Ten"],"answer":3,"why":"A minyan is ten adults. Orthodox count only men, Reform count men and women."},{"topic":"jp-02","q":"Which one of the following is the ever-burning light in a synagogue?","options":["Ner Tamid","Bimah","Menorah","Havdalah"],"answer":0,"why":"The Ner Tamid hangs above the Ark and shows God is always present."},{"topic":"jp-02","q":"Where are the Torah scrolls kept in a synagogue?","options":["On the bimah","In the Aron Hakodesh","In the mezuzah","Beside the mechitzah"],"answer":1,"why":"The Torah scrolls are kept in the Aron Hakodesh (the Ark)."},{"topic":"jp-02","q":"A Jewish worshipper reads from the Torah at the raised platform. What is it called?","options":["Ark","Yad","Mechitzah","Bimah"],"answer":3,"why":"The bimah is the reading platform from which the Torah is read."},{"topic":"jp-03","q":"Which one of the following is true of Reform synagogues?","options":["Men and women sit apart","Services are in Hebrew only","Only men can be rabbis","Men and women can sit together"],"answer":3,"why":"In Reform synagogues men and women sit together, and women can be rabbis."},{"topic":"jp-03","q":"Which one of these is a feature of Orthodox worship?","options":["Women count in the minyan","Services held daily","An organ is used on Shabbat","Services are mostly in English"],"answer":1,"why":"Orthodox Jews hold services every day, while Reform services are mainly on Shabbat and festivals."},{"topic":"jp-04","q":"Which one of the following is the 'standing prayer'?","options":["Amidah","Shema","Kaddish","Aleinu"],"answer":0,"why":"The Amidah is said standing, facing Jerusalem."},{"topic":"jp-04","q":"What are tefillin?","options":["Prayer books","Candles","Leather boxes containing Torah verses","Prayer shawls"],"answer":2,"why":"Tefillin are small leather boxes with Torah verses worn on the arm and head in weekday morning prayer."},{"topic":"jp-04","q":"What does kavanah mean?","options":["A festival","A service","A prayer book","Concentration and intention in prayer"],"answer":3,"why":"Kavanah is sincere focus in prayer. Maimonides said prayer without devotion is not prayer."},{"topic":"jp-05","q":"On which day is the main Shabbat service held in the synagogue?","options":["Friday morning","Saturday morning","Sunday morning","Thursday evening"],"answer":1,"why":"The main service is on Saturday morning, with the Torah reading."},{"topic":"jp-05","q":"Which one of the following is the weekly Torah portion?","options":["Parashah","Siddur","Havdalah","Seder"],"answer":0,"why":"The parashah is the weekly portion, so the Torah is read in a year."},{"topic":"jp-06","q":"Which ceremony ends Shabbat?","options":["Kiddush","Havdalah","Tashlich","Seder"],"answer":1,"why":"Havdalah, with wine, a plaited candle and spices, separates Shabbat from the week."},{"topic":"jp-06","q":"How many categories of work are forbidden on Shabbat according to the rabbis?","options":["10","248","613","39"],"answer":3,"why":"The rabbis listed 39 melachot, such as cooking and writing."},{"topic":"jp-06","q":"Which one of these is placed on the table for the Friday night meal?","options":["Matzah and maror","Two challah loaves","A shofar","Bitter herbs"],"answer":1,"why":"Two challah loaves are blessed at the Shabbat meal, remembering the double portion of manna."},{"topic":"jp-07","q":"Which one of the following is the Oral Law?","options":["Torah","Nevi'im","Talmud","Ketuvim"],"answer":2,"why":"The Talmud (Mishnah and Gemara) is the Oral Law. The Tenakh is the Written Law."},{"topic":"jp-07","q":"What is placed on the doorposts of a Jewish home?","options":["Mezuzah","Tefillin","Tallit","Yad"],"answer":0,"why":"The mezuzah contains the Shema and fulfils Deuteronomy 6:9."},{"topic":"jp-07","q":"What is the Gemara?","options":["The Jewish Bible","The Five Books of Moses","A Jewish festival","The rabbis' commentary on the Mishnah"],"answer":3,"why":"The Gemara is later rabbinic discussion of the Mishnah. Together they form the Talmud."},{"topic":"jp-08","q":"Brit Milah takes place on which day after birth?","options":["First","Third","Eighth","Thirty-first"],"answer":2,"why":"Genesis 17:12 says a boy is circumcised at eight days old."},{"topic":"jp-08","q":"Who performs a circumcision?","options":["A mohel","A shochet","A cantor","A kohen"],"answer":0,"why":"A mohel is a trained person who performs Brit Milah."},{"topic":"jp-09","q":"At what age is a boy usually Bar Mitzvah?","options":["Twelve","Thirteen","Fifteen","Eighteen"],"answer":1,"why":"Pirkei Avot 5:21 says thirteen is the age for observing the commandments."},{"topic":"jp-09","q":"Which one of the following differs between Orthodox and Reform Bat Mitzvah?","options":["Girls age at 12 in both","Neither celebrates it","Only Orthodox girls have a party","Reform girls often read from the Torah, while many Orthodox do not in the main service"],"answer":3,"why":"Reform Bat Mitzvah mirrors the boys' ceremony, while many Orthodox communities mark it differently."},{"topic":"jp-10","q":"What does the chuppah represent?","options":["The Temple","The couple's future home","The Ark","A Torah scroll"],"answer":1,"why":"The chuppah is the canopy that symbolises the couple's home."},{"topic":"jp-10","q":"Why does the groom break a glass at a Jewish wedding?","options":["To scare away evil spirits","To show the marriage is legal","To remember the destruction of the Temple","To end the ceremony"],"answer":2,"why":"It recalls the destruction of the Temple and that joy is mixed with sadness."},{"topic":"jp-11","q":"What is shiva?","options":["Seven days of intense mourning","A year of mourning","A prayer for the dead","A gravestone ceremony"],"answer":0,"why":"Shiva means 'seven': the first seven days of mourning at home."},{"topic":"jp-11","q":"Which one of these is the yearly anniversary of a death?","options":["Sheloshim","Aninut","Yahrzeit","Keriah"],"answer":2,"why":"Yahrzeit is the anniversary of a death, marked with a candle and Kaddish."},{"topic":"jp-12","q":"Which one of the following is NOT kosher?","options":["Beef","Salmon","Chicken","Pork"],"answer":3,"why":"Pigs do not chew the cud, so pork is trefah. Salmon has fins and scales."},{"topic":"jp-12","q":"Which Torah verse is used as the basis for separating meat and milk?","options":["Genesis 1:1","Exodus 23:19","Exodus 20:8","Leviticus 23:24"],"answer":1,"why":"Exodus 23:19 says 'Do not boil a kid in its mother's milk'."},{"topic":"jp-13","q":"Which instrument is blown at Rosh Hashanah?","options":["Shofar","Harp","Trumpet","Organ"],"answer":0,"why":"The shofar (ram's horn) is a call to repent."},{"topic":"jp-13","q":"How long is the fast at Yom Kippur?","options":["12 hours","24 hours","25 hours","Seven days"],"answer":2,"why":"The fast is around 25 hours, from before sunset to after nightfall."},{"topic":"jp-14","q":"What do the bitter herbs (maror) on the Seder plate symbolise?","options":["Tears","Slavery's bitterness","The Temple","The lamb"],"answer":1,"why":"Maror represents the bitterness of slavery in Egypt."},{"topic":"jp-14","q":"Why do Jews eat matzah at Pesach?","options":["It is a Shabbat food","It is a sacrifice","It is the only kosher bread","The Israelites left Egypt in haste with no time for bread to rise"],"answer":3,"why":"Deuteronomy 16:3 says matzah is 'the bread of affliction' because the Israelites left in haste."}],"exam":[{"topic":"jp-03","marks":4,"type":"different","q":"Explain two different ways in which worship in Orthodox and Reform synagogues is different. (4 marks)","model":"One difference is the seating. In Orthodox synagogues men and women sit separately, often with women in a gallery or behind a mechitzah, so that they can focus on God. In Reform synagogues men and women sit together as equals.\n\nAnother difference is the language and music. Orthodox services are almost entirely in Hebrew with no instruments on Shabbat, whereas Reform services use Hebrew and English and often have an organ or choir.","points":["Seating: separate (Orthodox) versus together (Reform)","Language: Hebrew only versus Hebrew and English","Music: none on Shabbat versus organ or choir","Leadership: only men versus women can be rabbis and read Torah","Minyan: ten men versus ten adults","Frequency: daily versus mainly Shabbat and festivals","Each difference: 1 mark for the point and 1 mark for development"]},{"topic":"jp-06","marks":4,"type":"different","q":"Explain two different ways in which Jews celebrate Shabbat at home. (4 marks)","model":"One way is by lighting the Shabbat candles and sharing the Friday night meal. A woman lights two candles shortly before sunset, to welcome Shabbat, and the family then shares Kiddush and challah, which remembers God's creation and the manna.\n\nAnother way is by ending Shabbat with Havdalah on Saturday evening. The family uses a plaited candle, wine and spices, and the sweet smell of the spices shows the hope that the sweetness of Shabbat will carry into the week.","points":["Candles and Friday evening meal with Kiddush and challah","Havdalah: wine, spice box, plaited candle","Resting from work and avoiding the 39 melachot","Family time, prayer, study of the Torah","Orthodox strictness versus Reform flexibility","Each way: 1 mark for the point and 1 mark for development"]},{"topic":"jp-09","marks":4,"type":"different","q":"Explain two different ways in which Bar Mitzvah and Bat Mitzvah may be celebrated. (4 marks)","model":"One way is the Orthodox Bar Mitzvah at 13. The boy reads from the Torah in the synagogue, wears tallit and tefillin for the first time, and is now counted in a minyan, showing he is responsible for the mitzvot.\n\nAnother way is the Reform Bat Mitzvah. The girl, at 12 or 13, may read from the Torah and lead the service just like a boy, which shows equality, whereas many Orthodox girls have a celebration with a speech but do not read from the Torah in the main service.","points":["Bar Mitzvah at 13: Torah reading, tallit and tefillin, minyan, speech, party","Reform Bat Mitzvah mirrors boys' ceremony (age 12 or 13)","Orthodox Bat Chayil: usually a celebration at 12 without Torah reading in the main service","Different ages and different roles for girls","Each way: 1 mark for the point and 1 mark for development"]},{"topic":"jp-11","marks":4,"type":"different","q":"Explain two different ways in which Jews mourn the dead. (4 marks)","model":"One way is shiva, seven days of intense mourning at home after the funeral. Mourners sit on low stools, cover mirrors and do not work, which shows grief and allows the community to comfort them.\n\nAnother way is saying Kaddish and marking the yahrzeit. Children say the Kaddish prayer daily for a year after a parent dies, and light a candle on each anniversary, to praise God and remember the person.","points":["Burial within 24 hours, simple shroud and coffin, Chevra Kadisha","Tearing clothes (keriah) or wearing a black ribbon","Shiva: seven days, low stools, covered mirrors, no work, visits","Sheloshim and avelut (a year for a parent)","Kaddish and yahrzeit candle","Orthodox (burial only) versus Reform (some accept cremation)","Each way: 1 mark for the point and 1 mark for development"]},{"topic":"jp-12","marks":4,"type":"different","q":"Explain two different Jewish views about the importance of the dietary laws. (4 marks)","model":"One view is that held by many Orthodox Jews, who believe the dietary laws are commandments from God, so they must be kept strictly. They eat only kosher food and have separate dishes for meat and dairy, because the Torah says so.\n\nAnother view is that of many Reform Jews, who believe keeping kosher is a personal choice. Some keep only some of the rules, such as avoiding pork, while others focus on ethical mitzvot like charity, because they see the food laws as less important today.","points":["Orthodox: binding commands (Leviticus 11, Deuteronomy 14); strict observance, separate kitchens","Reform: personal choice and informed free will; some keep partly or not at all","Reasons for keeping: obedience, identity, discipline, holiness","Reasons for not keeping: modern life, priority of ethical mitzvot","Each view: 1 mark for the point and 1 mark for development"]},{"topic":"jp-13","marks":4,"type":"different","q":"Explain two different ways in which Jews celebrate Rosh Hashanah. (4 marks)","model":"One way is by blowing the shofar in the synagogue. The ram's horn is a wake-up call to repent, so Jews listen carefully to the sounds as they think about their actions in the past year.\n\nAnother way is by eating symbolic foods at home. Jews dip apples in honey to show the hope for a sweet new year, and eat round challah to show the cycle of the year.","points":["Shofar: call to repentance","Tashlich: casting away sins at water","Synagogue services and prayers of judgement; Ten Days of Awe","Apples and honey, round challah","Orthodox two days, Reform one day","Each way: 1 mark for the point and 1 mark for development"]},{"topic":"jp-01","marks":6,"type":"explain-two-source","q":"Explain two reasons why the synagogue is important for Jews. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One reason is that the synagogue is a place of prayer. Jews believe the Shekhinah is present when ten people pray together, and some prayers need a minyan. Psalm 84:5 says 'Happy are those who dwell in Your house; they will continually praise You', so Jews attend the synagogue to praise God together.\n\nAnother reason is that it is a place of study and community. The synagogue is a Bet Midrash where Jews study the Torah and Talmud, and a Bet Knesset where they gather for celebrations such as Bar Mitzvah. Pirkei Avot 3:6 says that when ten sit and study Torah, the Shekhinah is among them, so studying together in the synagogue brings Jews closer to God and each other.","points":["House of prayer (Bet Tefillah): communal worship, minyan, Shekhinah","House of study (Bet Midrash): Torah and Talmud study","House of assembly (Bet Knesset): community life, life-cycle events","Holds the Torah scrolls","Source: Psalm 84:5, Isaiah 56:7, Pirkei Avot 3:6","Marks: 1 point + 1 development + 1 source/application for each reason"]},{"topic":"jp-02","marks":6,"type":"explain-two-source","q":"Explain two features of a synagogue and why they are important. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One feature is the Aron Hakodesh, the Ark where the Torah scrolls are kept. It is the holiest place in the synagogue and represents the Ark of the Covenant, described in Exodus 25:10-22. This means Jews treat the Torah with great respect, for example standing when the Ark is opened.\n\nAnother feature is the Ner Tamid, the ever-burning light above the Ark. Leviticus 24:2 says to keep the lamps burning continually. It reminds Jews that God is always present and is a symbol of the menorah in the Temple.","points":["Aron Hakodesh: Torah scrolls, Ark of the Covenant (Exodus 25:10-22)","Ner Tamid: God's constant presence (Leviticus 24:2)","Bimah: Torah reading platform (Nehemiah 8:4)","Other features: menorah, Ten Commandments, mechitzah, yad","Marks: 1 point + 1 development + 1 source/application for each feature"]},{"topic":"jp-04","marks":6,"type":"explain-two-source","q":"Explain two reasons why prayer is important for Jews. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One reason is that prayer is a way of communicating with God and building a relationship. Jews pray three times a day, and Psalm 55:17 says 'Evening, morning and noon I cry out and He hears my voice'. This means prayer gives Jews comfort and strength and helps them feel close to God in daily life.\n\nAnother reason is that prayer expresses faith in God as One, through prayers such as the Shema and Amidah. Maimonides said 'prayer without devotion is not prayer', which shows prayer must come from the heart. This means Jews try to concentrate (kavanah) so that their prayers are sincere.","points":["Communication with God and closeness (Psalm 55:17)","Prayer is a mitzvah and part of the covenant","Shema and Amidah as central prayers","Kavanah: sincere intention (Maimonides, 1 Samuel 1:13)","Strength, comfort, reflection; group prayer with minyan","Marks: 1 point + 1 development + 1 source/application for each reason"]},{"topic":"jp-07","marks":6,"type":"explain-two-source","q":"Explain two ways in which the Talmud is important for Jews. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One way is that the Talmud explains how to keep the laws of the Torah. For example, the Torah says not to work on Shabbat, but the Talmud explains what counts as work. This means Jews can follow Torah laws correctly in daily life.\n\nAnother way is that the Talmud applies the law to new situations. Rabbi Dov Linzer said 'the Talmud is really about the conversation, and the conversation never ends'. This means Jews today use the Talmud's way of debate to deal with modern questions, which keeps Judaism relevant.","points":["Oral Law: Mishnah and Gemara; explains the Torah","Source of halakhah (Jewish law), such as the 39 melachot on Shabbat","Shows rabbis' debates and applies law to new situations","Orthodox: from Sinai; Reform: valued guidance","Source: Rabbi Linzer, Rabbi Steinsaltz, Pirkei Avot","Marks: 1 point + 1 development + 1 source/application for each way"]},{"topic":"jp-08","marks":6,"type":"explain-two-source","q":"Explain two reasons why Brit Milah is important for Jews. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One reason is that Brit Milah is the sign of the covenant with Abraham. In Genesis 17:10-11 God says 'Every male among you shall be circumcised... and it will be the sign of the covenant'. This means that Jewish parents circumcise their sons to show that the child is part of God's chosen people.\n\nAnother reason is that it is a commandment, performed on the eighth day. Genesis 17:12 says 'At eight days old every male shall be circumcised'. This means Jews carry it out even on Shabbat, as a mitzvah, and a celebration follows, to welcome the baby into the Jewish community.","points":["Sign of the covenant with Abraham (Genesis 17:10-11)","A commandment on the eighth day (Genesis 17:12), even on Shabbat","Welcomes the child into the community; naming","Mohel, sandek, Elijah's chair","Unity of Jews through history","Marks: 1 point + 1 development + 1 source/application for each reason"]},{"topic":"jp-10","marks":6,"type":"explain-two-source","q":"Explain two ways in which Jewish wedding customs show the importance of marriage. Refer to sacred writings or another source of Jewish belief and teaching in your answer. (6 marks)","model":"One way is the chuppah, the canopy under which the couple stand. It symbolises their future home together, and the Seven Blessings said beneath it thank God for creation, joy and love. This shows that marriage is seen as holy and a partnership with God.\n\nAnother way is the breaking of the glass. It reminds Jews of the destruction of the Temple in Jerusalem. This shows that even at a joyful time Jews remember sadness, so marriage must be strong enough to survive hard times. Genesis 2:24 says 'a man leaves his father and mother and clings to his wife', which shows that marriage is a union created by God.","points":["Chuppah as the couple's home; Seven Blessings thanking God","Ring: 'according to the law of Moses and Israel'","Ketubah: the husband's duties","Glass broken: remembering the Temple","Marriage fulfils Genesis 1:28 and Genesis 2:24","Marks: 1 point + 1 development + 1 source/application for each way"]},{"topic":"jp-01","marks":12,"type":"evaluate","q":"'Jews should always worship in the synagogue.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Some key prayers, such as the Kaddish, need a minyan of ten, and Jews believe the Shekhinah is present when people pray together (Pirkei Avot 3:6).","The synagogue holds the Torah scrolls and provides a holy, quiet place with the Ark and Ner Tamid, which helps Jews concentrate.","It is also a place of study and community, so worship there strengthens Jewish identity."],"against":["God is everywhere, so Jews can pray anywhere. Psalm 55:17 says to pray morning, noon and night, which is not always possible at the synagogue because of work or distance.","Private prayer is valued, as Hannah prayed silently from her heart (1 Samuel 1:13), and women in Orthodox Judaism are not required to attend daily services.","Worship in the home, such as Shabbat candles, blessings and the Seder, is also central to Judaism."],"conclusion":"Synagogue worship is very important, but the word 'always' is too strong, because Judaism also values prayer at home and God can be reached anywhere.","model":"There are good reasons why Jews should worship in the synagogue. Some prayers, such as the Kaddish, can only be said if there is a minyan of ten adults, and Jews believe the Shekhinah is present when people pray and study together (Pirkei Avot 3:6). The synagogue also contains the Torah scrolls in the Aron Hakodesh, and the Ner Tamid reminds worshippers that God is always present. This creates a holy atmosphere that helps Jews to focus on God. It is also where they study the Talmud and meet as a community, which keeps Jewish identity strong, especially for a minority. This is a strong argument, because the minyan shows that Judaism sees communal prayer as especially valuable.\n\nHowever, there are strong arguments against the idea that Jews should always worship there. Jews believe God is everywhere, so prayer can happen anywhere. Psalm 55:17 says to pray evening, morning and noon, but it is often not possible to get to a synagogue three times a day because of work or travel. Private prayer is also valued: in 1 Samuel 1:13, Hannah prayed silently in her heart and God answered. Many Reform Jews attend mainly on Shabbat and festivals, and women in Orthodox Judaism are not required to attend daily services. In addition, much of Jewish worship, such as lighting Shabbat candles, saying Kiddush and holding the Seder, takes place at home. This is also a strong argument, because it shows that Jewish worship is not limited to a building.\n\nIn conclusion, I believe that synagogue worship is very important, especially for communal prayer, but 'always' is too strong. Jewish teaching allows prayer anywhere, and home worship is central. The best answer is that Jews should worship in the synagogue when they can, particularly on Shabbat and festivals, but not only there."},{"topic":"jp-06","marks":12,"type":"evaluate","q":"'Keeping Shabbat is the most important way of practising Judaism.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Shabbat is one of the Ten Commandments (Exodus 20:8) and a sign of the covenant (Exodus 31:16-17), so it is a direct command from God.","It happens every week, shaping family life, prayer and rest, so it keeps Jews close to God and each other.","Shabbat remembers creation and the Exodus, and the rabbis said that if all Jews kept two Shabbats the Messiah would come."],"against":["Other practices are also commanded, such as keeping kosher food laws, praying daily and Brit Milah, which is the sign of the covenant with Abraham.","Some festivals, such as Yom Kippur, are called the holiest day of the year.","Reform Jews see ethical mitzvot like justice and charity as more important than ritual observance such as the rules of Shabbat."],"conclusion":"Shabbat is among the most important practices because it happens weekly and is in the Ten Commandments, but Jews hold different views on what matters most, so it is not clearly the single most important.","model":"There are strong reasons to say that keeping Shabbat is the most important way of practising Judaism. It is one of the Ten Commandments, where Exodus 20:8 says to 'remember the Sabbath day by keeping it holy', and Exodus 31:16-17 calls it a lasting sign of the covenant. It happens every week, and it shapes Jewish life through prayer in the synagogue, the Friday night meal, rest and family time. Shabbat remembers both creation and the Exodus, so it brings together key Jewish beliefs. Isaiah 58:13 calls it a delight, which shows it is a joy as well as a duty. This is a convincing argument, because few other practices are done so regularly and by so many Jews.\n\nHowever, there are also strong arguments against. Other practices are also commanded by God. Brit Milah is the sign of the covenant with Abraham and keeping kosher is an everyday commitment. Yom Kippur is often called the holiest day of the Jewish year, because it is the day of atonement when Jews seek forgiveness. Reform Jews might argue that ethical mitzvot, such as justice and charity, are more important than ritual practices, and many Reform Jews keep Shabbat less strictly. This is a strong argument because Jews hold differing views on which practices matter most.\n\nIn conclusion, I believe that Shabbat is one of the most important practices, as it is a commandment, is weekly and affects the whole family. However, I do not think it is clearly the most important, because Orthodox and Reform Jews rank the practices differently and the Torah gives many commands. A balanced judgement is that Shabbat is central, but no single practice can be said to be the most important for all Jews."},{"topic":"jp-12","marks":12,"type":"evaluate","q":"'Dietary laws are no longer important for Jews today.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Many Reform Jews see kashrut as a personal choice and focus instead on ethical mitzvot such as justice and charity (Micah 6:8).","Some argue the laws were for health and hygiene in ancient times, which modern food safety has replaced.","Keeping kosher is difficult in a non-Jewish society, with limited kosher food and cost, so many Jews keep only partly or not at all."],"against":["Orthodox Jews believe the laws are God's commandments (Leviticus 11, Deuteronomy 14), so they remain binding for all time.","Keeping kosher shows obedience, self-discipline and holiness, and reminds Jews of God at every meal.","It unites Jews around the world and strengthens Jewish identity, so many non-Orthodox Jews still keep some rules."],"conclusion":"The dietary laws are less important for some Reform Jews, but for Orthodox Jews and for many others they remain a key way to show obedience and identity, so the statement is too broad.","model":"Some Jews would agree that dietary laws are no longer important. Many Reform Jews see keeping kosher as a personal choice and believe that ethical mitzvot, such as those in Micah 6:8, 'do justice, love kindness and walk humbly', matter more than ritual rules. Some say the food laws were created for health in ancient times, which is no longer needed with modern food safety. Also, it can be hard and expensive to keep kosher in Britain, where kosher food is not always available, so some Jews keep only some of the rules, such as avoiding pork. This is a reasonable argument, as it explains why many Jews today do not keep all the rules.\n\nHowever, there are strong arguments against this statement. Orthodox Jews believe that the laws in Leviticus 11 and Deuteronomy 14 are commandments from God, given to Moses, and so they are binding for all time. Rules such as separating milk and meat (Exodus 23:19) are followed strictly in their homes with separate dishes and sometimes two kitchens. Keeping kosher shows obedience to God, helps develop self-discipline and reminds Jews of God at every meal. It also unites Jews across the world and helps them to keep their identity as a minority. Even many Reform Jews keep some rules for this reason. This is a convincing argument, because it shows that the laws still have deep meaning for many Jews.\n\nIn conclusion, I think the statement is not convincing as a general claim. The dietary laws are less important to some Reform Jews, but for Orthodox Jews and for many others they are a key part of obedience to God and Jewish identity. The statement would be more accurate if it said 'for some Jews'."},{"topic":"jp-13","marks":12,"type":"evaluate","q":"'Yom Kippur is the most important day in the Jewish year.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Yom Kippur is the Day of Atonement, the holiest day. Leviticus 16:29-30 says atonement will be made to cleanse Jews of sin.","It is the day God seals judgement for the year, so Jews fast, repent and ask forgiveness. Many Jews who do not keep other practices fast and attend synagogue.","It strengthens the relationship with God and with other people through reconciliation, which affects how Jews live afterwards."],"against":["Shabbat happens weekly and is one of the Ten Commandments, so it shapes Jewish life more often.","Pesach is celebrated by the most Jewish families and tells the story of how God freed the Jews, which is the foundation of Jewish identity.","Rosh Hashanah begins the Ten Days of Awe and is the day of judgement, so it is the start of the process that Yom Kippur completes."],"conclusion":"Yom Kippur is the holiest day and can claim to be the most important, but because Shabbat and Pesach are also central to the covenant and Jewish identity, no single day is clearly the most important for all Jews.","model":"There is a strong case that Yom Kippur is the most important day in the Jewish year. It is called the Day of Atonement and is the holiest day. Leviticus 16:29-30 says that on this day atonement is made to cleanse Jews of their sins. Jews believe that God seals His judgement for the year, so they fast for 25 hours, spend the day in the synagogue and confess their sins. Many Jews who do not keep other practices still fast on Yom Kippur. It is a chance to be reconciled with God, which Jews believe affects their lives and their future. This is a convincing argument, as the day deals with the most important question for believers: how to be forgiven.\n\nHowever, there are strong arguments against. Shabbat happens every week and is one of the Ten Commandments, so for many Jews it shapes life more often than Yom Kippur. Pesach is celebrated by many Jewish families around the Seder table and remembers the Exodus, when God freed the Israelites, which is the foundation of Jewish identity and the covenant. Rosh Hashanah is also the day of judgement and starts the Ten Days of Awe, so Yom Kippur only completes the process that begins there. This is also a strong argument, because it shows Jewish festivals are connected and each is important.\n\nIn conclusion, I think Yom Kippur has a good claim to be the most important day because of its holiness and focus on forgiveness. However, the statement is too strong, as Shabbat and Pesach are also at the heart of the covenant and Jewish identity, and different Jews give different answers. The best judgement is that Yom Kippur is the most solemn and spiritually significant day, but not the only most important one."},{"topic":"jp-09","marks":12,"type":"evaluate","q":"'Bat Mitzvah should be celebrated in exactly the same way as Bar Mitzvah.' Evaluate this statement. In your answer you should: refer to Jewish teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. (12 marks)","for":["Reform Jews believe men and women are equal before God, so girls should read from the Torah and lead the service just as boys do. Rabbi Weinberg said Bat Mitzvah gives girls full equality.","Girls become responsible for the mitzvot as boys do, so they should have the same recognition and public ceremony.","Equal ceremonies show that girls' Jewish education and contribution are valued by the community."],"against":["Orthodox Jews believe men and women have different religious roles, so women are not called to read the Torah in the main service. Some Orthodox rabbis see a formal Bat Mitzvah as unnecessary, as girls already take on the mitzvot at 12 and are not counted in a minyan.","Girls usually celebrate at 12 and boys at 13, so the ceremonies are not exactly the same by tradition.","Boys wear tallit and tefillin and join the minyan, which girls do not do in Orthodox practice."],"conclusion":"For Reform Jews equality means the ceremonies should be the same, but for Orthodox Jews tradition gives different roles, so the answer depends on the tradition, though equal recognition is persuasive in modern society.","model":"Many Reform Jews would agree with this statement. They believe men and women are equal before God, so girls should have the same ceremony as boys, including reading from the Torah and leading parts of the service. Rabbi Weinberg argued that girls now have equality in everything, so a Bat Mitzvah gives girls full equality. Girls take on responsibility for the mitzvot as boys do, so they should receive the same recognition. In many Reform synagogues the ceremonies are indeed identical, with a Torah reading, a speech and a celebration. This is a strong argument, because it matches modern values and recognises the girl's religious maturity.\n\nHowever, Orthodox Jews would disagree. They believe men and women have different religious roles, so women are not called to read from the Torah in the main service or count in a minyan. In the past, Bat Mitzvah did not exist, because girls were thought to learn their faith at home, and some Orthodox rabbis still consider it unnecessary. Also, girls traditionally celebrate at 12 and boys at 13, and only boys wear tefillin and a tallit for the first time. Many Orthodox communities hold a Bat Chayil celebration, with a speech and a meal, that honours the girl in a different way. This is a strong argument because it follows long-standing tradition and sees difference as respect rather than inequality.\n\nIn conclusion, the answer depends on the tradition. For Reform Jews, equality is a fundamental belief, so the ceremonies should be the same. For Orthodox Jews, the ceremonies are different because roles are different. I think the argument for equal recognition is more persuasive in modern society, but the strongest answer recognises that both approaches reflect sincere beliefs about how to follow God's law."}]},{"section":{"id":"theme-a","title":"Theme A: Relationships and families","short":"Theme A","paper":2,"religion":"Themes","blurb":"Sex and sexuality, contraception, marriage, divorce, families and gender equality, from Christian, Jewish and non-religious points of view."},"topics":[{"id":"ta-01","code":"Rel & Fam.1 and 2","title":"Human sexuality and sexual relationships before and outside marriage","overview":"Christians and Jews teach that sex is a gift from God, but they disagree about who it is for and when it is right. This topic is the basis for questions on sex before marriage, adultery and homosexual relationships.","notes":[{"h":"Human sexuality","bullets":["**Human sexuality** means how people express themselves as sexual beings. **Heterosexual** means attracted to the opposite gender. **Homosexual** means attracted to the same gender.","Christians see sex as a gift from God with two purposes: expressing love and bringing a couple closer, and having children (procreation). Genesis 1:28 says 'be fruitful and increase in number'.","Jews also see sex as natural and good, not just for making children. Marriage, closeness and pleasure are seen as blessings from God, and celibacy is not normally encouraged."]},{"h":"Homosexual relationships","bullets":["In UK law, homosexual relationships are legal and sexual orientation is protected by the Equality Act 2010. Same-sex couples can marry in England and Wales (since 2014).","Traditional Christians (for example Roman Catholics) teach that being gay is not a sin, but homosexual sex is wrong because it cannot lead to children and is against God's design. They quote Leviticus 18:22.","Other Christians (for example Quakers and many liberal Anglicans) teach that a loving, faithful same-sex relationship is as valid as any other, because God made everyone and Jesus taught love of neighbour.","Orthodox Jews do not accept homosexual acts or same-sex marriage (Leviticus 18:22, and the duty to have children). Reform and Liberal Jews accept same-sex relationships and some hold same-sex weddings."]},{"h":"Sex before marriage","bullets":["Traditional Christians (Catholic, many Evangelicals) teach that sex belongs only within marriage, because it joins two people for life. They use 1 Corinthians 6:18 and the Catechism. Some Christians accept sex in a loving, committed relationship such as an engagement, and the Archbishop of York (2011) said living together first can help a couple find out if they are suited.","Orthodox Jews teach that sex belongs within marriage. Reform Jews are more flexible if the couple are committed, responsible and protect each other from harm.","Many non-religious people see sex before marriage as normal if both people consent and take care over protection. The age of consent in the UK is 16."]},{"h":"Sex outside marriage (adultery)","bullets":["**Adultery** is sex between two people where at least one is married to someone else. It is not a crime in the UK, but it is a common reason for divorce.","Christians and Jews teach it is a serious sin: it breaks the Ten Commandments (Exodus 20:14), breaks wedding promises, destroys trust and hurts children. Jesus taught that even lustful thoughts are a problem (Matthew 5:27-28), but he also forgave a woman caught in adultery (John 8)."]}],"views":[{"label":"Roman Catholic","text":"Sex is only right within marriage and must be open to children. Homosexual acts are wrong, but gay people must be treated with respect and compassion. Sex before marriage and adultery are both wrong."},{"label":"Church of England and many Protestants","text":"Sex is best within marriage. The Church of England teaches that gay people are valued equally by God and should never be hated, but its teaching is that marriage is between one man and one woman. Many Anglicans are more accepting of couples who are committed but unmarried."},{"label":"Quaker and liberal Christian","text":"What matters is genuine love, commitment and care in a relationship, not the gender of the couple or whether they are married."},{"label":"Orthodox Jewish","text":"Sex belongs within marriage. Homosexual acts and adultery are forbidden. Being gay is not itself condemned and people should be respected."},{"label":"Reform and Liberal Jewish","text":"More accepting of committed relationships outside marriage and of same-sex relationships. Adultery is still seen as wrong because it breaks trust."},{"label":"Non-religious (for example humanist)","text":"Sexual relationships are fine between consenting adults if nobody is harmed. Many see adultery as wrong because of the lies and hurt involved."}],"terms":[{"term":"human sexuality","def":"how people express themselves as sexual beings"},{"term":"heterosexual","def":"being attracted to people of the opposite gender"},{"term":"homosexual","def":"being attracted to people of the same gender"},{"term":"adultery","def":"sex between two people where at least one is married to someone else"},{"term":"celibate","def":"choosing not to have sex"},{"term":"cohabitation","def":"a couple living together without being married or in a civil partnership"}],"sources":[{"text":"'Be fruitful and increase in number; fill the earth.'","ref":"Genesis 1:28","use":"Shows sex is meant to lead to children. Use it for the view that same-sex sex or contraception goes against God's purpose."},{"text":"'Flee from sexual immorality.'","ref":"1 Corinthians 6:18","use":"Use it to show why many Christians say sex before marriage is wrong."},{"text":"'You shall not commit adultery.'","ref":"Exodus 20:14","use":"The Ten Commandments. Use for adultery and for Christian and Jewish agreement that it is wrong."},{"text":"'Do not have sexual relations with a man as one does with a woman; that is detestable.'","ref":"Leviticus 18:22","use":"Used by Orthodox Jews and traditional Christians against homosexual acts. Explain how some religious people interpret it differently today."},{"text":"'Let any one of you who is without sin be the first to throw a stone at her.'","ref":"John 8:7","use":"Jesus showing forgiveness to a woman caught in adultery. Use it for compassion and not judging others."}],"tip":"For 'different views' questions on sex, split Christianity (for example Catholic versus Quaker), not just 'Christian versus Jewish'. Always end a point with the reason behind the belief."},{"id":"ta-02","code":"Rel & Fam.3","title":"Contraception and family planning","overview":"Contraception is one of the three issues AQA says you must be able to give contrasting views on. Christians and Jews disagree on whether it is right to separate sex from having children.","notes":[{"h":"What it is","bullets":["**Contraception** means precautions to prevent pregnancy (and to protect against sexually transmitted infections). Examples: condoms, the pill, the coil, injections, sterilisation.","**Family planning** means choosing when to have children and how many. It includes artificial methods and natural methods such as tracking the fertile times of the month (the rhythm method).","In the UK contraception is legal and widely used. Many people say it prevents unwanted pregnancies, controls population growth and protects against infection."]},{"h":"Christian views","bullets":["The Roman Catholic Church teaches that every sexual act must be open to new life, so artificial contraception is wrong (Pope Paul VI, Humanae Vitae, 1968). Natural family planning is allowed for good reasons.","Most Protestant churches, including the Church of England, accept contraception because it allows responsible parenthood. They say couples must think about health, money and the needs of children already born.","Some Christians worry the morning-after pill or the coil might end a fertilised egg, which they see as abortion. This links to the commandment 'You shall not murder'."]},{"h":"Jewish and non-religious views","bullets":["Jews value large families and see 'be fruitful and multiply' as a duty, but marriage is also about love and companionship. Orthodox Jews usually allow contraception only for good reasons, such as the mother's health. The pill is preferred to methods that damage the body or block the act.","Reform Jews allow contraception more freely, including for the welfare or finances of the family.","Non-religious people mostly support contraception as a way to plan families, avoid unwanted pregnancy and prevent STIs. A few believe it encourages casual sex."]}],"views":[{"label":"Roman Catholic","text":"Only natural family planning is acceptable. Artificial contraception separates sex from creating life, which Catholics believe goes against natural law and God's purpose for marriage."},{"label":"Church of England and most Protestants","text":"Contraception is acceptable within marriage, as sex is also about love and 'there can be good reasons for delaying or limiting parenthood'. Couples should decide responsibly."},{"label":"Orthodox Jewish","text":"Having children is a duty and a blessing. Contraception is allowed in limited cases such as risk to the mother, and some methods are preferred over others."},{"label":"Reform Jewish","text":"Couples have free will and may use contraception for family welfare, finances or health."},{"label":"Non-religious","text":"Contraception is a responsible choice that prevents unwanted pregnancy and disease, and gives people control of their lives."}],"terms":[{"term":"contraception","def":"precautions taken to prevent pregnancy and protect against STIs"},{"term":"family planning","def":"planning when to have children and how many, using contraception or natural methods"},{"term":"procreation","def":"having children, seen as a duty in many religions"},{"term":"natural family planning","def":"avoiding pregnancy by having sex only at infertile times of the month"},{"term":"artificial contraception","def":"methods such as condoms or the pill that prevent pregnancy"},{"term":"sterilisation","def":"a medical operation that permanently stops someone being able to have children"}],"sources":[{"text":"'Be fruitful and increase in number.'","ref":"Genesis 1:28","use":"Use it for Catholic and Orthodox Jewish views that having children is God's purpose for sex."},{"text":"'Children are a heritage from the Lord, offspring a reward from him.'","ref":"Psalm 127:3","use":"Shows children are a blessing, so some believers want large families."},{"text":"Catechism of the Catholic Church: every act of sex must remain open to the transmission of life.","ref":"Catechism of the Catholic Church (CCC 2366)","use":"The key Catholic source for rejecting artificial contraception."},{"text":"'Anyone who does not provide for their relatives... has denied the faith.'","ref":"1 Timothy 5:8","use":"Use for Protestants who say planning family size is part of caring responsibly for the children you have."}],"tip":"Never write 'Christians are against contraception'. Name the Catholic Church for the 'no' view and the Church of England or Protestants for the 'yes' view."},{"id":"ta-03","code":"Rel & Fam.4","title":"Religious teachings about marriage","overview":"Marriage is the starting point for Christian and Jewish views on sex, family and divorce. You need its nature, purposes, same-sex marriage and cohabitation.","notes":[{"h":"Nature and purpose of marriage","bullets":["**Marriage** is the legal and religious union of two people. For Christians it is a gift from God at creation: 'a man leaves his father and mother and is united to his wife, and they become one flesh' (Genesis 2:24).","Christian purposes of marriage: love and companionship, a safe place for sex, having children and bringing them up in the faith, and a stable base for family life. Catholics call marriage a **sacrament**: a lifelong union blessed by God.","Wedding **vows** are promises made before God and the community, such as 'till death us do part'. This phrase is from the wedding service, not the Bible.","Jews see marriage as a duty and the foundation of family life. It is a covenant (agreement) between two people and with God, ideally under a chuppah (wedding canopy). Marriage avoids loneliness and sexual sin (Genesis 2:18)."]},{"h":"Same-sex marriage","bullets":["Civil partnerships began in 2004. Same-sex marriage became legal in England and Wales in 2014. Religious groups cannot be forced to hold same-sex weddings.","The Roman Catholic and Orthodox Jewish authorities, and the Church of England, teach that marriage is between one man and one woman. Quakers, the United Reformed Church, the Methodist Church and Liberal Judaism allow same-sex marriages, based on the principle that love and commitment matter most."]},{"h":"Cohabitation","bullets":["**Cohabitation** means living together as a couple without being married. It is very common in the UK today, and many couples do it as a trial run before marriage.","Catholics and Orthodox Jews oppose it because sex should only happen in marriage. Many Protestants accept it but say marriage is the ideal. The Salvation Army says cohabiting 'falls short of God's ideal will'."]}],"views":[{"label":"Roman Catholic","text":"Marriage is a sacrament and lifelong. Its purposes are the loving union of husband and wife and the raising of children. It is between a man and a woman."},{"label":"Church of England and Protestant","text":"Marriage is a gift from God and a lifelong commitment. Many accept cohabitation as a step towards marriage. The Church of England does not conduct same-sex marriages but welcomes gay people."},{"label":"Quaker and liberal Christian","text":"Marriage is about love and commitment before God, whatever the gender of the couple. Quakers hold same-sex weddings."},{"label":"Orthodox Jewish","text":"Marriage is a religious duty between a man and woman, for companionship and children. Same-sex marriage and cohabitation are not accepted."},{"label":"Reform and Liberal Jewish","text":"Marriage is a sacred partnership. Liberal Judaism holds same-sex weddings, and cohabitation is more widely accepted."}],"terms":[{"term":"marriage","def":"a legal and religious union of two people"},{"term":"vows","def":"promises made during a marriage ceremony"},{"term":"sacrament","def":"in Catholic belief, a ceremony that gives God's grace; marriage is one of seven"},{"term":"civil partnership","def":"a legal union giving a couple the same rights as marriage, first available to same-sex couples in 2004"},{"term":"cohabitation","def":"living together as a couple without being married"},{"term":"chuppah","def":"the canopy a Jewish couple stand under to marry"}],"sources":[{"text":"'A man leaves his father and mother and is united to his wife, and they become one flesh.'","ref":"Genesis 2:24","use":"Shows marriage is part of God's plan from creation and joins two people closely."},{"text":"'What God has joined together, let no one separate.'","ref":"Matthew 19:6","use":"Use for lifelong marriage and Catholic teaching that marriage cannot be broken."},{"text":"'Marriage should be honoured by all.'","ref":"Hebrews 13:4","use":"Shows marriage is valued, and links to faithfulness within marriage."},{"text":"'It is not good for the man to be alone.'","ref":"Genesis 2:18","use":"Jewish and Christian reason for marriage: companionship."}],"tip":"For 'purpose of marriage' questions give three clear purposes: companionship, having children, and a stable base for sex and family life."},{"id":"ta-04","code":"Rel & Fam.5","title":"Divorce and remarriage","overview":"Religions teach that marriage should last, but they differ on whether divorce and remarriage can ever be right. Expect questions on the Catholic versus Protestant view, and compassion versus vows.","notes":[{"h":"Divorce in the UK","bullets":["**Divorce** is the legal ending of a marriage. A couple must be married one year before applying. Since 2022 couples in England and Wales can divorce without blaming each other, by stating the marriage has broken down.","Common reasons: adultery, growing apart, money or work pressures, addiction, abuse and violence, lack of communication, and illness."]},{"h":"Christian views","bullets":["Catholics teach marriage is a lifelong sacrament, so divorce is not recognised by the Church. They quote Jesus: 'what God has joined together, let no one separate' (Matthew 19:6). An **annulment** says the marriage was never valid in the first place (for example, a forced marriage).","Other Christians (Church of England, Methodist, United Reformed) accept divorce as a last resort. Jesus allowed it for adultery (Matthew 19:9). They say it may be the lesser of two evils, for example where there is abuse, and God forgives.","Churches try to support couples with counselling, prayer and care, and show compassion to people who are divorced. Some Christians say divorce breaks vows made before God, which is a reason to avoid it."]},{"h":"Remarriage","bullets":["**Remarriage** is marrying again after divorce. Catholics do not allow it unless the first marriage was annulled. Jesus said remarriage after divorce is adultery (Luke 16:18).","The Church of England may marry divorced people in church at the priest's discretion. Many Protestants allow it, saying God forgives and everyone deserves a second chance."]},{"h":"Jewish views","bullets":["Judaism sees divorce as sad but allowed (Deuteronomy 24:1). A husband gives his wife a **get** (document of divorce) through a Jewish court. Reform Judaism also requires a get, but Liberal Judaism accepts civil divorce alone.","Jews can remarry after divorce, although an Orthodox couple cannot remarry each other if the woman has married someone else in between."]}],"views":[{"label":"Roman Catholic","text":"Marriage is a lifelong sacrament, so divorce is not accepted and remarriage in church is only possible after an annulment. Divorced Catholics are still welcome in the Church."},{"label":"Church of England","text":"Marriage is meant for life, but divorce is accepted as a sad last resort. Divorced people may remarry in church at the priest's discretion."},{"label":"Methodist and other Protestants","text":"Divorce is accepted where a marriage has broken down, with compassion for those involved. Remarriage in church is generally allowed."},{"label":"Orthodox Jewish","text":"Divorce is permitted but sad. A get is needed, and the couple must try reconciliation first."},{"label":"Reform and Liberal Jewish","text":"Divorce is allowed where love has died. Liberal Jews accept a civil divorce without a get."},{"label":"Non-religious","text":"Divorce is a personal choice. It can be better for adults and children than staying in an unhappy or violent marriage."}],"terms":[{"term":"divorce","def":"the legal ending of a marriage"},{"term":"remarriage","def":"marrying again after a divorce"},{"term":"annulment","def":"a Catholic declaration that a marriage was never truly valid"},{"term":"get","def":"a Jewish document of divorce"},{"term":"vows","def":"promises made in a wedding ceremony"},{"term":"compassion","def":"sympathy and concern for the suffering of others"}],"sources":[{"text":"'Anyone who divorces his wife, except for sexual immorality, and marries another woman commits adultery.'","ref":"Matthew 19:9","use":"Used by Protestants to show Jesus allowed divorce for adultery, and by Catholics to show remarriage is wrong."},{"text":"'What God has joined together, let no one separate.'","ref":"Matthew 19:6","use":"Use for Catholic belief that marriage is permanent."},{"text":"'Anyone who divorces his wife and marries another woman commits adultery.'","ref":"Luke 16:18","use":"Use for the view that remarriage is wrong."},{"text":"'I hate divorce,' says the Lord.","ref":"Malachi 2:16","use":"Shows divorce is seen as sad and harmful. Mention that Jewish and Christian teachers still accept it in hard cases."},{"text":"'Moses permitted you to divorce your wives because your hearts were hard.'","ref":"Matthew 19:8","use":"Use for the idea that divorce is allowed as a concession, not God's ideal."}],"tip":"For a 12 marker on divorce, use: sanctity of vows and Catholic teaching (for), against: compassion, lesser of two evils and Jesus forgiving. Evaluate by saying which view is stronger and why."},{"id":"ta-05","code":"Rel & Fam.6 and 7","title":"The nature and purpose of the family","overview":"Families are the main building block of society for Christians and Jews. You need the different types of family, the roles of parents and children, the purposes of family, and contemporary issues such as same-sex parents and polygamy.","notes":[{"h":"Nature of families","bullets":["A **nuclear family** is two parents and their children. An **extended family** also includes grandparents, aunts, uncles and cousins. Other types include single-parent families, stepfamilies and same-sex parent families.","In biblical times extended families were normal, and they cared for old and young and passed on faith. Today many UK families are small, and some children grow up with one parent or in a stepfamily.","**Polygamy** (having more than one spouse) appears in the Old Testament, but Christians today teach one husband and one wife. Bigamy (marrying while already married) is illegal in the UK. Christians say the ideal family is a married mother and father; others say love is what matters."]},{"h":"Roles of parents and children","bullets":["Christian parents should love and care for children, teach right from wrong and bring them up in the faith: 'bring them up in the training and instruction of the Lord' (Ephesians 6:4). Many baptise their children, take them to church and choose faith schools.","Children should respect and obey their parents: 'Honour your father and your mother' (Exodus 20:12), and care for them in old age.","Jewish parents teach the Torah and Jewish customs, including Shabbat and festivals, and raise children as Jews (Deuteronomy 6:7). Children must honour their parents, which includes caring for elderly parents."]},{"h":"Purposes of family","bullets":["**Procreation**: having children is part of God's plan. Parents should have children within a loving marriage ('be fruitful and increase in number').","**Stability and protection**: a family gives children a safe, loving home and teaches them how to behave and fit into society.","**Educating children in the faith**: passing on beliefs and values to the next generation. Christians see families as a reflection of God as Father, and Jesus said to make disciples (Matthew 28:19).","Contemporary issues: Orthodox Jews and Catholics teach that children need a mother and father, so oppose same-sex parenting. Other Christians and Jews say the quality of love and care matters more than the parents' gender."]}],"views":[{"label":"Roman Catholic","text":"The family is built on marriage between a man and a woman. Its purposes include having children and raising them in the faith. Same-sex parenting is not the Church's ideal."},{"label":"Church of England and Protestants","text":"Families are a gift from God and a place to learn love and faith. Many accept different family forms if children are loved and cared for."},{"label":"Orthodox Jewish","text":"The family is God's plan and the centre of Jewish life. Parents have traditional roles. Children need both a mother and a father."},{"label":"Reform and Liberal Jewish","text":"Roles in the family are shared. Different family types, including same-sex parents, are accepted if children are loved."},{"label":"Non-religious","text":"Families come in many forms, and what matters is love, stability and safety for children. Many see polygamy as unequal."}],"terms":[{"term":"nuclear family","def":"two parents and their children"},{"term":"extended family","def":"parents, children and other relatives such as grandparents and cousins"},{"term":"polygamy","def":"having more than one husband or wife at the same time"},{"term":"procreation","def":"having children"},{"term":"stepfamily","def":"a family formed when a parent with children marries or partners again"},{"term":"bigamy","def":"marrying someone while still legally married to someone else, illegal in the UK"}],"sources":[{"text":"'Fathers, do not exasperate your children; instead, bring them up in the training and instruction of the Lord.'","ref":"Ephesians 6:4","use":"Use for the role of parents in a Christian family: loving discipline and faith teaching."},{"text":"'Honour your father and your mother.'","ref":"Exodus 20:12","use":"Use for the role of children, and for caring for elderly relatives. Both Christians and Jews follow it."},{"text":"'Impress them on your children. Talk about them when you sit at home.'","ref":"Deuteronomy 6:7","use":"Jewish duty to teach children the faith (the Shema)."},{"text":"'Go and make disciples of all nations.'","ref":"Matthew 28:19","use":"Use for educating children in the faith: family is the first place faith is passed on."},{"text":"'Children are a heritage from the Lord.'","ref":"Psalm 127:3","use":"Shows children are a blessing, so having a family is a purpose of marriage."}],"tip":"For 'role of parents' questions in a 6 marker, link every point to a source: for example Ephesians 6:4 for teaching the faith, then apply it ('so Christian parents baptise their children and take them to church')."},{"id":"ta-06","code":"Rel & Fam.8","title":"Christian beliefs about gender equality and the roles of men and women","overview":"This topic asks whether men and women are equal, and whether they should have different roles. Christians and Jews give different answers, and there are differences within each religion.","notes":[{"h":"Gender equality in the UK","bullets":["**Gender equality** is the belief that all genders have equal status and value. UK law backs this up: the Equal Pay Act 1970, Sex Discrimination Act 1975 and Equality Act 2010 make unfair treatment because of sex illegal.","Men and women's traditional roles used to be very different, with men as breadwinners and women at home. Today both usually work and share childcare, although some people still hold traditional views."]},{"h":"Christian teaching on equality","bullets":["All humans are made in God's image, 'male and female he created them' (Genesis 1:27), so are equal in value. Paul wrote 'there is no male and female, for you are all one in Christ Jesus' (Galatians 3:28).","Jesus treated women with respect. He taught women, such as Mary and Martha, and first appeared to women after the resurrection.","Many Christians support equality and women in leadership. The Church of England has had women priests since 1994 and women bishops since 2015. Some Christians, including Roman Catholics and Orthodox churches, only allow men to be priests, saying they hold different but equal roles."]},{"h":"Roles in marriage and family","bullets":["Traditional Christians use Ephesians 5:22-25: wives submit to husbands and husbands love their wives as Christ loved the church. They say men and women have different but equally valuable roles, such as a man as head of the household and a woman as home-maker.","Many modern Christians see marriage as an equal partnership in which the same Ephesians passage says to submit to one another (5:21), and both share jobs, childcare and decisions."]},{"h":"Jewish teaching","bullets":["Jews teach that men and women are created equal in God's image and have equal moral duties. Mothers are very highly valued, and Jewish identity passes through the mother.","In Orthodox Judaism the roles are different. Men lead worship, only men are rabbis, men and women sit separately in the synagogue, and women are not counted in a minyan (the ten needed for some prayers). In Reform and Liberal Judaism, women can be rabbis, sit with men and are counted in a minyan."]}],"views":[{"label":"Roman Catholic","text":"Men and women are equal in dignity, but only men can be priests. Husbands and wives share complementary roles."},{"label":"Church of England and most Protestants","text":"Men and women are equal in God's image. Women can be priests and bishops in the Church of England, and marriage is a partnership."},{"label":"Traditional or conservative Christian","text":"Men and women are equal in value but have different God-given roles, with the husband as head of the family and the wife caring for the home."},{"label":"Orthodox Jewish","text":"Men and women are equal in God's eyes but have different roles. Only men are rabbis and the synagogue has separate seating."},{"label":"Reform and Liberal Jewish","text":"Complete equality in worship and leadership. Women can be rabbis and are counted in a minyan."},{"label":"Non-religious","text":"Gender equality is a human right. Role stereotypes should not limit what anyone does."}],"terms":[{"term":"gender equality","def":"the belief that all genders have equal status and value, so discrimination is wrong"},{"term":"gender stereotype","def":"a fixed idea about how men or women should behave"},{"term":"roles of men and women","def":"the different jobs and duties a society or religion expects of men and women"},{"term":"minyan","def":"the group of ten Jewish adults needed for certain prayers"},{"term":"ordination","def":"the ceremony making someone a priest or minister"}],"sources":[{"text":"'So God created mankind in his own image... male and female he created them.'","ref":"Genesis 1:27","use":"The main source for equality: both genders are made in God's image."},{"text":"'There is neither Jew nor Gentile, neither slave nor free, nor is there male and female, for you are all one in Christ Jesus.'","ref":"Galatians 3:28","use":"Use for Christians who support equality. Say all are equal in Christ, so discrimination is wrong."},{"text":"'Wives, submit yourselves to your own husbands... Husbands, love your wives, just as Christ loved the church.'","ref":"Ephesians 5:22-25","use":"Used by traditional Christians for different roles. Balance it with the idea of mutual love."},{"text":"Jesus welcomed Mary to sit and learn at his feet, not just do housework.","ref":"Luke 10:38-42","use":"Use to show Jesus valued women as disciples and not only in domestic roles."}],"tip":"Distinguish 'equal' from 'the same'. Many traditional Christians and Orthodox Jews say men and women are equal but have different roles, and this is a strong point to evaluate."},{"id":"ta-07","code":"AQA spec A13 (not on the school list)","title":"Gender prejudice and discrimination","overview":"AQA expects you to know examples of gender prejudice and discrimination and what Christians and Jews teach about them. The school list does not give this its own number, but exam questions can ask about it.","notes":[{"h":"Prejudice and discrimination","bullets":["**Gender prejudice** is negative thoughts, feelings or beliefs about someone because of their gender. **Gender discrimination** is acting on those prejudices, such as treating someone unfairly.","Examples: women paid less for the same job, women or men refused jobs because of their sex, fewer women in senior roles, stereotypes such as 'boys do not cry', and some religions refusing to let women lead worship."]},{"h":"Religious teaching on prejudice","bullets":["Christians teach that everyone is equal and loved by God, so discrimination is wrong. Key teachings are 'love your neighbour as yourself' (Matthew 22:39), the Golden Rule (Matthew 7:12) and Galatians 3:28.","Christians who support women-only or men-only roles say this is not prejudice, because roles are different but equal. Others say excluding women from leadership is discrimination.","Jews teach that all people are made in God's image and that everyone should be treated justly. Orthodox Jews say different roles in worship are not discrimination. Reform and Liberal Jews say men and women should have equal roles."]}],"views":[{"label":"Christian (most denominations)","text":"All people are equal in God's image, so prejudice and discrimination are wrong. Christians disagree about whether different roles for men and women count as discrimination."},{"label":"Orthodox Jewish","text":"People are equal in value, but men and women have different religious duties. This is not seen as discrimination."},{"label":"Reform and Liberal Jewish","text":"Equality in all areas of religious life. Excluding women would be discrimination."},{"label":"Non-religious","text":"Gender prejudice is unfair and is against human rights. The Equality Act 2010 protects people from discrimination because of sex."}],"terms":[{"term":"gender prejudice","def":"negative thoughts, feelings or beliefs about a person based on their gender"},{"term":"gender discrimination","def":"acting on prejudice by treating someone unfairly because of their gender"},{"term":"stereotype","def":"a fixed and oversimplified idea about a group of people"},{"term":"Equality Act 2010","def":"UK law that protects people from discrimination, including because of sex"}],"sources":[{"text":"'Love your neighbour as yourself.'","ref":"Matthew 22:39","use":"Use for any point saying prejudice is wrong because Christians should treat everyone with love."},{"text":"'Do to others what you would have them do to you.'","ref":"Matthew 7:12","use":"The Golden Rule. Use to show discrimination goes against Jesus' teaching."},{"text":"'There is neither... male and female, for you are all one in Christ Jesus.'","ref":"Galatians 3:28","use":"Shows equality of all genders in the Christian community."},{"text":"'God created mankind in his own image.'","ref":"Genesis 1:27","use":"Used by Christians and Jews: everyone is made in God's image, so prejudice insults God's creation."}],"tip":"Give one real example of discrimination (for example unequal pay) before you give the religious teaching. It shows you understand the term."}],"flashcards":[{"topic":"ta-01","q":"What is the difference between heterosexual and homosexual?","a":"Heterosexual means attracted to people of the opposite gender. Homosexual means attracted to people of the same gender."},{"topic":"ta-01","q":"Why do traditional Christians say sex before marriage is wrong?","a":"They teach sex is a gift for marriage, joining two people for life. They quote the Catechism and 1 Corinthians 6:18 ('Flee from sexual immorality')."},{"topic":"ta-01","q":"What did the Archbishop of York say in 2011 about living together before marriage?","a":"He said couples could 'test the milk before you buy the cow', meaning a trial period might help them find out if they are suited before marrying."},{"topic":"ta-01","q":"Which Bible verse is used against homosexual acts by Orthodox Jews and traditional Christians?","a":"Leviticus 18:22: 'Do not have sexual relations with a man as one does with a woman; that is detestable.'"},{"topic":"ta-01","q":"Give one Christian reason why adultery is wrong.","a":"It breaks the Ten Commandments (Exodus 20:14) and the vows made before God. It also destroys trust and hurts children."},{"topic":"ta-01","q":"What did Jesus do when a woman was caught in adultery (John 8)?","a":"He told the crowd 'Let any one of you who is without sin be the first to throw a stone', forgave her, and told her to leave her life of sin."},{"topic":"ta-01","q":"What do Reform and Liberal Jews teach about same-sex relationships?","a":"They accept them. Liberal Judaism holds same-sex weddings, saying loving, committed relationships matter more than the gender of the couple."},{"topic":"ta-01","q":"What is the age of consent in the UK and why does it exist?","a":"16. It protects young people from exploitation and abuse."},{"topic":"ta-01","q":"What does Matthew 5:27-28 teach about adultery?","a":"Jesus taught that looking at someone lustfully is already adultery in the heart, so the thoughts matter as well as actions."},{"topic":"ta-02","q":"What is contraception?","a":"Precautions taken to prevent pregnancy, and to protect against sexually transmitted infections."},{"topic":"ta-02","q":"Why does the Catholic Church reject artificial contraception?","a":"It teaches that every sexual act must be open to new life (Humanae Vitae, 1968). Artificial methods separate sex from having children."},{"topic":"ta-02","q":"What type of family planning do Catholics allow?","a":"Natural family planning, such as avoiding sex during the fertile times of the month, for serious reasons."},{"topic":"ta-02","q":"Why do many Protestants accept contraception?","a":"It allows responsible parenthood. They say couples can plan family size for health, money and the needs of existing children, and sex also expresses love."},{"topic":"ta-02","q":"Why might some Christians object to the morning-after pill?","a":"They worry it might stop a fertilised egg developing. They see this as ending a life, which they link to 'You shall not murder'."},{"topic":"ta-02","q":"What do Orthodox Jews teach about contraception?","a":"Having children is a duty, so contraception is only allowed for good reasons such as the mother's health. The pill is preferred over methods that harm the body."},{"topic":"ta-02","q":"What is a non-religious argument for contraception?","a":"It prevents unwanted pregnancy, protects against STIs, helps control population growth and lets people plan their lives."},{"topic":"ta-02","q":"Which verse is used to support large families and oppose contraception?","a":"Genesis 1:28, 'Be fruitful and increase in number', and Psalm 127:3, 'Children are a heritage from the Lord'."},{"topic":"ta-02","q":"What is family planning?","a":"Planning when to have children and how many, using contraception or natural methods."},{"topic":"ta-03","q":"What are the Christian purposes of marriage?","a":"Love and companionship, a place for sex, having children and raising them in the faith, and a stable family life."},{"topic":"ta-03","q":"Why do Catholics call marriage a sacrament?","a":"They believe it is a lifelong union blessed by God, which gives God's grace to the couple."},{"topic":"ta-03","q":"What is cohabitation?","a":"Living together as a couple without being married or in a civil partnership."},{"topic":"ta-03","q":"When did same-sex marriage become legal in England and Wales?","a":"2014. Civil partnerships for same-sex couples had been available since 2004."},{"topic":"ta-03","q":"Do religious groups have to hold same-sex weddings?","a":"No. The law protects religious groups from being forced to do so. Quakers, Liberal Jews and the Methodist Church allow them, but Catholic and Orthodox Jewish authorities do not."},{"topic":"ta-03","q":"What does Genesis 2:24 teach about marriage?","a":"A man leaves his parents and is united to his wife and they become one flesh. Marriage is part of God's design and joins two people closely."},{"topic":"ta-03","q":"What is a Jewish chuppah?","a":"The canopy a Jewish couple stand under during a wedding. It represents the home they will build."},{"topic":"ta-03","q":"What does the Salvation Army say about cohabiting?","a":"That it 'falls short of God's ideal will', so marriage is better, although it accepts that many people live together."},{"topic":"ta-03","q":"Where do the words 'till death us do part' come from?","a":"The Christian wedding service, not the Bible. Use them for the promise of a lifelong marriage."},{"topic":"ta-04","q":"What is divorce?","a":"The legal ending of a marriage."},{"topic":"ta-04","q":"Why do Catholics oppose divorce?","a":"They teach marriage is a sacrament and lifelong. They quote Jesus: 'What God has joined together, let no one separate' (Matthew 19:6)."},{"topic":"ta-04","q":"What is an annulment?","a":"A Catholic declaration that a marriage was never valid, for example because it was forced. It allows the people to remarry in church."},{"topic":"ta-04","q":"Why do some Christians accept divorce?","a":"Jesus allowed it for adultery (Matthew 19:9). They say it can be the lesser of two evils, such as where there is abuse, and God forgives."},{"topic":"ta-04","q":"What can the Church do to help couples with problems?","a":"Offer counselling, prayer and support, and show compassion to people who divorce."},{"topic":"ta-04","q":"What is a get?","a":"A Jewish document of divorce, given by a husband to his wife through a Jewish court."},{"topic":"ta-04","q":"What does the Church of England teach about remarriage?","a":"Divorced people may remarry in church at the discretion of the priest. The Church stresses forgiveness and second chances."},{"topic":"ta-04","q":"What does Luke 16:18 say about remarriage?","a":"Anyone who divorces and marries another commits adultery. Catholics use it to say remarriage after divorce is wrong."},{"topic":"ta-04","q":"How long must a couple be married before they can divorce in the UK?","a":"One year. Since 2022 they can divorce without blaming each other."},{"topic":"ta-05","q":"What is a nuclear family?","a":"Two parents and their children."},{"topic":"ta-05","q":"What is an extended family?","a":"A nuclear family plus other relatives such as grandparents, aunts, uncles and cousins."},{"topic":"ta-05","q":"What is polygamy and what is the UK law on it?","a":"Having more than one spouse at once. Bigamy is illegal in the UK, and Christians teach one husband and one wife."},{"topic":"ta-05","q":"Give one role of Christian parents.","a":"To love and care for children and bring them up in the faith: 'bring them up in the training and instruction of the Lord' (Ephesians 6:4)."},{"topic":"ta-05","q":"What is the role of children in a religious family?","a":"To honour and respect parents (Exodus 20:12), obey them, and care for them when they are old."},{"topic":"ta-05","q":"What are the three purposes of the family in the AQA specification?","a":"Procreation (having children), stability and protection of children, and educating children in the faith."},{"topic":"ta-05","q":"Why do some religious people oppose same-sex parents?","a":"Catholics and Orthodox Jews teach that children need a mother and father as role models. Others say love and care matter more."},{"topic":"ta-05","q":"What is a stepfamily?","a":"A family formed when a parent with children marries or partners again."},{"topic":"ta-05","q":"What do Jewish parents teach their children?","a":"The Torah, Jewish customs such as Shabbat and festivals, and how to live a moral life (Deuteronomy 6:7)."},{"topic":"ta-06","q":"What is gender equality?","a":"The belief that all genders have equal status and value, so discrimination against any is wrong."},{"topic":"ta-06","q":"Which verse says men and women are made in God's image?","a":"Genesis 1:27: 'God created mankind in his own image... male and female he created them.'"},{"topic":"ta-06","q":"What does Galatians 3:28 teach about gender?","a":"There is no male and female in Christ, as all are one. Christians use it to support equality."},{"topic":"ta-06","q":"How did Jesus treat women?","a":"With respect. He taught women like Mary, spoke to the Samaritan woman, and first appeared to women after the resurrection."},{"topic":"ta-06","q":"Which Christians only allow men to be priests?","a":"Roman Catholics and Orthodox churches. They say men and women have different but equal roles."},{"topic":"ta-06","q":"When did the Church of England first have women priests and bishops?","a":"Women priests in 1994 and women bishops from 2015."},{"topic":"ta-06","q":"What does Ephesians 5:22-25 say, and how is it used?","a":"Wives submit to husbands and husbands love wives as Christ loved the church. Traditional Christians use it for different roles, others for mutual love."},{"topic":"ta-06","q":"How do Orthodox and Reform synagogues differ over women?","a":"Orthodox: only male rabbis, separate seating, women not counted in a minyan. Reform and Liberal: women rabbis, mixed seating, women counted."},{"topic":"ta-06","q":"Name one UK law supporting gender equality.","a":"The Equality Act 2010 (earlier laws: the Equal Pay Act 1970 and Sex Discrimination Act 1975)."},{"topic":"ta-07","q":"What is gender prejudice?","a":"Negative thoughts, feelings or beliefs about someone because of their gender."},{"topic":"ta-07","q":"What is gender discrimination?","a":"Acting on gender prejudice, such as paying someone less or refusing a job because of their gender."},{"topic":"ta-07","q":"Give two examples of gender discrimination.","a":"Women being paid less for the same work,
