and people being refused a job or a role such as leading worship because of their sex."},{"topic":"ta-07","q":"Why do Christians say prejudice is wrong?","a":"Everyone is made in God's image (Genesis 1:27) and Jesus taught 'love your neighbour as yourself'."},{"topic":"ta-07","q":"What is the Golden Rule?","a":"'Do to others what you would have them do to you' (Matthew 7:12). Christians use it to argue prejudice is wrong."},{"topic":"ta-07","q":"Why do some religious people say different roles are not discrimination?","a":"They say men and women are equal in value but have different God-given roles, so difference is not unfairness."},{"topic":"ta-07","q":"What is a stereotype?","a":"A fixed and oversimplified idea about a group, such as that women should stay at home."},{"topic":"ta-07","q":"What do Reform and Liberal Jews say about women leading worship?","a":"They support full equality: women can be rabbis, and are counted in a minyan."},{"topic":"ta-07","q":"Which law protects people from discrimination in the UK?","a":"The Equality Act 2010, which protects against discrimination because of sex, sexual orientation and other characteristics."}],"quiz":[{"topic":"ta-01","q":"Which of the following best describes adultery?","options":["Sex between two people where at least one is married to someone else","Sex before marriage","Living together without marrying","Having more than one spouse"],"answer":0,"why":"Adultery is sex where at least one person is married to someone else. Having more than one spouse is polygamy."},{"topic":"ta-01","q":"Which religious group teaches that homosexual acts are wrong but gay people must be treated with respect?","options":["Quakers","Roman Catholics","Liberal Jews","Humanists"],"answer":1,"why":"The Catholic Church teaches that same-sex acts are wrong, but also that gay people must be treated with compassion and respect."},{"topic":"ta-01","q":"Which Bible reference is the Ten Commandments rule against adultery?","options":["Genesis 1:28","Matthew 19:6","Exodus 20:14","Leviticus 18:22"],"answer":2,"why":"Exodus 20:14 says 'You shall not commit adultery'. Leviticus 18:22 is about homosexual acts."},{"topic":"ta-01","q":"A student writes: 'Some Christians accept sex in a committed relationship because love matters most.' Which group could she name as an example?","options":["Roman Catholics","Orthodox Jews","The Pope","Quakers"],"answer":3,"why":"Quakers and some liberal Anglicans focus on love and commitment rather than marriage alone."},{"topic":"ta-01","q":"What is the age of consent in the UK?","options":["16","14","18","21"],"answer":0,"why":"The age of consent is 16. It protects young people from exploitation."},{"topic":"ta-02","q":"Which Church teaches that only natural family planning is acceptable?","options":["Church of England","Roman Catholic Church","Methodist Church","Quakers"],"answer":1,"why":"The Catholic Church says sex must be open to new life, so artificial contraception is wrong, but natural methods are allowed."},{"topic":"ta-02","q":"Which of these is a natural method of family planning?","options":["The pill","Condoms","The rhythm method","Sterilisation"],"answer":2,"why":"The rhythm method means avoiding sex at fertile times of the month. The others are artificial."},{"topic":"ta-02","q":"Which statement is a reason many Protestants accept contraception?","options":["It stops all marriages","God forbids children","It is part of the Ten Commandments","It allows responsible parenthood"],"answer":3,"why":"Protestants say that planning family size for health, money and care for existing children is responsible."},{"topic":"ta-02","q":"Which Bible quotation is most often used to support having many children?","options":["'Be fruitful and increase in number'","'Do not kill'","'Love your neighbour'","'Honour your father and mother'"],"answer":0,"why":"Genesis 1:28 is used by Catholics and Orthodox Jews to show having children is part of God's plan."},{"topic":"ta-02","q":"Why might some Christians object to the morning-after pill?","options":["It is very expensive","It might end a fertilised egg, which they see as a life","It only works for men","It stops marriage"],"answer":1,"why":"Some Christians believe life begins at conception, so anything that might end it is like abortion."},{"topic":"ta-03","q":"What does 'cohabitation' mean?","options":["Being married twice","A Jewish wedding canopy","Living together as a couple without being married","A legal divorce"],"answer":2,"why":"Cohabitation is living together as a couple without marriage or a civil partnership."},{"topic":"ta-03","q":"When did same-sex marriage become legal in England and Wales?","options":["1967","1998","2004","2014"],"answer":3,"why":"The Marriage (Same Sex Couples) Act came into force in 2014. 2004 was when civil partnerships began."},{"topic":"ta-03","q":"Which statement describes the Catholic view of marriage?","options":["A sacrament that is lifelong","A temporary agreement","Only a legal contract","Only for people with children"],"answer":0,"why":"Catholics believe marriage is one of seven sacraments, a lifelong union blessed by God."},{"topic":"ta-03","q":"Which source states that a man 'leaves his father and mother and is united to his wife'?","options":["Exodus 20:12","Genesis 2:24","Matthew 5:28","Ephesians 6:4"],"answer":1,"why":"Genesis 2:24 is the key creation text on marriage."},{"topic":"ta-03","q":"Which group does NOT allow same-sex marriage in its religious ceremonies?","options":["Quakers","Liberal Judaism","Orthodox Judaism","Methodist Church"],"answer":2,"why":"Orthodox Judaism teaches that marriage is between a man and a woman. The others hold or allow same-sex weddings."},{"topic":"ta-04","q":"What is a get?","options":["A Catholic annulment","A Christian wedding vow","A type of family","A Jewish document of divorce"],"answer":3,"why":"A get is the Jewish divorce document, issued through a Jewish court."},{"topic":"ta-04","q":"Which Bible passage gives an exception for divorce in the case of adultery?","options":["Matthew 19:9","Genesis 1:27","Psalm 127:3","Exodus 20:12"],"answer":0,"why":"Jesus says 'except for sexual immorality' in Matthew 19:9, which Protestants use to allow divorce."},{"topic":"ta-04","q":"Which Church does not recognise divorce but allows annulment?","options":["Church of England","Roman Catholic Church","Methodist Church","United Reformed Church"],"answer":1,"why":"Catholics teach marriage is permanent, so the Church only declares that a marriage was never valid (annulment)."},{"topic":"ta-04","q":"A Christian says: 'Divorce can be the lesser of two evils.' Which situation does this best fit?","options":["A couple who just want a bigger house","A couple who have a disagreement about holidays","A marriage involving violence or abuse","A couple who have never met"],"answer":2,"why":"Many Christians accept divorce in abusive marriages because staying together causes more harm."},{"topic":"ta-04","q":"Where do the words 'till death us do part' come from?","options":["The Ten Commandments","The Gospel of Matthew","The Torah","Christian wedding services"],"answer":3,"why":"They are from the wedding vows, not the Bible, so do not cite them as a Bible quote."},{"topic":"ta-05","q":"A family of two parents and their children is called:","options":["A nuclear family","An extended family","A stepfamily","A polygamous family"],"answer":0,"why":"A nuclear family is two parents and their children. Extended families include other relatives."},{"topic":"ta-05","q":"Which one of these is a religious purpose of the family?","options":["Contraception","Procreation","Cohabitation","Divorce"],"answer":1,"why":"Procreation, having children, is one purpose along with stability and educating children in the faith."},{"topic":"ta-05","q":"Which verse tells fathers to bring children up in the Lord's instruction?","options":["Exodus 20:14","Genesis 2:24","Ephesians 6:4","Leviticus 18:22"],"answer":2,"why":"Ephesians 6:4 is used for the role of parents in a Christian family."},{"topic":"ta-05","q":"Why do Orthodox Jews and Catholics often oppose same-sex parenting?","options":["They think children should not be raised in faith","It is illegal in the UK","They believe parents should not work","They think children need both a mother and a father"],"answer":3,"why":"Their view is that children benefit from role models of both genders. Same-sex adoption is legal in the UK."},{"topic":"ta-05","q":"What is polygamy?","options":["Having more than one husband or wife at the same time","Marrying twice after a divorce","Living with your parents","A Jewish festival"],"answer":0,"why":"Polygamy means multiple spouses. It is illegal in the UK as bigamy, and Christians today teach one husband and one wife."},{"topic":"ta-06","q":"Which Bible verse says there is 'neither male nor female' in Christ?","options":["Genesis 2:24","Galatians 3:28","Matthew 19:6","Exodus 20:12"],"answer":1,"why":"Galatians 3:28 is the key source for Christian equality."},{"topic":"ta-06","q":"Which Christian groups do NOT ordain women as priests?","options":["Church of England and Methodists","Quakers","Roman Catholics and Orthodox churches","United Reformed Church"],"answer":2,"why":"The Catholic and Orthodox churches ordain only men, saying men and women have different roles."},{"topic":"ta-06","q":"In an Orthodox synagogue, which is true?","options":["Women can be rabbis","Women are counted in the minyan","There are no rules about seating","Men and women sit separately"],"answer":3,"why":"Orthodox synagogues have separate seating, male rabbis and a male-only minyan."},{"topic":"ta-06","q":"Which UK law made discrimination because of sex illegal and replaced earlier laws in 2010?","options":["Equality Act","Abortion Act","Suicide Act","Marriage Act"],"answer":0,"why":"The Equality Act 2010 protects people from discrimination on grounds such as sex and sexual orientation."},{"topic":"ta-07","q":"Acting on negative beliefs about someone because of their gender is called:","options":["Gender prejudice","Gender discrimination","Gender equality","Gender stereotyping"],"answer":1,"why":"Prejudice is the belief or feeling. Discrimination is acting on it."},{"topic":"ta-07","q":"Which teaching of Jesus is a Christian reason for rejecting prejudice?","options":["'Be fruitful and increase'","'Honour your father and mother'","'Love your neighbour as yourself'","'Do not covet'"],"answer":2,"why":"Loving your neighbour means treating everyone fairly, whatever their gender."},{"topic":"ta-07","q":"Which is an example of gender discrimination?","options":["A man enjoys cooking","A girl joins a football club","A couple share childcare","A woman is paid less than a man for the same job"],"answer":3,"why":"Unequal pay for the same work is unfair treatment because of gender."},{"topic":"ta-07","q":"Why do some Orthodox Jews say different roles in worship are not discrimination?","options":["They say men and women are equal in value but have different duties","They deny women are made in God's image","They believe only women are important","They think it is illegal"],"answer":0,"why":"They argue 'equal but different': both are made in God's image but have different religious duties."}],"exam":[{"topic":"ta-04","marks":12,"type":"evaluate","q":"'A Christian should never get divorced.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Many Christians would agree with this statement. Catholics teach that marriage is a sacrament, a lifelong promise made before God. Jesus said 'What God has joined together, let no one separate' (Matthew 19:6), so a divorce breaks a vow made to God and not just to a partner. Christians also point out that divorce can harm children and weaken family life. This is a strong argument for Catholics, who believe the teaching comes directly from Jesus, but it is less convincing for Christians who do not see marriage as a sacrament.\n\nHowever, many Christians disagree. The Church of England and most Protestant churches teach that divorce is sad but sometimes the lesser of two evils. In Matthew 19:9 Jesus himself allowed divorce for adultery, and in cases of violence or abuse, staying married could cause far more harm than ending it. Jesus also taught forgiveness and compassion, so Christians should not condemn people whose marriages have failed. This argument is strong because it follows Jesus' own teaching and it protects people from harm, although some say it risks making vows seem less serious. Non-religious people would also say that a couple should not be forced to stay together if they are unhappy.\n\nIn conclusion, I think the statement is too strong. Marriage should be lifelong and Christians should do everything they can to save it, including counselling, but the word 'never' ignores situations such as abuse. A loving God would not want someone to suffer in a violent marriage. Even Catholics accept that couples may separate legally in extreme cases, and the Church can annul a marriage that was never valid. Therefore, divorce should be a last resort and not an absolute wrong.","for":["Marriage is a sacrament and a lifelong vow before God (Catholic teaching).","Matthew 19:6: 'What God has joined together, let no one separate'; Luke 16:18 says remarriage is adultery.","Divorce harms children and weakens the family.","Evaluation: strongest for Catholics, but depends on seeing marriage as a sacrament."],"against":["The Church of England and Protestants accept divorce as the lesser of two evils.","Jesus allowed divorce for adultery (Matthew 19:9).","Compassion, forgiveness and avoiding harm in abusive marriages.","Non-religious: people should not be forced to stay in unhappy marriages.","Evaluation: strong because it follows Jesus' teaching on compassion."],"conclusion":"The statement is too absolute. Christians should treat marriage as lifelong and try to save it, but divorce can be the lesser of two evils in cases such as abuse."},{"topic":"ta-01","marks":12,"type":"evaluate","q":"'Sex outside marriage is always wrong.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Many religious people would agree with this statement. Traditional Christians and Orthodox Jews teach that sex is a gift from God that belongs in marriage, where it joins two people for life and can lead to children. The Catechism says every sexual act must be within marriage, and 1 Corinthians 6:18 says 'Flee from sexual immorality'. Adultery is also condemned by the Ten Commandments (Exodus 20:14) because it breaks promises and destroys trust. This argument is strong for believers who see the Bible as God's word, because it gives clear guidance and protects families.\n\nOn the other hand, many people disagree. Some Christians, such as Quakers and many liberal Anglicans, say the most important thing is that a couple are loving, faithful and committed. They argue that Jesus taught 'love your neighbour', not strict rules about marriage, and that a loyal couple who are not married are not harming anyone. Reform Jews are also more flexible about committed couples. Non-religious people say sex between consenting adults is a private choice, and many couples live together for years before marrying. This is a convincing point in modern society, but it is weaker for those who believe in clear moral rules from God. Also, 'outside marriage' includes adultery, which almost everyone, religious or not, agrees causes harm.\n\nIn conclusion, I think the statement is true for adultery but not necessarily for every situation. Adultery breaks promises and hurts others, so it is wrong in almost every view. However, sex between two unmarried people in a loving, committed relationship is hard to describe as always wrong, especially as Jesus stressed love and forgiveness. Religious believers can still say that marriage is the ideal, and that respect, consent and responsibility must always come first.","for":["Traditional Christians and Orthodox Jews: sex is for marriage (Catechism, 1 Corinthians 6:18).","Adultery breaks the Ten Commandments (Exodus 20:14) and wedding vows.","Sex outside marriage can lead to hurt, pregnancy and STIs.","Evaluation: strong for believers who accept the Bible as authority."],"against":["Quakers and liberal Christians: love and commitment matter most.","Jesus taught love and forgiveness (John 8:7).","Reform Jews more flexible; humanists see it as a private choice between consenting adults.","Many couples cohabit successfully before marriage.","Evaluation: persuasive today, but weaker for those who see God's rules as fixed."],"conclusion":"The statement is convincing for adultery but too strong for committed couples. Marriage is the religious ideal but love, consent and responsibility matter in every view."},{"topic":"ta-02","marks":12,"type":"evaluate","q":"'Religious people should not use contraception.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Some religious people would support this statement. The Roman Catholic Church teaches that sex must always be open to creating new life, and that artificial contraception separates sex from having children. This is based on Genesis 1:28, 'Be fruitful and increase in number', and on the Catechism and Humanae Vitae (1968). Catholics argue that children are a gift from God (Psalm 127:3), so a couple should not block God's plan. Some Christians also worry that methods like the coil or morning-after pill could end a fertilised egg, which they see as a life. This is a strong argument for Catholics because it follows their official teaching, but it only applies to artificial methods, as Catholics allow natural family planning.\n\nHowever, many religious people disagree. The Church of England and most Protestants teach that sex is also about love, and that couples can plan their families responsibly. They say contraception helps parents to care properly for their children, protects the mother's health, and reduces the spread of STIs. Reform Jews also accept contraception, as couples have free will and need to protect their family's welfare. Non-religious people add that contraception reduces unwanted pregnancies and abortions. This argument is strong because it uses the principle of caring for others, and no Bible verse specifically forbids contraception.\n\nIn conclusion, I do not agree that religious people should not use contraception. The statement is true for Catholics who follow their Church's teaching, but 'religious people' includes many Christians and Jews who accept contraception as part of responsible parenthood. It is also hard to say that God would prefer unwanted children, or that spreading STIs is better than using protection. However, believers who are worried about methods that might end a life have a fair point, so choosing methods carefully is sensible.","for":["Catholic teaching: sex must be open to life (Humanae Vitae, Catechism).","Genesis 1:28 and Psalm 127:3: children are God's blessing.","Orthodox Jews: having children is a duty, contraception only for good reason.","Some methods might end a fertilised egg, which some see as abortion.","Evaluation: strong for Catholics, but they accept natural family planning."],"against":["Church of England and Protestants: responsible parenthood, health, finances.","1 Timothy 5:8: provide for your family.","Reform Jews allow contraception; non-religious people say it prevents unwanted pregnancy and STIs.","No Bible verse forbids contraception directly.","Evaluation: strong because it focuses on love and care."],"conclusion":"The statement is too general. It matches Catholic teaching but many Christians and Jews see contraception as a responsible choice."},{"topic":"ta-06","marks":12,"type":"evaluate","q":"'Men and women should have the same roles in religion.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Many religious people support this statement. Genesis 1:27 says 'male and female he created them' in God's image, which suggests men and women have equal value. Galatians 3:28 says 'there is neither... male and female, for you are all one in Christ Jesus'. Jesus treated women with respect: he taught Mary and appeared first to women after his resurrection. On this basis the Church of England allows women to be priests and bishops, and Reform and Liberal Judaism have women rabbis. This is a strong argument because it follows the main Christian teaching of equality, and because many women have shown they can lead worship well.\n\nOn the other hand, some religious people believe men and women have different roles. The Catholic and Orthodox churches only allow men to be priests, as Jesus chose twelve male disciples, and Orthodox Judaism has male rabbis and separate seating in the synagogue. Traditional Christians use Ephesians 5:22-25 to say a husband and wife have different but equally important roles. They say 'different' does not mean 'unequal', and that tradition should be respected. This argument is strong for those who give great authority to tradition, but weaker for those who point out that, in Jesus' time, culture limited women's roles, and Jesus himself broke many customs. Non-religious people would say that excluding people from roles because of their gender is discrimination.\n\nIn conclusion, I think the statement is reasonable if it means everyone should have equal respect and the opportunity to serve. The evidence from Genesis 1:27 and Galatians 3:28 is very strong, and the fact that many churches now have women in leadership suggests tradition can change. However, the claim that roles must be exactly the same does not take seriously the beliefs of those who see worship and family life as based on God-given differences. These believers sincerely think different roles are equal, so the debate can only be resolved by how a person interprets the sources.","for":["Genesis 1:27: both genders are made in God's image.","Galatians 3:28: all one in Christ.","Jesus respected women; the Church of England has women priests and bishops; Reform Judaism has women rabbis.","Non-religious: discrimination is unfair.","Evaluation: strong because it follows the core teaching on equality."],"against":["Catholic and Orthodox Christians: only men can be priests (Jesus chose twelve male apostles).","Orthodox Judaism: male rabbis and separate seating.","Ephesians 5:22-25: different but equal roles in marriage.","Evaluation: strong for those who value tradition, but can be seen as unfair."],"conclusion":"Equal value and opportunity are supported by key teachings, but believers genuinely differ on whether equal means the same roles."},{"topic":"ta-05","marks":12,"type":"evaluate","q":"'The main purpose of the family is to have children.' Evaluate this statement. In your answer you should: refer to religious teachings; give developed arguments to support this statement; give developed arguments to support a different point of view; reach a justified conclusion. You may refer to non-religious points of view.","model":"Many religious people would agree that having children is a central purpose of the family. Genesis 1:28 says 'Be fruitful and increase in number', and Psalm 127:3 calls children 'a heritage from the Lord'. Catholics and Orthodox Jews teach that marriage and sex are meant to be open to children, so the family begins with procreation. Without children, there would be no next generation to carry on the faith. This is a strong argument because it follows God's first command to humans, but it does not explain why couples without children are still families.\n\nHowever, there are other equally important purposes. Families give children stability and protection, a safe place to learn right from wrong. Christians say parents should bring children up 'in the training and instruction of the Lord' (Ephesians 6:4), and Jews are commanded to teach children the Torah (Deuteronomy 6:7). The family is also where love and companionship are found, including for the elderly, and Christians and Jews are expected to care for their parents (Exodus 20:12). Non-religious people would add that a family does not have to include children to give people support and security, and many couples choose not to have children. This argument is strong because it matches how most families live today.\n\nIn conclusion, I think having children is an important purpose but not the main one. Without love, stability and education in the faith, simply having children would not achieve what religious teachings want from families. A couple who cannot have children, or choose not to, can still have a loving family which serves God by caring for others. For this reason, I think the purpose of the family is better summed up as providing a loving, stable home, with children as one of the blessings of that home.","for":["Genesis 1:28 and Psalm 127:3: children are God's blessing and command.","Catholics and Orthodox Jews: sex and marriage are open to life.","Procreation ensures the faith is passed on.","Evaluation: strong in religious terms, but ignores couples without children."],"against":["Families give stability, protection and security for all members.","Ephesians 6:4 and Deuteronomy 6:7: educating children in the faith.","Exodus 20:12: caring for elderly parents shows families are more than having children.","Non-religious: many families have no children or different forms.","Evaluation: strong because it matches how people actually live."],"conclusion":"Having children is important, but love, stability and passing on the faith are equally central, so it is not the only main purpose."},{"topic":"ta-02","marks":4,"type":"different","q":"Explain two different religious beliefs about the use of artificial contraception. In your answer you must refer to one or more religious traditions.","model":"One belief, held by Roman Catholics, is that artificial contraception is wrong. This is because the Catholic Church teaches that every sexual act must be open to creating new life, so blocking this with the pill or condoms goes against God's purpose for sex. A different belief, held by the Church of England, is that contraception is acceptable in marriage. This is because couples have a duty to plan their family responsibly, for example by thinking about their health and money, so using contraception is a way of caring for the children they already have.","points":["Catholic: artificial contraception is wrong (1), because sex must be open to new life / natural law / Humanae Vitae (1).","Church of England or Protestant: contraception is acceptable (1), because of responsible parenthood, health, finances or the quality of family life (1).","Other creditable: Orthodox Jews allow it in limited cases such as the mother's health; Reform Jews accept it more freely."]},{"topic":"ta-01","marks":4,"type":"similar","q":"Explain two similar religious beliefs about adultery. In your answer you must refer to one or more religious traditions.","model":"One belief is that adultery is wrong because it breaks the Ten Commandments. Christians and Jews both follow 'You shall not commit adultery', so having sex with someone else's husband or wife disobeys God. A similar belief is that adultery is wrong because it breaks the promises made at a wedding. Christians make vows before God and Jews make a covenant, so adultery betrays the partner, destroys trust and can hurt the children.","points":["Adultery is wrong because it breaks the commandment (1), and is disobeying God (1).","Adultery breaks marriage promises or vows (1), and damages trust, the couple or the children (1).","Other creditable: Jesus taught lust is adultery in the heart (Matthew 5:28); adultery can destroy the family."]},{"topic":"ta-04","marks":4,"type":"different","q":"Explain two different beliefs in contemporary British society about divorce. In your answer you must refer to the main religious tradition of Great Britain and one or more other religious traditions.","model":"One belief, held by Roman Catholics, is that divorce is not accepted. This is because Catholics believe marriage is a sacrament and a lifelong promise made before God, so only God can end it. A different belief, held by Jews, is that divorce is allowed, although it is sad. This is because the Torah allows a couple to divorce if the marriage has broken down, and the husband gives his wife a get, a document ending the marriage.","points":["Catholic: divorce not accepted (1), marriage is a sacrament / lifelong vow / Matthew 19:6 (1).","Jewish: divorce permitted (1), if the marriage has broken down, with a get / Deuteronomy 24:1 (1).","Other creditable: Church of England accepts divorce as a last resort; humanists accept it as a personal choice."]},{"topic":"ta-03","marks":4,"type":"similar","q":"Explain two similar religious beliefs about the purpose of marriage. In your answer you must refer to one or more religious traditions.","model":"One belief is that the purpose of marriage is to have children. Christians believe God told humans to 'be fruitful and increase in number', so marriage is where a couple should start a family. A similar belief, held by Jews, is that marriage is for companionship and for building a Jewish home. Jews believe 'it is not good for the man to be alone', so marriage gives a couple a lifelong partner and a stable family in which to raise children in the faith.","points":["Christian: marriage is for having children / procreation (1), linked to Genesis 1:28 or raising children in the faith (1).","Jewish: marriage is for companionship and family life (1), linked to Genesis 2:18 or raising children in Judaism (1).","Other creditable: marriage as a safe place for sex; a stable home."]},{"topic":"ta-05","marks":4,"type":"different","q":"Explain two different religious beliefs about same-sex parents. In your answer you must refer to one or more religious traditions.","model":"One belief, held by many Roman Catholics and Orthodox Jews, is that children need a mother and a father. This is because they believe children learn from role models of both genders and that marriage is meant to be between a man and a woman. A different belief, held by Quakers and Reform Jews, is that same-sex couples can be good parents. This is because they teach that love and care matter more than gender, and every person is made in the image of God.","points":["Catholic or Orthodox Jewish: children need a mother and a father (1), because of role models / the traditional view of marriage (1).","Quaker, liberal Christian or Reform Jewish: same-sex couples can be good parents (1), because love and care matter most / all are equal in God's image (1).","Other creditable: the Church of England teaches that children need to be loved, but its official teaching is that marriage is between a man and a woman."]},{"topic":"ta-06","marks":4,"type":"similar","q":"Explain two similar religious beliefs about gender equality. In your answer you must refer to one or more religious traditions.","model":"One belief, held by Christians, is that men and women are equal because both are made in God's image. Genesis 1:27 says 'male and female he created them', so neither gender is more valuable than the other. A similar belief, held by Jews, is that men and women have equal value and the same moral duties. This is because God created everyone, and in Reform and Liberal Judaism women can be rabbis and are counted in a minyan.","points":["Christian: equal because made in God's image (1), Genesis 1:27 or Galatians 3:28 (1).","Jewish: equal value and moral duties because God created all (1), development such as women rabbis in Reform Judaism or mothers valued highly (1).","Other creditable: Jesus treated women with respect."]},{"topic":"ta-05","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about the role of parents in a religious family. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that parents must bring up their children in the faith. This means parents should teach them about God, take them to worship and set a good example. Ephesians 6:4 says fathers should bring children up 'in the training and instruction of the Lord'. This means Christian parents have a duty to teach right from wrong, so many baptise their children and take them to church. Another belief is that parents should love and care for their children. This is because children are a gift from God, as Psalm 127:3 says: 'Children are a heritage from the Lord'. This means Christian parents should treat children as precious, protect them and provide a safe, loving home.","points":["Belief 1: parents teach children the faith (1), development (1), source such as Ephesians 6:4 or Deuteronomy 6:7 (1), application of the source (1).","Belief 2: parents love and care for children (1), development (1), source such as Psalm 127:3 or Proverbs 22:6 (1), application (1).","Maximum 6: two beliefs, each developed with a source, with at least one source used for full marks."]},{"topic":"ta-03","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about the purpose of marriage. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One purpose of marriage is companionship. God made marriage so that people would not be lonely. Genesis 2:18 says 'It is not good for the man to be alone'. This means a married couple should support and love each other through good and bad times, which is why Christians and Jews see marriage as a lifelong partnership. Another purpose is to have children. Genesis 1:28 says 'Be fruitful and increase in number'. This means marriage is the right place to start a family, so Christian couples often promise to raise children in the faith when they marry.","points":["Companionship (1), development (1), Genesis 2:18 or Genesis 2:24 (1), application (1).","Having children (1), development (1), Genesis 1:28 or Psalm 127:3 (1), application (1).","Other creditable purposes: a stable family life, a safe place for sex, a sacrament that reflects God's love."]},{"topic":"ta-04","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about divorce. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief, held by Catholics, is that divorce is wrong because marriage is lifelong. This means a couple make a promise before God which cannot be broken. In Matthew 19:6 Jesus says 'What God has joined together, let no one separate'. This means Catholics do not recognise divorce and can only remarry in church if the first marriage is annulled. Another belief, held by many Protestants, is that divorce is allowed in some situations. This is because Christians should be compassionate when a marriage has failed. In Matthew 19:9 Jesus allows divorce for adultery, so Protestants say divorce can be the lesser of two evils.","points":["Catholic: divorce wrong, lifelong marriage (1), development with sacrament or vows (1), Matthew 19:6 (1), application of source such as annulment only (1).","Protestant: divorce permitted in some situations (1), development with compassion or lesser of two evils (1), Matthew 19:9 (1), application (1).","Other creditable: Jewish get and Deuteronomy 24:1; Malachi 2:16."]},{"topic":"ta-01","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about homosexual relationships. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that homosexual acts are wrong. Traditional Christians and Orthodox Jews believe marriage and sex are for a man and a woman, and for having children. Leviticus 18:22 says 'Do not have sexual relations with a man as one does with a woman'. This means these believers see same-sex sex as against God's law, although they say gay people should still be respected. Another belief is that homosexual relationships should be accepted. Many liberal Christians and Quakers point out that Jesus said 'Love your neighbour as yourself' (Matthew 22:39). This means they treat gay couples with equal love and accept their relationships, if they are faithful and committed.","points":["Homosexual acts wrong (1), development such as procreation or marriage between man and woman (1), Leviticus 18:22 (1), application (1).","Homosexual relationships accepted (1), development such as love and equality (1), Matthew 22:39 or Genesis 1:27 (1), application (1).","Other creditable: Catechism on respect for gay people; Liberal Judaism accepts same-sex relationships."]},{"topic":"ta-06","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about gender equality. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that men and women are equal because they are both made in God's image. Genesis 1:27 says 'male and female he created them'. This means that neither gender is worth more than the other, so many Christians support women in leadership roles such as priests and bishops. Another belief is that all Christians are one in Christ. Galatians 3:28 says 'There is neither... male and female, for you are all one in Christ Jesus'. This means gender should not affect how a person is treated in the church, so discrimination against women is wrong.","points":["Equal in God's image (1), development (1), Genesis 1:27 (1), application such as women priests (1).","All one in Christ (1), development (1), Galatians 3:28 (1), application such as no discrimination (1).","Other creditable: Jesus' respect for women; traditional Christians use Ephesians 5 for different but equal roles."]},{"topic":"ta-02","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about contraception. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief, held by Catholics, is that artificial contraception is wrong. This means sex must always be open to having children. Genesis 1:28 says 'Be fruitful and increase in number', and the Catechism teaches that every act of sex must remain open to life. This means Catholics only use natural family planning to space out their children. Another belief, held by many Protestants, is that contraception is acceptable. This is because couples should be responsible parents. 1 Timothy 5:8 teaches that people should provide for their families, so Protestants say using contraception to have only as many children as they can care for is a way of following that teaching.","points":["Catholic: artificial contraception wrong (1), development (1), Genesis 1:28 or Catechism (1), application such as natural family planning (1).","Protestant: contraception acceptable (1), development (1), 1 Timothy 5:8 or Genesis 2:24 on love in marriage (1), application (1).","Other creditable: Jewish views and the Church of England quotation about good reasons for limiting parenthood."]},{"topic":"ta-07","marks":6,"type":"explain-two-source","q":"Explain two religious beliefs about gender prejudice and discrimination. Refer to sacred writings or another source of religious belief and teaching in your answer.","model":"One belief is that gender prejudice is wrong because Christians should treat others as they want to be treated. This means they should not judge or treat someone unfairly because of their gender. In Matthew 7:12 Jesus says 'do to others what you would have them do to you'. This means a Christian employer should pay men and women equally. Another belief is that everyone is made in God's image. Genesis 1:27 says 'male and female he created them'. This means that discrimination insults what God has made, so Christians and Jews should challenge it.","points":["Treat others as you want to be treated (1), development (1), Matthew 7:12 (1), application such as equal pay (1).","All made in God's image (1), development (1), Genesis 1:27 (1), application such as challenging discrimination (1).","Other creditable: Galatians 3:28; Jesus' treatment of women."]}]},{"section":{"id":"theme-b","title":"Theme B: Religion and life","short":"Theme B","paper":2,"religion":"Themes","blurb":"Origins of the universe and life, caring for the world and animals, abortion, euthanasia and life after death, from Christian, Jewish and non-religious points of view."},"topics":[{"id":"tb-01","code":"Rel & Life.1","title":"The origins of the universe","overview":"Christians and Jews believe God created the universe, while science explains it with the Big Bang. You need to explain religious creation teachings, scientific theory and how believers link the two.","notes":[{"h":"Religious teachings on creation","bullets":["Christians and Jews believe God created the universe. Genesis 1 describes creation in six days, with God resting on the seventh. Many believe God created 'out of nothing' (**creation ex nihilo**).","Genesis 1:3: God said 'Let there be light'. This shows God's power: he only had to speak. John 1:1-3 says everything was made through the Word (Jesus), and Genesis 1:2 mentions God's Spirit, which Christians link to the Trinity.","Creation shows that the world is good (Genesis 1:31) and has a purpose, and that God is powerful, intelligent and loving."]},{"h":"Scientific view","bullets":["The **Big Bang theory** says the universe began almost 14 billion years ago, from an extremely hot, dense point called a singularity. It then expanded and cooled, forming stars and galaxies.","This is a scientific theory based on evidence such as the expansion of the universe and background radiation. It explains how the universe developed, but it does not say why."]},{"h":"Religion and science","bullets":["Some Christians (**creationists** or fundamentalists) and some Orthodox Jews take Genesis literally as God's word, so reject the Big Bang or believe the earth is only thousands of years old.","Other Christians and Jews believe Genesis is a symbolic story about why God made the world. They say the Big Bang could be how God created it, and that science explains 'how' while religion explains 'why'. The Catholic Church accepts the Big Bang and evolution.","Non-religious people, such as atheists and humanists, say science shows the universe began naturally without God. Some religious people believe God designed the universe because it is so ordered and complex (intelligent design)."]}],"views":[{"label":"Literal Christian (creationist)","text":"Genesis is the word of God and describes real events, so God made the world in six days. The Big Bang is not accepted, or is said to be wrong about the age of the universe."},{"label":"Catholic and liberal Christian","text":"Genesis teaches that God is the creator but is not a science textbook. The Big Bang can be the way God began creation, so science and faith can agree."},{"label":"Orthodox Jewish","text":"The Torah is God's word and God created the world, but some Orthodox Jews read the 'days' as long periods and accept the Big Bang. Others take Genesis literally."},{"label":"Reform and Liberal Jewish","text":"Genesis is a symbolic story. God is the creator and science explains the process."},{"label":"Non-religious","text":"The Big Bang and natural laws explain the universe without the need for God, and religious accounts are myths."}],"terms":[{"term":"Big Bang theory","def":"the scientific theory that the universe began almost 14 billion years ago from a singularity and expanded"},{"term":"creation","def":"the religious belief that God made the universe"},{"term":"creation ex nihilo","def":"the belief that God created everything out of nothing"},{"term":"creationist","def":"a person who takes the Genesis account of creation literally"},{"term":"scientific","def":"based on observation and experiments"},{"term":"singularity","def":"the tiny, hot, dense point from which the universe is thought to have begun"}],"sources":[{"text":"'In the beginning God created the heavens and the earth.'","ref":"Genesis 1:1","use":"The key teaching that God is the creator. Use it for any question on origins."},{"text":"'And God said, Let there be light, and there was light.'","ref":"Genesis 1:3","use":"Shows God's power: he created simply by speaking."},{"text":"'In the beginning was the Word... Through him all things were made.'","ref":"John 1:1-3","use":"Christian belief that Jesus, the Word, was involved in creation. Links to the Trinity."},{"text":"'God saw all that he had made, and it was very good.'","ref":"Genesis 1:31","use":"Use to show the world is valuable and created with purpose."}],"tip":"On 'religion versus science' questions never say all Christians reject the Big Bang. Show a range: literal Christians, then Catholics and liberal Christians who accept it."},{"id":"tb-02","code":"Rel & Life.2","title":"The value of the world","overview":"Christians and Jews believe the world is valuable because God made it, and this gives humans a duty to look after it. The key ideas are stewardship, dominion, responsibility, and awe and wonder.","notes":[{"h":"Why the world has value","bullets":["Christians and Jews believe God created the world and it belongs to him: 'The earth is the Lord's, and everything in it' (Psalm 24:1). Humans do not own it.","The world is good (Genesis 1:31) and shows God's power and care. **Awe and wonder** at nature, like mountains and stars, leads many believers to praise God: 'The heavens declare the glory of God' (Psalm 19:1).","The world is also valuable because it supports all life, including future generations."]},{"h":"Stewardship and dominion","bullets":["**Stewardship** is the duty given by God to look after the world and everything in it. Genesis 2:15 says God put Adam in the garden 'to work it and take care of it'. Humans are caretakers for God and will answer to him.","**Dominion** means humans have been given charge of the world (Genesis 1:26-28). Some believers say this gives humans the right to use the world as they wish, but most Christians and Jews say it means a duty to rule responsibly and kindly, like a good king.","Jews also teach **Tikkun Olam**, which means 'repairing the world', and **bal tashchit**, the ban on wasting or destroying (Deuteronomy 20:19-20)."]},{"h":"Responsibility in practice","bullets":["Believers show responsibility by recycling, saving energy, supporting charities such as CAFOD and Christian Aid, and joining campaigns such as the Church of England's Eco Church scheme.","Responsibility is also to future generations and to the poor, who often suffer most when the environment is damaged."]}],"views":[{"label":"Christian","text":"The world is God's creation, entrusted to humans. The duty is stewardship: to care for it and hand it on to future generations. Many Christians also stress dominion as responsible rule."},{"label":"Jewish","text":"The world belongs to God and humans are caretakers. Tikkun Olam, bal tashchit and the Sabbath rest for the land teach respect for creation."},{"label":"Non-religious","text":"The world has value because humans and other life depend on it. The duty to protect it comes from reason, human welfare and future generations, not from God."}],"terms":[{"term":"stewardship","def":"the duty given by God to look after the world and all life in it"},{"term":"dominion","def":"the belief that humans have been given charge of the world"},{"term":"awe and wonder","def":"a feeling of amazement at nature, often linked to a sense that God is revealed through it"},{"term":"responsibility","def":"having a duty to act in a certain way"},{"term":"Tikkun Olam","def":"the Jewish duty to repair or heal the world"},{"term":"bal tashchit","def":"the Jewish rule against wasting or destroying things"}],"sources":[{"text":"'The earth is the Lord's, and everything in it.'","ref":"Psalm 24:1","use":"Shows the world belongs to God, so humans are only caretakers."},{"text":"'The Lord God took the man and put him in the Garden of Eden to work it and take care of it.'","ref":"Genesis 2:15","use":"Main source for stewardship."},{"text":"'Rule over the fish in the sea and the birds in the sky.'","ref":"Genesis 1:26","use":"Source for dominion. Explain that rule should be responsible."},{"text":"'The heavens declare the glory of God.'","ref":"Psalm 19:1","use":"Use for awe and wonder: nature shows God's greatness."}],"tip":"Be able to explain both stewardship and dominion and say how they differ. A strong answer says dominion should be understood as responsible care, not permission to exploit."},{"id":"tb-03","code":"Rel & Life.3","title":"The use and abuse of the environment","overview":"The environment gives humans natural resources, but misuse damages it. Christians and Jews teach that the duty of stewardship means using resources carefully for future generations.","notes":[{"h":"Use and abuse","bullets":["**Natural resources** are materials found in nature, such as oil, coal, gas, water, trees and minerals. Using them carefully is a **use** of the environment. Wasting, polluting or destroying them is **abuse**.","Pressures on the environment include population growth, deforestation, over-use of fossil fuels, and climate change from greenhouse gases, which cause floods, droughts and rising seas.","**Sustainable development** means meeting today's needs without damaging the ability of future generations to meet theirs."]},{"h":"Religious teachings and action","bullets":["Christians and Jews teach the earth belongs to God (Psalm 24:1), so humans must not abuse it. Leviticus 25:23 describes the land as God's, with humans as tenants.","The Parable of the Talents (Matthew 25:14-30) is used to teach that God has entrusted humans with the world and expects them to use it wisely.","Pope Francis wrote the 2015 letter Laudato Si', on caring for 'our common home', which urges people to cut waste and pollution. St Francis of Assisi is the patron saint of ecology, and the Assisi gatherings brought together world faiths to promote conservation.","Jews also follow Tikkun Olam, bal tashchit and festivals such as Tu BiShvat (new year of the trees) when trees are planted."]},{"h":"What believers do","bullets":["Believers can recycle, save energy, travel less by car, plant trees, buy fair-trade and eco-friendly goods, and join groups such as Eco Church, A Rocha, CAFOD and Christian Aid.","Some believers argue that because Jesus said the poor are to be cared for, damaging the environment, which harms the poor most, is against his teaching (Matthew 25:40)."]}],"views":[{"label":"Christian","text":"Humans are stewards of God's creation, so abuse of the environment is wrong. Many stress that it also harms the poor and future generations. A few say dominion allows humans to use the earth as they wish, but this is a minority view."},{"label":"Jewish","text":"The world belongs to God. Tikkun Olam and bal tashchit teach that humans must repair the world and avoid waste."},{"label":"Non-religious","text":"Environmental protection is needed for human survival and welfare, based on science and concern for future generations."}],"terms":[{"term":"environment","def":"the world around us, natural or artificial"},{"term":"natural resources","def":"materials from nature such as oil, coal, water and trees"},{"term":"sustainable development","def":"progress that meets today's needs without harming future generations"},{"term":"deforestation","def":"cutting down large areas of forest"},{"term":"fossil fuels","def":"coal, oil and gas, which are non-renewable and release greenhouse gases"},{"term":"climate change","def":"long-term change in the world's weather patterns, linked to greenhouse gases"}],"sources":[{"text":"'The earth is the Lord's, and everything in it.'","ref":"Psalm 24:1","use":"Use it for any argument that humans must not abuse what belongs to God."},{"text":"'The land is mine and you reside in my land as foreigners and strangers.'","ref":"Leviticus 25:23","use":"Humans are tenants, not owners. Use for Jewish and Christian duty to care."},{"text":"The Parable of the Talents: servants must use what they are given wisely.","ref":"Matthew 25:14-30","use":"Use to explain that humans will be judged on how they use the world."},{"text":"'When you lay siege to a city... do not destroy its trees.'","ref":"Deuteronomy 20:19","use":"Source for the Jewish teaching bal tashchit, not to waste."}],"tip":"Link a religious teaching to an example of action, for example 'so a Christian might join Eco Church and reduce energy use'."},{"id":"tb-04","code":"Rel & Life.4 and 5 (pollution)","title":"Pollution","overview":"Pollution damages God's creation and harms people, animals and plants. Religious believers use stewardship and love of neighbour to argue that polluting is wrong.","notes":[{"h":"Types and causes of pollution","bullets":["**Pollution** is contamination of the environment with harmful substances. Air pollution comes from fumes from vehicles and factories and can cause asthma and climate change. Water pollution comes from oil spills, chemicals and waste, harming marine life. Land pollution comes from rubbish and chemicals.","Pollution grows as the population grows and technology develops. Examples include the Deepwater Horizon oil spill (2010) and plastic in the oceans."]},{"h":"Religious teachings","bullets":["Christians and Jews say polluting goes against stewardship, as the world is on loan from God and must be passed on in good condition (Psalm 24:1).","Pollution harms others, especially the poor and future generations, which goes against 'love your neighbour' (Matthew 22:39).","Pope Francis's Laudato Si' (2015) criticises waste and pollution and says the world is beginning to look like 'an immense pile of filth'. Jews also teach bal tashchit, not to waste or destroy."]},{"h":"Responses","bullets":["Believers can use public transport, cut waste, avoid single-use plastic, and campaign or donate through groups such as Christian Aid, CAFOD, A Rocha and Eco Church.","Governments sign agreements such as the Paris Agreement (2015) to reduce emissions."]}],"views":[{"label":"Christian","text":"Pollution is a failure of stewardship and harms the neighbours God asks us to love. Christians should reduce their own pollution and campaign for change."},{"label":"Jewish","text":"Pollution damages God's world and breaks bal tashchit. Jews are expected to repair the world through Tikkun Olam."},{"label":"Non-religious","text":"Pollution harms health and ecosystems, and should be reduced to protect people and future generations."}],"terms":[{"term":"pollution","def":"contamination of an environment with harmful substances"},{"term":"air pollution","def":"harmful gases and particles in the air, for example from vehicle fumes"},{"term":"climate change","def":"long-term change in the world's weather caused partly by greenhouse gas emissions"},{"term":"recycling","def":"processing waste to make new products"},{"term":"renewable energy","def":"energy from sources that do not run out, such as wind and solar"}],"sources":[{"text":"'The earth is the Lord's, and everything in it.'","ref":"Psalm 24:1","use":"The world is God's, so polluting it is abusing something that belongs to him."},{"text":"'Love your neighbour as yourself.'","ref":"Matthew 22:39","use":"Pollution harms other people, so polluting is unloving."},{"text":"Pope Francis: 'Care for our common home'.","ref":"Laudato Si' (2015)","use":"A modern Catholic source on waste and pollution."},{"text":"The Parable of the Talents.","ref":"Matthew 25:14-30","use":"Humans are responsible for what God has entrusted to them."}],"tip":"Name a type of pollution and its effect first, then the teaching, then a believer's action. This gives a clear chain of reasoning."},{"id":"tb-05","code":"Rel & Life.4 and 5 (animals)","title":"The use and abuse of animals","overview":"Christians and Jews believe animals are God's creatures and should be treated with kindness, but most also believe humans matter more. Expect questions on animal experimentation and eating animals.","notes":[{"h":"Value of animals","bullets":["Christians and Jews believe God created animals and called them good (Genesis 1:25). Jesus said God cares for sparrows (Luke 12:6), and Proverbs 12:10 says 'the righteous care for the needs of their animals'.","Humans are made in God's image and have dominion, so most believe human life matters more. Animals may be used, but never cruelly. Jews call the rule not to cause pain to living creatures **tza'ar ba'alei chayim**."]},{"h":"Animal experimentation","bullets":["**Animal experimentation** is using animals for medical research and testing products. In the UK it needs a licence and must follow the '3Rs': replace animals, reduce numbers, refine methods. Testing cosmetics on animals is banned in the UK.","Many Christians and Jews accept it if it saves human lives and animals do not suffer needlessly. The Catholic Catechism says such experiments are acceptable within reasonable limits if they help to care for human life.","Others say it is cruel and animals have rights, and that alternatives, such as computer models, exist. Some Christians, such as Andrew Linzey, argue that animals have God-given worth."]},{"h":"Eating animals","bullets":["Genesis 1:29 gives humans plants to eat, but after the flood God says 'Everything that lives and moves about will be food for you' (Genesis 9:3). Most Christians eat meat, though some choose to be vegetarian out of concern for animal welfare.","Jews may eat meat only if the animal is kosher and killed by the method called shechita, which is meant to be quick and humane. Jews cannot eat pork or shellfish and cannot eat meat with milk, and hunting for sport is discouraged."]}],"views":[{"label":"Christian (most)","text":"Animals are God's creatures to be treated with care. Humans can use animals for food and medical research if suffering is kept to a minimum."},{"label":"Christian (vegetarian or animal welfare)","text":"Animals have value to God, and unnecessary suffering is wrong. Some Christians choose to be vegetarian or oppose animal testing."},{"label":"Jewish","text":"Humans may use animals, but must avoid cruelty (tza'ar ba'alei chayim). Experiments are allowed to save human life if suffering is minimised. Eating meat is allowed if kosher."},{"label":"Non-religious","text":"Some think animal testing is justified for medicine, while others (such as animal rights supporters) say it is wrong to cause animals pain, or that animals have rights."}],"terms":[{"term":"animal experimentation","def":"using animals for medical research and product testing"},{"term":"vegetarian","def":"someone who does not eat meat or fish"},{"term":"vegan","def":"someone who does not eat or use any animal products"},{"term":"kosher","def":"food that is allowed by Jewish law"},{"term":"shechita","def":"the Jewish method of slaughtering animals for food"},{"term":"tza'ar ba'alei chayim","def":"the Jewish teaching not to cause pain to animals"}],"sources":[{"text":"'God made the wild animals according to their kinds... And God saw that it was good.'","ref":"Genesis 1:25","use":"Shows animals are valuable to God."},{"text":"'Everything that lives and moves about will be food for you.'","ref":"Genesis 9:3","use":"Used to show humans may eat animals."},{"text":"'The righteous care for the needs of their animals.'","ref":"Proverbs 12:10","use":"Use to show animals must be treated kindly, including in experiments."},{"text":"'Are not five sparrows sold for two pennies? Yet not one of them is forgotten by God.'","ref":"Luke 12:6","use":"Jesus shows that God cares about every creature."},{"text":"Catechism of the Catholic Church: animals may be used for medical research if it is reasonable and helps human lives, but needless suffering is wrong.","ref":"Catechism of the Catholic Church (CCC 2417-2418)","use":"Source for the Catholic view on experimentation."}],"tip":"AQA lists animal experimentation as one of three issues needing contrasting views. Give a 'for' view (saves human lives) and an 'against' view (animals suffer and have value to God)."},{"id":"tb-06","code":"Rel & Life.6","title":"The origins of human life","overview":"Christians and Jews believe God made humans, while science explains them through evolution. Questions ask how believers interpret Genesis and respond to Darwin.","notes":[{"h":"Religious teachings","bullets":["Genesis 1:27 says God created humans in his own image, on the sixth day. Genesis 2:7 says God formed Adam from the dust and 'breathed into his nostrils the breath of life'. Eve is formed from Adam's rib (Genesis 2:21-22).","Humans are special because they are made in the image of God (the **imago Dei**), have souls and are given responsibility for creation. This gives human life a value that animals do not have."]},{"h":"Evolution","bullets":["**Evolution** is the scientific theory that living things developed over millions of years from simple forms through **natural selection**: creatures best suited to their environment survive and pass on their genes. Charles Darwin set this out in On the Origin of Species (1859).","It suggests humans developed from earlier species and were not created separately, which seems to conflict with a literal reading of Genesis."]},{"h":"Religious responses","bullets":["Some Christians (creationists) and some Orthodox Jews take Genesis literally and reject evolution, or believe in intelligent design, the idea that life is too complex to have happened by chance.","Many Christians and Jews accept evolution as God's way of creating life, and read Genesis as symbolic: Genesis explains why God made humans and science explains how. The Catholic Church accepts evolution as long as God is seen as the creator of the soul.","Non-religious people such as atheists and humanists accept evolution and see no need for God to explain human life."]}],"views":[{"label":"Literal Christian (creationist)","text":"Genesis is the word of God, so humans were created by God as Adam and Eve and did not evolve."},{"label":"Catholic and liberal Christian","text":"God created life through evolution. Genesis is a symbolic story that teaches that God made humans in his image and gave them souls."},{"label":"Orthodox Jewish","text":"God created humans, as the Torah teaches. Some reject evolution; others accept it as God's method."},{"label":"Reform and Liberal Jewish","text":"Genesis is symbolic, and evolution is God's way of bringing about life."},{"label":"Non-religious","text":"Evolution by natural selection explains how humans developed, so no creator is needed."}],"terms":[{"term":"evolution","def":"the scientific theory that species develop over time through natural selection"},{"term":"natural selection","def":"the process in which creatures best suited to their environment survive and reproduce"},{"term":"image of God","def":"the belief that humans are made to reflect God, so have special value"},{"term":"creationism","def":"the belief that God created life as described in Genesis"},{"term":"intelligent design","def":"the belief that life is too complex to have happened by chance, so a designer must exist"}],"sources":[{"text":"'So God created mankind in his own image.'","ref":"Genesis 1:27","use":"Main source for human life being special and created by God."},{"text":"'The Lord God formed a man from the dust of the ground and breathed into his nostrils the breath of life.'","ref":"Genesis 2:7","use":"Shows that human life comes from God. Use it for the soul and sanctity of life."},{"text":"'You created my inmost being; you knit me together in my mother's womb.'","ref":"Psalm 139:13","use":"Shows God is involved in every human life."}],"tip":"Explain evolution as 'how' and religion as 'why'. This sentence is a common way for a student to show a Christian can accept science."},{"id":"tb-07","code":"AQA spec B8 (not separately listed by the school)","title":"The sanctity and quality of life","overview":"AQA expects you to understand the sanctity of life (life is sacred) and the quality of life (how good life is). These two ideas are the basis for every abortion and euthanasia question.","notes":[{"h":"Sanctity of life","bullets":["**Sanctity of life** is the belief that life is holy and special because it is created by God. Humans are made in God's image (Genesis 1:27), and God gives life and only God should take it.","Christians use 'You shall not murder' (Exodus 20:13) and 1 Corinthians 6:19, which says our bodies are temples of the Holy Spirit. Catholics teach that all human life from conception is sacred.","Judaism has the same belief. The principle of **pikuach nefesh** says saving a life overrides almost all other Jewish laws, including Sabbath rules."]},{"h":"Quality of life","bullets":["**Quality of life** means the standard of health, comfort and happiness a person has. Some people argue that a life of constant pain or suffering has a low quality, and it may be kinder to allow death or allow an abortion in some cases.","Many Christians, such as those who follow the Catholic Church, say the sanctity of life is more important than quality, because every life has value to God whatever its condition. Other Christians say compassion means that quality of life matters too, and that God would not want people to suffer needlessly."]}],"views":[{"label":"Catholic","text":"Life is a gift from God. Its sanctity does not depend on its quality, so abortion and euthanasia are wrong."},{"label":"Other Christians","text":"Life is sacred, but compassion and quality of life can sometimes be weighed against it, especially to prevent suffering."},{"label":"Jewish","text":"Life is sacred (pikuach nefesh). Saving life takes priority over almost every other rule. Quality of life is also considered, but actively ending life is not permitted."},{"label":"Non-religious","text":"Many value human life but say quality of life is just as important, and people should have the right to decide about their own lives."}],"terms":[{"term":"sanctity of life","def":"the belief that life is sacred because it is created by God"},{"term":"quality of life","def":"the standard of health, comfort and happiness a person experiences"},{"term":"pikuach nefesh","def":"the Jewish principle that saving life overrides almost all other laws"},{"term":"image of God","def":"the belief that humans reflect God, which gives them special value"}],"sources":[{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"Use for any argument that taking life is wrong. Note that some translations use 'kill'."},{"text":"'God created mankind in his own image.'","ref":"Genesis 1:27","use":"Shows why human life has special value."},{"text":"'Do you not know that your bodies are temples of the Holy Spirit?'","ref":"1 Corinthians 6:19","use":"Used to argue the body belongs to God, so people should not end their own lives."},{"text":"The Talmud: whoever saves one life saves the whole world.","ref":"Talmud, Sanhedrin 37a","use":"Jewish source for the value of life."}],"tip":"Define both terms and show they can clash. The 12-mark answers on abortion and euthanasia usually turn on sanctity versus quality of life."},{"id":"tb-08","code":"Rel & Life.7","title":"Abortion","overview":"Abortion is one of the three issues AQA says you must know contrasting views on. You need the law, Christian views (Catholic and Protestant), Jewish views and non-religious arguments.","notes":[{"h":"What it is and the law","bullets":["**Abortion** is the deliberate ending of a pregnancy. The Abortion Act 1967 made it legal in Britain under certain conditions, and the time limit is 24 weeks. Two doctors must agree that continuing the pregnancy would harm the woman's physical or mental health, or her existing children's.","After 24 weeks it is only allowed if the mother's life is at serious risk, there is a risk of grave permanent harm to her, or the foetus has a severe abnormality."]},{"h":"Christian views","bullets":["The Roman Catholic Church teaches that life begins at conception and abortion is always wrong because it ends an innocent life. It uses Jeremiah 1:5, Psalm 139:13 and the sanctity of life. Some Catholics accept a treatment which saves the mother and leads to the unintended death of the foetus.","The Church of England teaches that abortion is the taking of a life, but accepts it may be the lesser of two evils in limited cases, for example where the mother's life is at risk or after rape.","Some Christians, such as many Quakers and Methodists, say it is a matter of conscience and stress compassion for the woman."]},{"h":"Jewish and non-religious views","bullets":["Judaism values life highly, but traditionally teaches the foetus is not a full person until most of it is born. Abortion is allowed to save the mother's life (the mother's life comes first) and is generally discouraged without a serious reason. Reform Jews allow it for a wider range of reasons.","**Pro-life** supporters argue that life begins at conception and the unborn child has a right to life. **Pro-choice** supporters argue that a woman has the right to decide about her body and that quality of life matters. Many people argue it depends on how developed the foetus is (when it could survive outside the womb)."]}],"views":[{"label":"Roman Catholic","text":"Life begins at conception, so abortion is always wrong, even after rape. Alternatives such as adoption should be supported."},{"label":"Church of England","text":"Abortion is a serious matter and the unborn child has value, but it may be the lesser of two evils in limited circumstances such as a risk to the mother's life."},{"label":"Other Protestants (e.g. Methodist, Quaker)","text":"Life is sacred, but each situation is different and the woman's wellbeing matters. Many leave it to individual conscience."},{"label":"Orthodox Jewish","text":"The foetus is not a full person until birth, but is protected. Abortion is allowed if the mother's life or health is at serious risk."},{"label":"Reform Jewish","text":"Abortion is allowed in more circumstances, including serious risk to mental health."},{"label":"Non-religious (pro-choice)","text":"The woman has the right to choose what happens to her body, and a foetus is not yet a person."},{"label":"Non-religious (pro-life)","text":"The unborn child is a human being with a right to life, and abortion harms the child and sometimes the mother."}],"terms":[{"term":"abortion","def":"the deliberate ending of a pregnancy"},{"term":"pro-life","def":"the belief that the unborn child has a right to life, so abortion is wrong"},{"term":"pro-choice","def":"the belief that a woman has the right to choose whether to have an abortion"},{"term":"Abortion Act 1967","def":"the law making abortion legal in Britain under certain conditions"},{"term":"conception","def":"the moment when an egg is fertilised"},{"term":"foetus","def":"an unborn baby developing in the womb"}],"sources":[{"text":"'Before I formed you in the womb I knew you, before you were born I set you apart.'","ref":"Jeremiah 1:5","use":"Shows God knows and has a purpose for every person before birth. Use for the Catholic view."},{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"The commandment used by anti-abortion believers."},{"text":"'You knit me together in my mother's womb.'","ref":"Psalm 139:13","use":"Shows God's role in creating each person in the womb."},{"text":"Catechism of the Catholic Church: human life must be respected and protected absolutely from the moment of conception.","ref":"Catechism of the Catholic Church (CCC 2270)","use":"The official Catholic teaching."},{"text":"'Blessed are the merciful, for they will be shown mercy.'","ref":"Matthew 5:7","use":"Used by Christians who say compassion for the mother matters, so abortion may sometimes be allowed."}],"tip":"Use 'sanctity of life' versus 'quality of life' in every abortion answer, and mention the 24-week limit if the question is about the law."},{"id":"tb-09","code":"Rel & Life.8","title":"Euthanasia","overview":"Euthanasia is the third issue AQA requires contrasting views on. You need the types, the UK law, and Christian, Jewish and non-religious views.","notes":[{"h":"What it is and the law","bullets":["**Euthanasia** means painlessly ending the life of someone with an incurable or painful illness, to relieve suffering. It comes from Greek words meaning 'good death'. **Voluntary** euthanasia is at the patient's request, **non-voluntary** is when the patient cannot ask (for example in a coma), and **involuntary** is against the patient's wishes (this is murder). **Assisted suicide** means helping someone to end their own life.","In England and Wales, euthanasia and assisted suicide are illegal. The Suicide Act 1961 made suicide legal, but helping someone is a crime with up to 14 years in prison. Doctors may stop treatment that is not helping, and may give pain relief that might shorten life. Parliament has debated changing the law, so check current news. Some countries, including Switzerland, the Netherlands and parts of the USA, allow forms of it."]},{"h":"Christian views","bullets":["The Catholic and Church of England teaching is that euthanasia is wrong because life is a gift from God and only God should end it ('You shall not murder'). They say it is wrong to take life and that suffering can have a purpose.","Christians point to **hospices** and **palliative care**, which relieve pain and allow people to die with dignity without ending life. They also worry that legal euthanasia could pressure vulnerable people.","Some Christians accept euthanasia, saying that love and mercy ('Blessed are the merciful') mean it is kind to end unbearable suffering, and that God gave humans free will."]},{"h":"Jewish and non-religious views","bullets":["Orthodox Judaism says life belongs to God, so active euthanasia is forbidden and counts as murder. Some allow doctors to stop prolonging dying, for example by switching off a machine that only delays death. Reform Jews are more open to allowing a dignified death.","Many non-religious people, such as humanists, support voluntary euthanasia because people should have control over their own lives and a right to a dignified death. Others worry about pressure on the elderly and disabled, and about mistakes."]}],"views":[{"label":"Roman Catholic","text":"Euthanasia is always wrong because life is sacred and belongs to God. Pain should be relieved through palliative care, not by ending life."},{"label":"Church of England","text":"Euthanasia is wrong and the law should not be changed. The Church supports hospices and care for the dying."},{"label":"Liberal Christian","text":"Compassion may justify ending suffering when a person clearly asks for it. Love and mercy are central."},{"label":"Orthodox Jewish","text":"Active euthanasia is forbidden, but treatment that only prolongs dying need not be given."},{"label":"Reform Jewish","text":"More willing to accept a person's choice for a dignified death in some cases."},{"label":"Non-religious","text":"People should have the right to choose a dignified death, with safeguards. Others worry about pressure on vulnerable people."}],"terms":[{"term":"euthanasia","def":"ending the life of someone who is suffering, to relieve pain; also called assisted suicide in some cases"},{"term":"voluntary euthanasia","def":"euthanasia carried out at the patient's own request"},{"term":"non-voluntary euthanasia","def":"euthanasia when the patient cannot ask, for example because they are unconscious"},{"term":"assisted suicide","def":"helping someone to end their own life"},{"term":"hospice","def":"a place that gives care to the dying, to ease pain and offer support"},{"term":"palliative care","def":"medical care that eases pain and symptoms for people near the end of life"}],"sources":[{"text":"'You shall not murder.'","ref":"Exodus 20:13","use":"Used to argue that euthanasia is wrong."},{"text":"'A time to be born and a time to die.'","ref":"Ecclesiastes 3:1-2","use":"Shows death is in God's timing. Use it for Jewish and Christian opposition."},{"text":"'Blessed are the merciful, for they will be shown mercy.'","ref":"Matthew 5:7","use":"Used by Christians who say euthanasia can be a loving act."},{"text":"'Your bodies are temples of the Holy Spirit.'","ref":"1 Corinthians 6:19","use":"Shows the body is God's, so we should not end life."}],"tip":"Use the correct type of euthanasia in the answer. Say 'voluntary' or 'assisted suicide' and show you know the law is the same for both."},{"id":"tb-10","code":"Rel & Life.9","title":"Death and the afterlife","overview":"Christians and Jews believe death is not the end, and this affects how they live and how they see the value of life. AQA also expects non-religious views and arguments for and against life after death.","notes":[{"h":"Christian beliefs","bullets":["Christians believe in life after death, because Jesus rose from the dead (resurrection) and promised eternal life (John 11:25-26). Most believe the soul lives on, and many believe in a bodily resurrection (1 Corinthians 15).","They believe God will judge each person (Matthew 25:31-46) and people go to **heaven** (eternal life with God, no pain or death, Revelation 21:4) or **hell** (separation from God). Catholics also believe in **purgatory**, where souls are cleansed before heaven. Some Protestants say salvation comes by faith and grace."]},{"h":"Jewish beliefs","bullets":["Jewish teaching about the afterlife is less detailed. Many Jews believe in **Olam Ha-Ba** (the world to come) and that the Messiah will bring a time of peace. Orthodox Jews believe God will raise the dead at the end of time, and so avoid cremation. Reform and Liberal Jews often believe in the soul living on rather than bodily resurrection.","Jews believe God judges people, and that Gehinnom is a temporary place of cleansing, not eternal punishment. The main focus is living a good life now, following the mitzvot."]},{"h":"Effect on life and non-religious views","bullets":["Belief in judgement and an afterlife encourages Christians and Jews to live morally, help others and value human life as precious, because it is a gift leading to eternity.","Atheists and humanists believe death is the end, so this life is all we have and should be lived fully. Some non-religious people point to evidence such as near-death experiences, and some argue that there is no scientific proof of an afterlife.","Arguments for life after death include the resurrection of Jesus, religious experiences, near-death experiences and the idea that the soul is separate from the body. Arguments against include no scientific evidence, the dependence of the mind on the brain, and the view that heaven is just comforting wish-fulfilment."]}],"views":[{"label":"Catholic","text":"The soul is immortal. After death there is judgement, then heaven, hell or purgatory. The body will be resurrected at the end of time."},{"labe
